<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Heart rate (wrist tile)</title>
<!-- 手首のタイル 1 マス（幅 112 px、高さ 90〜102 px）に開くページ。IWristShortcut.Page の例。
     **地は描かない**（タイルの地が透けて見える）。色はテーマから。 -->
<link rel="stylesheet" href="/_host/theme.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--fg);
    font-family: var(--font-ui);
    user-select: none;
  }
  .line { width: 88px; height: 22px; overflow: visible; }
  .line polyline { fill: none; stroke: var(--tone-rose); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .bpm { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font-size: 11px; line-height: 1; color: var(--muted); }
  /* 繋がっていない・肌に触れていない。数字は出さない（0 は嘘になる）。 */
  body.off .bpm { color: var(--muted); }
  body.off .line { visibility: hidden; }
</style>
</head>
<body class="off">

<svg class="line" viewBox="0 0 88 22" preserveAspectRatio="none" aria-hidden="true"><polyline id="line" points=""/></svg>
<div class="bpm" id="bpm">--</div>
<div class="unit">bpm</div>

<script src="/_host/bridge.js"></script>
<script>
// 今の心拍と、直近 1 分ほどの線。**正は C# 側**で、開いたときに取り直し（getHeartRate）、あとは push（status）で受ける。
// **ページは描くだけ。** 押す・引くはページに届かない（タイルが受けて、C# の HrsLiveTile.OnTriggerAsync がパネルを開く）。

const el = { bpm: document.getElementById('bpm'), line: document.getElementById('line') };

/** 線に使う数（1 秒に 1 拍の報せなので、だいたい 1 分）。 */
const RECENT = 60;

function render(status) {
  const bpm = status?.heartRate ?? 0;
  const live = !!status?.connected && bpm > 0;
  document.body.classList.toggle('off', !live);
  el.bpm.textContent = live ? String(bpm) : '--';

  const recent = (status?.samples ?? []).slice(-RECENT).map(s => s.bpm).filter(b => b > 0);
  if (recent.length < 2) {
    el.line.setAttribute('points', '');
    return;
  }

  // 上下に少し余白を持たせて、揺れが平らに見えすぎないようにする。
  const low = Math.min(...recent) - 3;
  const high = Math.max(...recent) + 3;
  el.line.setAttribute('points', recent
    .map((b, i) => `${(i / (recent.length - 1) * 88).toFixed(1)},${(21 - (b - low) / (high - low) * 20).toFixed(1)}`)
    .join(' '));
}

spoitable.onPush((channel, payload) => {
  if (channel === 'status') render(payload);
});

spoitable.whenReady
  .then(() => spoitable.call('getHeartRate'))
  .then(render)
  .catch(() => render(null));
</script>

</body>
</html>
