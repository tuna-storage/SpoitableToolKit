<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Heart Rate — Widget</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1.08)}}
.widget{width:680px;padding:24px 32px;background:rgba(26,26,46,.92);border-radius:20px;border:1px solid rgba(58,134,255,.2)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-size:22px;color:#ccc;font-weight:500}
.hr{display:flex;align-items:center;gap:14px}
.heart{font-size:36px;color:#e74c6f;animation:heartbeat var(--beat,.85s) ease-in-out infinite}
.bpm{font-size:56px;font-weight:700;color:#eee;font-variant-numeric:tabular-nums}
.unit{font-size:24px;color:#ccc}
.graph{height:104px;overflow:hidden;border-radius:8px}
.graph canvas{width:100%;height:100%;display:block}
.bot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:20px}
.zone{font-weight:600;text-transform:uppercase}
.stats{color:#999}
.stats b{color:#eee;font-weight:600}
body.off .heart{animation:none;opacity:.35}
body.off .bpm{color:#888}
</style></head><body>
<div class="widget">
  <div class="top">
    <span class="brand">SpoitableToolKit</span>
    <div class="hr">
      <span class="heart">&#9829;</span>
      <span class="bpm" id="bpm">--</span>
      <span class="unit">BPM</span>
    </div>
  </div>
  <div class="graph"><canvas id="cv"></canvas></div>
  <div class="bot">
    <span class="zone" id="zone" style="color:#2ecc71">Rest Zone</span>
    <span class="stats">avg:<b id="avg">--</b> min:<b id="min">--</b> max:<b id="max">--</b></span>
  </div>
</div>
<script>
const hist = [], MAX = 60;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

function draw() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (hist.length < 2) return;
  const mn = Math.min(...hist) - 3, mx = Math.max(...hist) + 3, rng = mx - mn;
  const g = ctx.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, 'rgba(58,134,255,.12)'); g.addColorStop(1, 'rgba(58,134,255,.02)');
  ctx.strokeStyle = '#3a86ff'; ctx.lineWidth = 1.5 * devicePixelRatio; ctx.lineJoin = 'round'; ctx.beginPath();
  const s = cv.width / (MAX - 1), o = MAX - hist.length;
  hist.forEach((v, i) => { const x = (o + i) * s, y = cv.height - ((v - mn) / rng) * cv.height; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke();
  ctx.lineTo((o + hist.length - 1) * s, cv.height); ctx.lineTo(o * s, cv.height); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
}

const zones = { rest: { l: 'Rest Zone', c: '#2ecc71' }, light: { l: 'Light Zone', c: '#3a86ff' }, moderate: { l: 'Moderate Zone', c: '#f39c12' }, hard: { l: 'Hard Zone', c: '#e74c3c' } };
const p = new URLSearchParams(location.search), port = p.get('port') || location.port || '9100';
const el = { bpm: document.getElementById('bpm'), zone: document.getElementById('zone'), avg: document.getElementById('avg'), min: document.getElementById('min'), max: document.getElementById('max') };

function offline() { document.body.classList.add('off'); el.bpm.textContent = '--'; }

function apply(d) {
  if (d.connected === false) offline();
  else if (d.connected === true) document.body.classList.remove('off');
  // 心拍計の名前はここには出さない（銘板の枠なので、HDS だと IP が居座って読みにくい）。
  // 名前を出すのは glass。
  if (d.history && d.history.length) { hist.push(...d.history); while (hist.length > MAX) hist.shift(); draw(); }
  if (d.bpm !== undefined && d.bpm > 0 && d.connected !== false) {
    el.bpm.textContent = d.bpm;
    document.documentElement.style.setProperty('--beat', (60 / d.bpm).toFixed(2) + 's');
    hist.push(d.bpm); if (hist.length > MAX) hist.shift(); draw();
  }
  if (d.zone && zones[d.zone]) { el.zone.textContent = zones[d.zone].l; el.zone.style.color = zones[d.zone].c; }
  if (d.avg !== undefined) { el.avg.textContent = d.avg || '--'; el.min.textContent = d.min || '--'; el.max.textContent = d.max || '--'; }
}

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.hostname || 'localhost'}:${port}/ws`);
  ws.onmessage = e => apply(JSON.parse(e.data));
  ws.onclose = () => { offline(); setTimeout(connect, 2000); };
}
// パネルの配信タブのプレビュー（パネルと同じ origin の spoitable://hrs/overlays/<名前>.html?preview）。WebSocket は開かず、
// パネルが中継する同じ形の 1 通を受ける。受けるのは親（パネル）から、同じ origin のものだけ。OBS が開く http://localhost の頁はここに入らない。
if (location.protocol === 'spoitable:' && p.has('preview')) {
  addEventListener('message', e => { if (e.source === parent && e.origin === location.origin && e.data) apply(e.data); });
} else {
  connect();
}
</script></body></html>
