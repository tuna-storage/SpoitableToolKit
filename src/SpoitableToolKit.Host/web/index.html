    // 印（変更あり・弾かれた）と、探している間の当たった数。
    const mark = Object.assign(document.createElement('span'), { className: 'mark' });
    mark.setAttribute('aria-hidden', 'true');
    button.append(cell('name', page.title), mark, cell('hits', ''));

    button.addEventListener('click', () => selectCfgPage(page.id));
    return button;
  };

  const host = pages.filter(page => page.host);
  const modules = pages.filter(page => !page.host);
  el.cfgNav.replaceChildren(
    ...(host.length ? [navHeading('host.nav.host'), ...host.map(item)] : []),
    ...(modules.length ? [navHeading('host.nav.modules'), ...modules.map(item)] : []));
  markCfgNav();
}

/**
 * ページを開く。**探していたら探すのをやめる**（探している間は全部のページから出しているので、押したのは「このページを見たい」）。
 * ページは先頭から。
 */
function selectCfgPage(id) {
  cfgPage = id;
  if (el.cfgSearch.value) el.cfgSearch.value = '';
  applyCfgSearch();
  el.cfgScroll.scrollTo({ top: 0, behavior: 'instant' });
  markToc();
}

function markCfgNav() {
  const searching = !!el.cfgSearch.value.trim();
  const dirty = new Set([...pending.values()].map(p => cfgPageOf.get(pendingKey(p.module, p.key)) ?? p.module));

  for (const item of el.cfgNav.querySelectorAll('.cfg-nav-item')) {
    const id = item.dataset.page;

    // 探している間はどのページも「開いている」ではない（全部のページから出している）。
    const on = id === cfgPage && !searching;
    item.classList.toggle('on', on);
    if (on) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current');

    const section = el.cfgList.querySelector(`.cfg-group[data-page="${CSS.escape(id)}"]`);
    item.classList.toggle('dirty', dirty.has(id));
    item.classList.toggle('bad', !!section?.querySelector('.cfg-note.bad'));
  }
}

// 右の目次。束ねの見出しを持つのはモジュールのページだけ（本体のページは束ね 1 つで見出しを描かない）なので、目次もモジュールだけに出る。
// 探している間はページをまたいで出すので、目次は出さない。

/** 目次を押して巻いている間の行き先。巻き終わるまで印を動かさない（下の端で止まると、押した束ねより下の束ねに印が移ってしまう）。 */
let tocChosen = null;

function renderToc() {
  tocChosen = null;
  const section = el.cfgSearch.value.trim() ? null : el.cfgList.querySelector(`.cfg-group[data-page="${CSS.escape(cfgPage ?? '')}"]`);
  const subs = section ? [...section.querySelectorAll('.cfg-sub')] : [];

  el.cfgToc.replaceChildren(...(subs.length
    ? [tocLink('toc-top', section.querySelector('.cfg-head h2').textContent, section), ...subs.map(sub => tocLink('toc-sub', sub.textContent, sub))]
    : []));
  el.cfgToc.hidden = !subs.length;
  markToc();
}

function tocLink(className, label, target) {
  const link = document.createElement('button');
  link.type = 'button';
  link.className = className;
  link.textContent = label;
  link._target = target;
  link.addEventListener('click', () => {
    const box = el.cfgScroll;
    const top = Math.max(0, Math.min(target.offsetTop - el.cfgList.offsetTop - 8, box.scrollHeight - box.clientHeight));

    // 動かないとき（もう着いている・下の端）は scroll が来ないので、印を付けるだけ。
    tocChosen = Math.abs(top - box.scrollTop) >= 1 ? link : null;
    markToc(link);
    box.scrollTo({ top, behavior: scrollMotion() });
  });
  return link;
}

/** いま読んでいる束ねに目次の印を付ける（上端を越えた最後の見出し。下の端まで巻いたら最後の見出し）。 */
function markToc(chosen = tocChosen) {
  const links = [...el.cfgToc.children];
  let current = chosen;
  if (!current) {
    const box = el.cfgScroll;
    const edge = box.scrollTop + 24;
    const atEnd = box.scrollTop > 0 && box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
    for (const link of links)
      if (link._target.offsetParent !== null && (atEnd || link._target.offsetTop - el.cfgList.offsetTop <= edge)) current = link;
    current ??= links[0];
  }
  for (const link of links) link.classList.toggle('on', link === current);
}

/**
 * 探すときに当てる字。値の行は行の字ぜんぶ。**動きの行は名前と説明だけ** — 札・説明の文・ボタン・「変更を適用すると使えます」・コピーの字とコマンドは
 * 状態で入れ替わり、隠れていることもある（「コピー」や「適用」で、見えていない字に当たって行が出てしまう）。
 */
function searchableText(row) {
  if (!row) return '';
  return row._action ? `${row._label}\n${row._description}` : row.textContent;
}

/**
 * 設定の中を探す。**当たらない行・空になった囲み・見出しは畳む**（値は溜めたまま残る）。
 * 探していなければ、**開いているページだけ**を出す。探している間は**ページをまたいで**当たったページを見出しごと全部出し、一覧に当たった数を出す。
 */
function applyCfgSearch() {
  const needle = el.cfgSearch.value.trim().toLowerCase();
  let any = false;

  for (const section of el.cfgList.querySelectorAll('.cfg-group')) {
    let hits = 0;
    for (const box of section.querySelectorAll('.cfg-box')) {
      const wraps = [...box.querySelectorAll(':scope > .cfg-row')];
      const depthOf = wrap => Number(wrap.querySelector('.cfg-item')?.dataset.depth ?? 0);
      const hit = wraps.map(wrap => !needle || searchableText(wrap.querySelector('.cfg-item')).toLowerCase().includes(needle));

      // 当たった行が入れ物の中なら、入れ物の見出しも出す。中が切で閉じていても、見出しのスイッチから開ける
      // （出さないと、当たった数だけ出て中身の無い囲みが残る）。
      const shown = [...hit];
      wraps.forEach((wrap, i) => {
        if (!hit[i]) return;
        for (let j = i - 1, depth = depthOf(wrap); j >= 0 && depth > 0; j--)
          if (depthOf(wraps[j]) < depth) { shown[j] = true; depth = depthOf(wraps[j]); }
      });

      wraps.forEach((wrap, i) => wrap.classList.toggle('nomatch', !shown[i]));
      hits += hit.filter(Boolean).length;
      const boxHit = shown.some(Boolean);
      box.hidden = !boxHit;
      const sub = box.previousElementSibling;
      if (sub?.classList.contains('cfg-sub')) sub.hidden = !boxHit;
    }
    section.hidden = needle ? hits === 0 : section.dataset.page !== cfgPage;
    if (hits) any = true;

    const item = el.cfgNav.querySelector(`.cfg-nav-item[data-page="${CSS.escape(section.dataset.page)}"]`);
    if (item) {
      item.querySelector('.hits').textContent = needle && hits ? String(hits) : '';
      item.classList.toggle('nohit', !!needle && !hits);
    }
  }

  el.cfgNoMatch.hidden = !needle || any;
  markCfgNav();
  renderToc();
}

// 発信元の iframe から呼び出し元モジュールを決める。モジュールが自分で名乗る余地は作らない。
function ownerOf(source, origin) {
  for (const [id, view] of views) {
    if (view.tagName !== 'IFRAME' || view.contentWindow !== source) continue;

    // contentWindow は中で遷移しても同じものが残る。origin まで見ないと、
    // 別モジュールのページへ移動したあとも元の Id で通ってしまう。
    const expected = panels.get(id)?.origin;
    return origin === expected ? { id, origin: expected } : null;
  }
  return null;
}

// C# 側からの push を宛先モジュールの iframe へ渡す。
//
// 届け先はホストが決めた module なので、シェルは「その iframe を持っているか」だけを見る。
// パネルが開かれていなければ捨てる（iframe は初めて選ばれたときに作られる）。取りこぼしても、
// パネルは読み込み時に自分で現在値を取りに行く約束になっている（シェルの getStatus() と同じ規律）。
//
// 表示中かどうかは見ない。裏に回っているパネルも、次に表に出たときに正しい見た目でなければならない。
// ホスト自身の都合で起きる push（テーマ・言語）は**宛先が無い**ので、
// deliverPush では届かない（あれは module が決まっているものだけを配る）。
// 開いているパネル全部へ配る道を別に持つ。
//
// **これが無いと、パネルは読み込み直しでしか追いつけない。** そして読み込み直しは、
// 前の読み込みが終わっていないと無視される。
function broadcastToPanels(channel, payload) {
  for (const [id, entry] of panels) {
    const view = views.get(id);
    if (!entry.ready || !view || view.tagName !== 'IFRAME') continue;

    view.contentWindow.postMessage({ stk: 1, kind: 'push', channel, payload }, entry.origin);
  }
}

function deliverPush(message) {
  const entry = panels.get(message.module);
  const view = views.get(message.module);
  if (!entry || !entry.ready || !view || view.tagName !== 'IFRAME') return;

  view.contentWindow.postMessage(
    { stk: 1, kind: 'push', channel: message.channel, payload: message.payload }, entry.origin);
}

// ホストの機能はここに並べたものだけを中継する。
// モジュールのページからも CefSharp.BindObjectAsync('stkHost') は通る（bind はブラウザ単位）が、
// **token が無いので呼べない**。したがってこの allowlist が本当にモジュールの持てる全部になる。
async function callHostService(method, payload, owner) {
  // 右クリックのメニュー。**描くのはシェル**なので、ここは頼まれて出すだけ。
  // 持ち主は呼び出し元が名乗ったものではなく、origin から決まったものが渡ってくる。
  if (method === 'contextMenu')
    return panelContextMenu(payload, owner);

  if (method === 'copyToClipboard')
    return { ok: true, result: await bridge.copyToClipboard(String(payload?.text ?? '')) };

  // 画面の文言。パネルは自分の分だけでなく全部受け取るが、**キーは持ち主で始まる**ので
  // 混ざらないし、他のモジュールの文言が漏れて困る種類のものでもない。
  if (method === 'strings')
    return { ok: true, result: await bridge.getStrings() };

  return { ok: false, error: t('host.error.notAllowed', method) };
}

window.addEventListener('message', async event => {
  const message = event.data;
  if (!message || message.stk !== 1) return;

  const owner = ownerOf(event.source, event.origin);
  if (!owner) return;

  if (message.kind === 'pointerdown') {
    // **パネルの中で押された**（bridge.js が知らせてくる）。iframe の中の mousedown はシェルの窓に届かないので、
    // これが無いと、パネルの中で右クリックしてからパネルの別の所を押してもメニューが開いたままになる。
    // 次の右クリックの頼みはこの後に届くので、ここで閉じても開き直しは邪魔しない。
    dismissMenu?.();
    return;
  }

  if (message.kind === 'escape') {
    // **パネルの中で Escape が押された**（bridge.js が、そのパネルのメニューが開いている間だけ知らせてくる）。
    // パネルの中に焦点があると、キーはシェルの窓に届かないので、これが無いと Escape でメニューが閉じなかった。
    dismissMenu?.();
    return;
  }

  if (message.kind === 'ready') {
    // push はここから先だけ届く。読み込み中の iframe へ postMessage しても、
    // 中身はまだ初期の about:blank なので黙って消える。
    const entry = panels.get(owner.id);
    entry.ready = true;

    // 読み込み中に設定（テーマ）が変わっていた。取りこぼした知らせをここで渡す。
    if (entry.missedConfig) {
      entry.missedConfig = false;
      event.source.postMessage({ stk: 1, kind: 'push', channel: 'configChanged', payload: {} }, owner.origin);
    }
    return;
  }

  const reply = body => event.source.postMessage({ stk: 1, id: message.id, ...body }, owner.origin);

  try {
    if (message.kind === 'module') {
      const response = await bridge.callModule(owner.id, message.method, JSON.stringify(message.payload ?? {}));
      reply(response.ok ? { ok: true, result: JSON.parse(response.result) } : { ok: false, error: response.error });
    } else if (message.kind === 'host') {
      reply(await callHostService(message.method, message.payload, owner));
    } else {
      reply({ ok: false, error: t('host.error.unknownKind', message.kind) });
    }
  } catch (err) {
    reply({ ok: false, error: String((err && err.message) || err) });
  }
});

// ホストの窓口。**token を挟むのはここ 1 か所**。
//
// stkHost の各メソッドは第 1 引数に token を要求する。bind はブラウザ単位なので、
// モジュールの iframe からも CefSharp.BindObjectAsync('stkHost') は通ってしまう。
// 塞いでいるのは bind ではなく**呼び出し**で、 token はホストがシェルのフレームにだけ
// 置いていく（window.__stkToken）。別 origin のモジュールからは同一生成元ポリシーで読めない。
//
// 呼ぶ側が毎回書くと**いつか 1 か所で忘れる**ので、ここで包んで隠す。
const bridge = (() => {
  const token = window.__stkToken;

  // 読んだら消す。あとからメインフレームで動く何かに拾わせない。
  delete window.__stkToken;

  const call = name => (...args) => stkHost[name](token, ...args);

  // 本体が JSON で返す口（push と同じ形で届く）。読んでから渡す。
  const parsed = name => async (...args) => JSON.parse(await stkHost[name](token, ...args));

  return {
    getStatus: call('getStatus'),
    setHiddenKinds: call('setHiddenKinds'),
    setCollapsedCategories: call('setCollapsedCategories'),
    queryAppLogs: call('queryAppLogs'),
    queryLog: call('queryLog'),
    getModules: call('getModules'),
    callModule: call('callModule'),
    getConfigs: call('getConfigs'),
    previewConfigs: call('previewConfigs'),
    getStrings: call('getStrings'),
    applyConfigChanges: call('applyConfigChanges'),
    runConfigAction: call('runConfigAction'),
    answerNotification: call('answerNotification'),
    optOutNotification: call('optOutNotification'),
    answerNotificationLate: call('answerNotificationLate'),
    closeToast: call('closeToast'),
    invokeToastAction: call('invokeToastAction'),
    closeBanner: call('closeBanner'),
    invokeBannerAction: call('invokeBannerAction'),
    copyToClipboard: call('copyToClipboard'),
    getContextMenu: call('getContextMenu'),
    invokeContextMenu: call('invokeContextMenu'),
    minimizeWindow: call('minimizeWindow'),
    toggleMaximizeWindow: call('toggleMaximizeWindow'),
    closeWindow: call('closeWindow'),
    beginWindowDrag: call('beginWindowDrag'),
    closeVrWindow: call('closeVrWindow'),
    vrWindowViewing: call('vrWindowViewing'),
    getVrWindowView: call('getVrWindowView'),
    getVrLayout: call('getVrLayout'),

    // 手首のショートカットの台帳（手首のページと同じ口）。押す口・タイルの押し引きの口は、シェルからは今は試験だけが使う（本物の台帳と判定を通して確かめる）。
    getShortcuts: call('getShortcuts'),
    pressShortcut: call('pressShortcut'),
    shortcutPointer: call('shortcutPointer'),

    getModuleCatalog: parsed('getModuleCatalog'),
    checkModuleUrl: parsed('checkModuleUrl'),
    hideModuleAgreement: call('hideModuleAgreement'),
    startModuleJob: parsed('startModuleJob'),
    getModuleJobs: parsed('getModuleJobs'),
    answerModuleJob: call('answerModuleJob'),
    cancelModuleJob: call('cancelModuleJob'),
    retryModuleJob: call('retryModuleJob'),
    cancelPendingModule: parsed('cancelPendingModule'),
    checkModuleUpdates: parsed('checkModuleUpdates'),
    setModuleEnabled: parsed('setModuleEnabled'),
    setModuleRemoval: parsed('setModuleRemoval'),
    restartApp: call('restartApp'),
    getAppUpdate: parsed('getAppUpdate'),
    checkAppUpdate: parsed('checkAppUpdate'),
    installAppUpdate: parsed('installAppUpdate'),
    skipAppUpdate: parsed('skipAppUpdate'),
    getAppUpdateNotes: parsed('getAppUpdateNotes'),
    getLicenses: parsed('getLicenses'),
    openChromiumCredits: call('openChromiumCredits'),
  };
})();

// テーマを引き直すときの版。**時刻ではなく数える** — Date.now() はミリ秒までなので、
// 続けて切り替えると同じ URL になって再取得が起きない。
// **読み込みごとの印も付ける**。数えるだけだと、読み込み直したところで 1 から数え直して、
// 前に取った `?v=11`（前の配色のまま CEF に残っている）とぶつかり、切り替えても何も変わらない。
let themeVersion = 0;
const themeLoad = Date.now().toString(36);

// **既定のメニューは C# 側で止めてある**（ContextMenuBlocker）。ここは代わりに出す方。
// JS の preventDefault も入れるが、それは保険 — 止めているのは C# で、
// こちらが動かなくてもブラウザのメニューは出ない。
//
// **ホストは DOM を見られない。** CEF が渡してくるものに「どの要素か」は入っていないので、
// 何の上で押されたかはこちら側が名乗る（data-context を親へ辿る）。
// 判断に要る材料も一緒に運ぶので、ホストは画面を知らないまま項目を決められる。
//
// **描くのはここ 1 箇所**。モジュールの iframe で起きた右クリックも、
// シェルが窓の座標に直して同じメニューを出す（iframe の中には描かせない）。

// data-context の値ごとの「材料の出し方」。**押されたときだけ呼ぶ**ので、
// 500 行ぶんの本文を属性に持たせておく必要が無い。
const contextExtractors = new Map();

function registerContext(key, extract) {
  contextExtractors.set(key, extract);
}

/**
 * 押された場所の名乗りを組む。
 *
 * ⚠ **選択中の文字は 2 通りある。** window.getSelection() は `<input>` の中の選択を返さない
 * ので、入力欄では selectionStart / selectionEnd から取る。片方だけ見ていると
 * 「入力欄で文字を選んでコピー」が空を書く。
 */
function nameContext(event) {
  const at = event.target instanceof Element ? event.target : event.target?.parentElement ?? null;
  const named = at?.closest('[data-context]') ?? null;
  const field = at?.closest('input, textarea') ?? null;

  // ⚙ **選択を持てる型だけ**を入力欄として扱う。
  // type=number や datetime-local は selectionStart が null で、setRangeText は
  // **InvalidStateError を投げる**。出してしまうと
  // 「貼り付けが押せるのに何も入らない」になる。Ctrl+C / Ctrl+V は元から生きている。
  //
  // **型の一覧で見る**（selectionStart を覚えて見ない）。見え方は版で変わりうるが、
  // この一覧は仕様が決めているものなのでぶれない。
  const editable = !!field && !field.disabled && !field.readOnly
    && (field.tagName === 'TEXTAREA' || ['text', 'search', 'url', 'tel', 'password'].includes(field.type));

  const start = field?.selectionStart ?? 0;
  const end = field?.selectionEnd ?? 0;

  const key = named?.dataset.context ?? '';
  let data = {};
  if (named) {
    try { data = contextExtractors.get(key)?.(named) ?? {}; }
    catch (err) { console.error('材料の取り出しで例外', err); }
  }

  return {
    request: {
      key,
      editable,
      secret: field?.type === 'password',
      selectionText: editable ? String(field.value ?? '').slice(start, end) : String(window.getSelection() ?? ''),
      data,
    },

    // 押した時点の入力欄と範囲を**覚えておく**。メニューを押す頃には焦点が移っていて、
    // そのとき読み直すと空になっている。setRangeText は焦点が外れていても効く。
    field: editable ? field : null,
    start,
    end,
  };
}

/**
 * ホストに項目を聞く。**シェルの分もパネルの分もここを通す。**
 *
 * 動作確認用に**考え終わった回数**を数える — 「出さない」を見る試験は、
 * 往復が終わったことを待てないと**まだ出ていないだけの状態**を見て緑になる。
 */
async function decideContextMenu(request) {
  const items = await bridge.getContextMenu(JSON.stringify(request));

  const seam = window.__stkCtx ??= { turns: 0 };
  seam.turns++;
  seam.items = items.length;

  return items;
}

let closeMenu = null;

/**
 * 何も押さずに閉じる（<b>onClose まで呼ぶ</b>）。パネルの頼みには、これで「何も押さなかった」の返事が返る
 * （closeMenu だと返事が返らず、パネルの右クリックの処理が待ったまま残る）。
 */
let dismissMenu = null;

/**
 * メニューを描く。**空の配列では呼ばない**（空の箱は「壊れている」ようにしか見えない）。
 *
 * @param onPick 項目が押された。返り値は待たない。
 * @param onClose 何も押さずに閉じた。
 */
function openContextMenu(items, x, y, onPick, onClose) {
  // 開いているものは「押さずに閉じた」として畳む（パネルの前の頼みに返事を返す）。
  dismissMenu?.();

  const menu = el.ctxMenu;
  menu.textContent = '';

  for (const item of items) {
    if (item.separator) {
      menu.appendChild(document.createElement('hr'));
      continue;
    }

    const button = document.createElement('button');
    button.textContent = t(item.labelKey);
    button.disabled = !item.enabled;

    // 印も置く。**画面には出ないが、試験は文言ではなくこちらを見る** —
    // 文言で見ると、言語を変える試験の後ろで走ったときに落ちる。
    button.dataset.id = item.id;
    button.dataset.labelKey = item.labelKey;
    button.onclick = () => {
      close();
      onPick(item);
    };

    menu.appendChild(button);
  }

  menu.hidden = false;

  // 出してから測る。**先に測ると幅も高さも 0**（hidden のうちは箱を持たない）。
  const box = menu.getBoundingClientRect();
  const margin = 4;
  menu.style.left = Math.max(margin, Math.min(x, window.innerWidth - box.width - margin)) + 'px';
  menu.style.top = Math.max(margin, Math.min(y, window.innerHeight - box.height - margin)) + 'px';

  function close() {
    if (closeMenu !== close) return;

    closeMenu = null;
    dismissMenu = null;
    menu.hidden = true;
    menu.textContent = '';

    window.removeEventListener('mousedown', outside, true);
    window.removeEventListener('keydown', escape, true);
    window.removeEventListener('blur', dismiss);
    window.removeEventListener('resize', dismiss);
    document.removeEventListener('scroll', dismiss, true);
  }

  function dismiss() {
    close();
    onClose?.();
  }

  // メニューの上での押下は拾わない（項目の click まで通す）。
  const outside = event => { if (!menu.contains(event.target)) dismiss(); };
  // Esc はメニューだけを閉じる（下へ流さない）。流すと、モーダルの中の欄で開いたメニューの Esc が、モーダルまで閉じる
  // （「モジュールを追加」の URL 欄で、貼り付けをやめただけなのに入れた URL ごと消える）。
  const escape = event => {
    if (event.key !== 'Escape') return;
    event.stopPropagation();
    dismiss();
  };

  window.addEventListener('mousedown', outside, true);
  window.addEventListener('keydown', escape, true);
  window.addEventListener('blur', dismiss);
  window.addEventListener('resize', dismiss);
  document.addEventListener('scroll', dismiss, true);

  closeMenu = close;
  dismissMenu = dismiss;
}

/**
 * ホストが返した「ページ側に残った仕事」。切り取りと貼り付けは DOM を書き換えないと
 * 終わらないので、ここまで来る。
 *
 * ⚠ **input イベントを自分で出す。** value を直に書き換えてもブラウザは出さないので、
 * 出さないと設定画面の「適用」が生えないまま（変更に気付かない）。
 */
function applyContextAct(result, field, start, end) {
  if (!result || result.act !== 'replaceSelection' || !field) return;

  field.setRangeText(result.text ?? '', start, end, 'end');
  field.dispatchEvent(new Event('input', { bubbles: true }));
}

document.addEventListener('contextmenu', async event => {
  // 保険。**本体は C# 側**（ここが動かなくてもブラウザのメニューは出ない）。
  event.preventDefault();

  const named = nameContext(event);
  const items = await decideContextMenu(named.request);

  // 出すものが無ければ**開かない**。何も無い背景で空の箱が出ないのはここ。
  if (!items.length) return;

  openContextMenu(items, event.clientX, event.clientY, async item => {
    const result = await bridge.invokeContextMenu(JSON.stringify({ ...named.request, id: item.id }));
    applyContextAct(result, named.field, named.start, named.end);
  });
});

/**
 * モジュールの iframe で起きた右クリック。
 *
 * **中には描かせない。** 座標は iframe の中のものなので、**iframe の位置ぶん足す**。
 * 押されるまで（あるいは閉じるまで）返事をしないので、モジュール側からは
 * 「メニューを出して結果を待つ」1 回の呼び出しに見える。
 */
function panelContextMenu(payload, owner) {
  const view = views.get(owner.id);
  if (!view || view.tagName !== 'IFRAME') return { ok: false, error: t('host.error.notAllowed', 'contextMenu') };

  const box = view.getBoundingClientRect();

  // 持ち主は**シェルが origin から決めたもの**。モジュールが名乗ったものは使わない。
  const request = {
    key: String(payload?.key ?? ''),
    editable: !!payload?.editable,
    secret: !!payload?.secret,
    selectionText: String(payload?.selectionText ?? ''),
    data: payload?.data ?? {},
    module: owner.id,
  };

  return (async () => {
    const items = await decideContextMenu(request);
    if (!items.length) return { ok: true, result: null };

    return new Promise(resolve => {
      openContextMenu(
        items,
        box.left + Number(payload?.x ?? 0),
        box.top + Number(payload?.y ?? 0),
        async item => {
          const result = await bridge.invokeContextMenu(JSON.stringify({ ...request, id: item.id }));
          resolve({ ok: true, result });
        },
        () => resolve({ ok: true, result: null }));
    });
  })();
}

// ネイティブの枠は消してあるので、掴んで動かすのも最大化もここが持つ。
// **CEF の draggable region は使わない** — 押した瞬間にホストへ 1 回頼めば、
// 以降の追従は Windows がやる。経路が短い方が、イベントの順番に振り回されない。

el.winMin.addEventListener('click', () => { if (!IN_VR_DASHBOARD) bridge.minimizeWindow(); });
el.winClose.addEventListener('click', () => {
  if (IN_VR_DASHBOARD) return;

  IN_VR_WINDOW ? bridge.closeVrWindow() : bridge.closeWindow();
});

// 空間の窓には最小化・最大化が無い（✕ は空間の窓を閉じる）。ダッシュボードには 3 つとも無い（隠しても押せないように口でも止める）。
el.winMin.hidden = IN_VR_WINDOW || IN_VR_DASHBOARD;
el.winMax.hidden = IN_VR_WINDOW || IN_VR_DASHBOARD;
el.winClose.hidden = IN_VR_DASHBOARD;

el.winMax.addEventListener('click', async () => {
  if (IN_VR_DASHBOARD) return;

  // ホストが**切り替えた後の状態**を返すので、聞き直す往復が要らない。
  const maximized = await bridge.toggleMaximizeWindow();
  el.winMax.querySelector('use').setAttribute('href', maximized ? '#i-restore' : '#i-max');
});

// **dblclick は使えない。** 1 回目の押下で掴みに入ると、そこから先は Windows の
// 移動ループが走るので、ブラウザは離した瞬間を見ない = dblclick が発火しない。
// 押下の間隔を自分で測って、2 回目なら掴む代わりに最大化を切り替える。
let lastPress = 0;

el.titlebar.addEventListener('mousedown', async event => {
  // **空間の窓とダッシュボードでは掴まない**（デスクトップの窓が動く・2 回押すと最大化する）。空間の窓を動かすのは VR の中でグリップ。
  if (IN_VR_WINDOW || IN_VR_DASHBOARD) return;

  // 左ボタンだけ。押せるものの上では掴まない（ボタンが押せなくなる）。
  if (event.button !== 0) return;
  if (event.target.closest('button, input, label, a')) return;

  const now = Date.now();
  const doubled = now - lastPress < 400;
  lastPress = doubled ? 0 : now;   // 3 回目を 2 回目と数えない

  if (!doubled) {
    bridge.beginWindowDrag();
    return;
  }

  const maximized = await bridge.toggleMaximizeWindow();
  el.winMax.querySelector('use').setAttribute('href', maximized ? '#i-restore' : '#i-max');
});

// 画面の文言。**1 回受け取って自分で引く**（1 語ずつ橋を渡らない）。
// 訳が無いキーはそのまま出る — 隠すと訳の抜けに誰も気付かない。
let STRINGS = {};
let LANGUAGE = 'en';

function t(key, ...args) {
  const text = Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : key;

  return args.length ? text.replace(/\{(\d+)\}/g, (whole, index) => args[index] ?? whole) : text;
}

function localize(root) {
  for (const el of (root ?? document).querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of (root ?? document).querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
  for (const el of (root ?? document).querySelectorAll('[data-i18n-placeholder]'))
    el.placeholder = t(el.dataset.i18nPlaceholder);
  for (const el of (root ?? document).querySelectorAll('[data-i18n-aria-label]'))
    el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));

  // 自前のカレンダーが使う文言。**月名と曜日は Intl から取る**ので、渡すのはこの 2 つだけ。
  window.spoitableWhen?.setLabels({ now: t('host.when.now'), today: t('host.when.today'), clear: t('host.when.clear') });

  // ⚠ **lang を当ててから開かせる。** カレンダーは月名も曜日も lang から引くので、
  // 先に開かれると英語のまま出る。
  document.documentElement.lang = LANGUAGE;
}

async function loadStrings() {
  const received = await bridge.getStrings();
  STRINGS = JSON.parse(received.strings || '{}');
  LANGUAGE = received.language || LANGUAGE;
  localize();
}

async function boot() {
  // push はページを読んだ時点から溜めている（`seam` の `catching: true`）。ここで溜め始めると bind を待つ間の分が漏れる。
  await CefSharp.BindObjectAsync('stkHost');

  await loadStrings();

  // ネイティブのドロップダウンとカレンダーは CEF から**別レイヤー**として飛んでくるので、
  // 画面外に描いて絵を取り出す VR の面には乗らない。**ページの中に描くものへ被せる。**
  // 元の欄は隠して残っているので、値を読む側も change を待つ側も何も変わらない。
  window.spoitablePick?.upgradeAll();
  window.spoitableWhen?.upgradeAll();

  // サイドバーは動いているモジュールから作る。パネルの実体が無いものはホスト側で弾いてある。
  // **状態より先に組む** — 状態はサイドバーの行に描くので、行が無いと落ちる。
  const modules = await bridge.getModules();
  buildSidebar(modules);

  const status = await bridge.getStatus();
  applyStatus(status);
  applyHiddenKinds(status.hiddenKinds);
  applyCollapsedCategories(status.collapsedCategories);

  // 通知の履歴は、**画面を開く前に出ていた分は読んだことにしない**（起動で溜まったものに気付けるように）。
  updateBell();

  // アプリの更新のバナー。push を取りこぼしていても、ここで追いつく。
  await startAppUpdates();

  // push を取りこぼしていても、保存済みの分でここまで追いつける。
  // **引き直しと同じ道を通す** — 継ぎ目の重複を弾く仕掛けが 2 箇所に分かれないように。
  await fillFromStore('vrc', { replace: false });

  // **アプリログは起動でいちばん知りたい行ほど push では届いていない**
  // （モジュールの読み込みも CEF の起動も画面より先）。台帳から追いつく。
  await fillFromStore('app', { replace: false });

  // 行を右クリックしたときにホストへ渡す材料。**見えている文字をそのまま**渡すので、
  // イベントでも生行でもアプリログでも同じ形で扱える（ホストは種別を知らない）。
  registerContext('log-row', row => ({
    // grid の升目の間に改行が入るので 1 行に均す。
    text: (row.querySelector('.line')?.innerText ?? '').replace(/\s+/g, ' ').trim(),

    // 明細は**シートと同じもの**（開いていなくても出す）。
    detail: (row._details?.().fields ?? [])
      .filter(([, value]) => value !== null && value !== undefined && value !== '')
      .map(([label, value]) => `${t(label)}: ${value}`)
      .join('\n'),
  }));

  for (const tab of el.logTabs.querySelectorAll('.spoitable-tab')) {
    tab.addEventListener('click', () => selectSource(tab.dataset.source));
  }

  for (const box of [el.rowsVrc, el.rowsApp]) {
    box.addEventListener('scroll', onRowsScroll);
    for (const type of ['scrollend', 'wheel', 'pointerdown']) box.addEventListener(type, landTop, { passive: true });
  }
  el.toTop.addEventListener('click', scrollToTop);
  el.logReload.addEventListener('click', pressReload);
  el.logSearch.addEventListener('input', () => { search = el.logSearch.value; applySearch(); });

  // 件数と日時の範囲。**どれも取り直しになる**（絞り込みは DB 側でやっている）。
  el.logSize.addEventListener('change', () => {
    page.size = Number(el.logSize.value) || MAX_ROWS;
    fillFromStore('vrc', { replace: true });
  });

  for (const box of [el.logFrom, el.logTo]) box.addEventListener('change', applyRange);
  el.logRangeClear.addEventListener('click', () => {
    el.logFrom.value = '';
    el.logTo.value = '';
    applyRange();
  });

  el.logFilter.addEventListener('click', openFilters);
  el.filterClose.addEventListener('click', closeFilters);
  el.filterModal.addEventListener('mousedown', event => { if (event.target === el.filterModal) closeFilters(); });

  // 手首のショートカットのモーダル。外を押す・Esc は「完了」を押さずに閉じる（何も残さない）。
  el.shortcutModal.addEventListener('mousedown', event => { if (event.target === el.shortcutModal) closeShortcutModal(); });
  el.switchModal.addEventListener('mousedown', event => { if (event.target === el.switchModal) closeSwitchModal(); });

  el.cfgLicenses.addEventListener('click', openLicenses);
  el.licClose.addEventListener('click', closeLicenses);
  el.licenseModal.addEventListener('mousedown', event => { if (event.target === el.licenseModal) closeLicenses(); });
  el.licTabs.addEventListener('click', event => {
    const tab = event.target.closest('[data-tab]');
    if (!tab) return;
    licTab = tab.dataset.tab;
    renderLicenses();
  });
  el.licChromium.addEventListener('click', () => bridge.openChromiumCredits());
  el.swReset.addEventListener('click', () => { swState.off = [...swState.original]; renderSwitchModal(); });
  el.swDone.addEventListener('click', finishSwitchModal);
  el.scReset.addEventListener('click', () => { scState.placed = [...scState.original]; renderShortcutModal(); });
  // 溜めてから閉じる（閉じるときの追いつきが、溜めの有る無しを見る）。
  el.scDone.addEventListener('click', () => { const { done, placed } = scState; done([...placed]); closeShortcutModal(); });
  el.filterSearch.addEventListener('input', renderFilters);
  el.filterReset.addEventListener('click', () => {
    if (source === 'vrc') {
      hidden.clear();
      for (const kind of DEFAULT_HIDDEN) hidden.add(kind);
    } else {
      hiddenLevels.clear();
      hiddenSources.clear();
    }
    filterChanged();
    renderFilters();
  });

  // シート。↑↓ で隣の行、Esc で閉じる（打ち込んでいる最中は奪わない）。
  el.sheetPrev.addEventListener('click', () => stepSheet(-1));
  el.sheetNext.addEventListener('click', () => stepSheet(1));
  el.sheetClose.addEventListener('click', closeSheet);

  // **モーダルを開いている間は、焦点を中に留める。** モーダルは裏を覆って押させないが、Tab では裏の欄へ抜けられた
  // （抜けた先が打ち込む欄だと、下の Esc も効かない）。
  // 端で Tab を回し（最後の次は最初、最初の前は最後）、ほかの道で裏へ移った焦点も最初へ戻す。
  // ⚠ 被せたドロップダウン・暦（body の直下に出る）をモーダルの中で使うようになったら、それは裏ではないので除ける。
  document.addEventListener('keydown', event => {
    const modal = openModal();
    if (!modal || event.key !== 'Tab') return;
    const inside = focusablesIn(modal);
    if (!inside.length) return;

    // 端でなければブラウザに任せる（中で隣へ進む。裏へ出たら下の focusin が戻す）。
    if (document.activeElement !== (event.shiftKey ? inside[0] : inside[inside.length - 1])) return;

    event.preventDefault();
    (event.shiftKey ? inside[inside.length - 1] : inside[0]).focus();
  });
  document.addEventListener('focusin', event => {
    const modal = openModal();
    if (!modal || modal.contains(event.target)) return;
    focusablesIn(modal)[0]?.focus();
  });

  document.addEventListener('keydown', event => {
    // **モーダルの中の検索欄の Esc は、字があれば消し、空ならモーダルを閉じる**（下の Esc へ流す）。
    // 絞り込みは開くと焦点が検索欄に入るので、打ち込む欄として除けたままだと、開いた直後の Esc で閉じられなかった
    // 変換中の Esc は IME のものなので奪わない。
    const modalSearch = event.key === 'Escape' && !event.isComposing && event.target.matches?.('.spoitable-modal input[type=search]');
    if (modalSearch && event.target.value) {
      event.preventDefault();
      event.target.value = '';
      event.target.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }

    // 「モジュールを追加」の URL 欄の Esc は、字があってもモーダルを閉じる（消すだけにすると、貼り付けた URL を消して閉じるのに 2 回要る）。
    const addField = event.key === 'Escape' && !event.isComposing && !!event.target.closest?.('#maModal');

    // 打ち込む欄だけ除ける。**スイッチ（チェックボックス）は除けない** — 除けると、モーダルでスイッチを押したあとの Esc が効かない。
    if (!modalSearch && !addField && event.target.closest?.('input:not([type=checkbox]):not([type=radio]), textarea, select')) return;

    if (event.key === 'Escape') {
      if (!el.filterModal.hidden) { closeFilters(); return; }
      if (!el.shortcutModal.hidden) { closeShortcutModal(); return; }
      if (!el.switchModal.hidden) { closeSwitchModal(); return; }
      if (!el.maModal.hidden) { closeAddModule(); return; }
      if (!$('updateNotesModal').hidden) { closeUpdateNotes(); return; }
      if (!el.licenseModal.hidden) { closeLicenses(); return; }
      if (!el.history.hidden) { toggleHistory(false); return; }
      if (!el.logSheet.hidden) { closeSheet(); return; }
    }

    if (activeView !== 'log' || el.logSheet.hidden || !el.filterModal.hidden) return;
    if (event.key === 'ArrowUp') { event.preventDefault(); stepSheet(-1); }
    if (event.key === 'ArrowDown') { event.preventDefault(); stepSheet(1); }
  });

  selectSource('vrc');

  el.bell.addEventListener('click', () => toggleHistory());
  window.addEventListener('mousedown', event => {
    if (el.history.hidden || el.history.contains(event.target) || el.bell.contains(event.target)) return;
    toggleHistory(false);
  }, true);

  el.dashToLog.addEventListener('click', () => { selectView('log'); selectSource('vrc'); });

  el.cfgCommit.addEventListener('click', commitSettings);
  el.cfgCancel.addEventListener('click', () => loadSettings({ keepScroll: true }));
  el.cfgSearch.addEventListener('input', applyCfgSearch);
  el.cfgScroll.addEventListener('scroll', () => markToc(), { passive: true });

  // 目次で押した先は、巻き終わるまで印を持つ（そのあと自分で巻いたら、読んでいる所へ移る）。
  el.cfgScroll.addEventListener('scrollend', () => { tocChosen = null; });

  // 空間の窓は、**読み終わったら今の画面を C# に聞き直す**。作った直後に別のショートカットが押されると、
  // その切り替え（showPanel の push）は読み込みの途中で捨てられている。
  // Layout Mode も同じ理由で聞き直す（Layout Mode の間に初めて窓を開くと、切り替えの push は窓が出来る前に済んでいる）。
  if (IN_VR_WINDOW) {
    const wanted = await bridge.getVrWindowView();
    if (wanted && wanted !== activeView) selectView(wanted);
    const pushes = vrLayoutPushes;
    const layout = await bridge.getVrLayout();
    if (pushes === vrLayoutPushes) showVrLayout(layout);
  }

  // ログファイルは監視開始まで数秒かかることがあるので、しばらくは拾い直す。
  setInterval(async () => applyStatus(await bridge.getStatus()), 5000);

  // ブリッジまで通ったことの目印。e2e がこれを待つ。
  window.__stkReady = true;
}

boot().catch(err => {
  window.__stkError = String((err && err.stack) || err);

  // 起動に失敗したらタイトルバーにそのまま出す。**ここが唯一、必ず描かれている場所**。
  el.crumb.textContent = 'bridge error: ' + err;
});
</script>

</body>
</html>
