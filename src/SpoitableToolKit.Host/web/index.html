<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ホストの窓口を呼ぶための token。**配信時にスキームハンドラが差し替える**
     (ディスク上の HTML には入っていない)。モジュールは別 origin なのでここを読めない。
     一番上に置くのは、下のスクリプトより必ず先に居させるため。 -->
<script>window.__stkToken = '__STK_TOKEN__';</script>
<title>SpoitableToolKit</title>
<!-- 部品（ボタン・タブ・タイル・カード・ダイアログ…）。モジュールのページも同じ 1 枚を引く。**骨格より先に読む**（骨格が部品を上書きする）。 -->
<link rel="stylesheet" href="/_host/ui.css">
<!-- 骨格。色は持たない。**テーマより先に読む** — 後から来た方が勝つので、
     この順にしておくとテーマが !important 無しで上書きできる。 -->
<link rel="stylesheet" href="/shell.css">
<!-- 色・影・フォント。シェルもパネルも同じ 1 枚を引く（`_host/` は URL のホストに
     関わらずシェルの web/ から配られるので、これは同一 origin）。 -->
<link rel="stylesheet" href="/_host/theme.css">
</head>
<body>

<!-- 線のアイコン。字のアイコン（Segoe Fluent Icons）は使わない — 入っていない環境で豆腐になり、太さも揃わない。
     色は字の色（stroke: currentColor）、太さは .ic が決める。 -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7ZM12 17v5"/></symbol>
  <symbol id="i-rail" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5" y="8" width="11" height="11" rx="1.5"/><path d="M8.5 8V6.5A1.5 1.5 0 0 1 10 5h7.5A1.5 1.5 0 0 1 19 6.5V14a1.5 1.5 0 0 1-1.5 1.5H16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.5 6.5 2.5 7.5h-17C4.5 15.5 6 13.5 6 9ZM10 20a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6l2.5 2.5"/><path d="M20.5 3.5v5h-5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.5h.01"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9h17"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M16 3v4M8 3v4M3.5 10.5h17"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></g></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-applog" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8ZM14 3v5h5M9 13h6M9 17h4"/></symbol>
</svg>

<!-- サイドバー。普段は開いていて、モジュールの様子が行の右に出る。下のボタンで細い帯（アイコンと点だけ）に畳める。中身は boot が組む。 -->
<nav class="sidebar" id="sidebar"></nav>

<!-- 空間の窓の Layout Mode の案内（body.vr-layout の間だけ出る）。中身は押せず、窓を掴んで動かせる。 -->
<div class="layout-hint" id="layoutHint" aria-live="polite"><span data-i18n="host.window.layoutHint"></span></div>

<div class="frame">
  <!-- タイトルバーを兼ねる。ネイティブの枠は WM_NCCALCSIZE で消してあるので、
       掴んで動かす・最小化・最大化・閉じるはここが持つ。左はいまの画面、右は本体の様子と通知の履歴（ベル）。 -->
  <header id="titlebar">
    <div class="crumb" id="crumb"></div>
    <div class="grab"></div>
    <span class="hoststatus" id="hostStatus" hidden><i class="dot"></i><span class="txt"></span></span>
    <button class="bell" id="bell" data-i18n-title="host.bell.title" aria-haspopup="dialog" aria-expanded="false">
      <svg class="ic"><use href="#i-bell"/></svg><span class="n" id="bellCount" hidden></span>
    </button>
    <div class="wbtn">
      <button id="winMin" data-i18n-title="host.window.minimize" aria-label="minimize"><svg class="ic"><use href="#i-min"/></svg></button>
      <button id="winMax" data-i18n-title="host.window.maximize" aria-label="maximize"><svg class="ic"><use href="#i-max"/></svg></button>
      <button id="winClose" class="close" data-i18n-title="common.ui.close" aria-label="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <!-- 消すまで出続ける帯。**中身が無いときは 1px も取らない**。
       タイトルバーと本文の間なので、どの画面へ行っても付いてくる。 -->
  <div class="banners" id="banners"></div>

  <div class="views" id="views">
    <!-- ダッシュボード。札はホストとモジュールの「状態の口」から作る。 -->
    <div class="view page" id="viewDashboard" hidden>
      <div class="head"><h1 data-i18n="host.nav.dashboard"></h1></div>
      <div class="scroll">
        <div class="spoitable-tiles" id="dashTiles"></div>
        <div class="dash-grid">
          <section class="spoitable-card">
            <h2 data-i18n="host.dash.modules"></h2>
            <div class="dash-list" id="dashModules"></div>
          </section>
          <section class="spoitable-card">
            <div class="spoitable-card-head"><h2 data-i18n="host.dash.recent"></h2><button class="spoitable-btn spoitable-btn-small" id="dashToLog" data-i18n="host.dash.openLog"></button></div>
            <div class="dash-list" id="dashRecent"><div class="spoitable-empty" data-i18n="host.log.events.empty"></div></div>
          </section>
        </div>
      </div>
    </div>

    <!-- ログ画面。モジュールの画面は iframe として動的に足される。 -->
    <div class="view page" id="viewLog">
      <div class="head">
        <h1 data-i18n="host.nav.log"></h1>
        <button class="spoitable-btn spoitable-btn-icon" id="logReload" data-i18n-title="common.ui.reload" data-i18n-aria-label="common.ui.reload"><svg class="ic"><use href="#i-reload"/></svg></button>
      </div>

      <!-- 面の切り替え。同時には出さない（同時表示は情報量が多すぎる）。形は Fluent の下線のタブ。 -->
      <div class="spoitable-tabs" id="logTabs" role="tablist">
        <button class="spoitable-tab spoitable-tab-on" role="tab" aria-selected="true" data-source="vrc" data-i18n="host.log.source.vrc"></button>
        <button class="spoitable-tab" role="tab" aria-selected="false" data-source="app" data-i18n="host.log.source.app"></button>
      </div>

      <div class="spoitable-toolbar">
        <label class="spoitable-search"><svg class="ic"><use href="#i-search"/></svg><input class="spoitable-search-input" id="logSearch" type="search" data-i18n-placeholder="host.log.search"></label>
        <!-- 絞り込みはモーダル 1 本、段ごとに 2 列のスイッチ（モジュールによってフィルターが増えうるので、ドロップダウンにしない）。 -->
        <button class="spoitable-btn" id="logFilter" aria-haspopup="dialog"><svg class="ic"><use href="#i-filter"/></svg><span data-i18n="host.log.filter"></span><span class="n" id="logFilterCount"></span></button>
        <span class="spoitable-spacer"></span>

        <!-- 遡る単位。**「見える行」の件数**（畳んでいる種別は DB 側で除いてある）。
             除かないと、実データでは 92% が ApiRequest なので 100 を選ぶと 2 行しか出ない。 -->
        <span class="range">
          <select class="pick" id="logSize" data-i18n-title="host.log.size">
            <option value="100">100</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
            <option value="5000">5000</option>
          </select>
          <input class="when" id="logFrom" type="datetime-local" data-i18n-title="host.log.from">
          <input class="when" id="logTo" type="datetime-local" data-i18n-title="host.log.to">
          <button class="spoitable-btn" id="logRangeClear" data-i18n="host.log.rangeClear"></button>
        </span>
      </div>
      <style id="kindFilter"></style>

      <div class="table">
        <div class="list">
          <div class="thead" id="logHead"><span data-i18n="host.log.col.time"></span><span id="logHeadKind" data-i18n="host.log.col.kind"></span><span data-i18n="host.log.col.body"></span></div>

          <!-- 面ごとに別の入れ物。**切り替えても相手のスクロール位置と行が残る**し、
               打ち切り（MAX_ROWS）も面ごとに効く。 -->
          <div class="rows" id="rowsVrc"><div class="spoitable-empty" data-i18n="host.log.events.empty"></div></div>
          <div class="rows" id="rowsApp" hidden><div class="spoitable-empty" data-i18n="host.log.app.empty"></div></div>

          <!-- 一番上から離れたときだけ出す「一番上へ」。一覧の下側に浮かせる。
               高さ 0 の台に載せて行の上に重ねるので、出ても消えても一覧の高さは変わらず、読んでいる行がずれない。 -->
          <div class="totop" id="toTopWrap" hidden><button class="spoitable-btn" id="toTop"><svg class="ic"><use href="#i-up"/></svg><span data-i18n="host.log.toTop"></span></button></div>

          <!-- 一覧の足元。件数と、遡りに**行っていること**・**もう無いこと**。 -->
          <div class="tfoot"><span class="count" id="logCount"></span><span class="more" id="logMore" hidden><span id="logMoreText"></span></span></div>
        </div>

        <!-- 行の詳細。塞がないシート。一覧は見えたまま流れる・巻ける（流れを追いながら 1 行覗ける）。 -->
        <aside class="sheet" id="logSheet" hidden>
          <div class="sheet-head">
            <i class="sq" id="sheetTone"></i><span class="k" id="sheetKind"></span><span class="spoitable-spacer"></span>
            <button class="spoitable-ib" id="sheetPrev" data-i18n-title="host.log.sheet.prev"><svg class="ic"><use href="#i-up"/></svg></button>
            <button class="spoitable-ib" id="sheetNext" data-i18n-title="host.log.sheet.next"><svg class="ic"><use href="#i-down"/></svg></button>
            <button class="spoitable-ib" id="sheetClose" data-i18n-title="host.log.sheet.close"><svg class="ic"><use href="#i-x"/></svg></button>
          </div>
          <div class="sheet-body" id="sheetBody"></div>
        </aside>
      </div>
    </div>

    <!-- 設定画面。モジュールが出した定義から毎回組み立てる（項目も値も C# 側が正）。
         左にページの一覧（本体は束ねごと、モジュールは 1 つずつ）、真ん中に開いているページ、モジュールのページだけ右に目次。
         触っても溜めるだけで、窓の真ん中下の帯の「適用」で確定する。 -->
    <div class="view page" id="viewSettings" hidden>
      <div class="head">
        <h1 data-i18n="host.nav.settings"></h1>
        <!-- 設定の値ではないので、cfgList の外に置く（溜め・検索・読み直しに巻き込まない）。 -->
        <button class="spoitable-btn spoitable-btn-small" id="cfgLicenses" aria-haspopup="dialog" data-i18n="host.licenses.button"></button>
        <label class="spoitable-search"><svg class="ic"><use href="#i-search"/></svg><input class="spoitable-search-input" id="cfgSearch" type="search" data-i18n-placeholder="host.settings.search"></label>
      </div>
      <!-- **探している間はページをまたいで全部から**出し、一覧には当たった数を出す。変更・弾かれたものがあるページには印。 -->
      <div class="cfg-body">
        <nav class="cfg-nav" id="cfgNav" data-i18n-aria-label="host.settings.categories"></nav>
        <div class="cfg-scroll" id="cfgScroll">
          <div id="cfgList"></div>
          <div class="cfg-empty" id="cfgNoMatch" hidden data-i18n="host.settings.noMatch"></div>
        </div>
        <nav class="cfg-toc" id="cfgToc" hidden data-i18n-aria-label="host.settings.toc"></nav>
      </div>
    </div>

    <!-- モジュールの管理。入っているもの（同梱・GitHub から入れたもの）と状態、有効化・無効化・削除。**変えたものは次の起動で効く**ので、
         変えたら上に「再起動」の帯が出る。中身の正は C#（ModuleCatalog）。
         追加は見出しの右の「モジュールを追加」から（モーダル。下の maModal）。インストールしている途中のもの 1 つ = カード 1 枚（タブの上に積む）。
         カードの中身の正も C#（ModuleInstallJobs）で、ここは配られたものを描く。確かめ（Build・.NET SDK・インストール）はモーダルに出し、カードは「確認待ち」だけ。
         「インストール」を押した件は消えて、一覧の行になる。再起動の帯とカードは、どちらのタブでも見える。
         タブは「モジュール」（行の右は「…」のメニュー 1 つ）と「更新」（「更新を確認」と、更新のある行）。 -->
    <div class="view page" id="viewModuleManager" hidden>
      <div class="head">
        <h1 data-i18n="host.nav.moduleManager"></h1>
        <button class="spoitable-btn spoitable-btn-primary spoitable-btn-small" id="plAddBtn" aria-haspopup="dialog"><span data-i18n="host.modules.add.title"></span></button>
      </div>
      <div class="pl-restart" id="plRestart" hidden role="status">
        <svg class="ic"><use href="#i-reload"/></svg>
        <span class="msg" id="plRestartMsg" data-i18n="host.modules.restartNeeded"></span>
        <button class="spoitable-btn spoitable-btn-primary spoitable-btn-small" id="plRestartBtn" data-i18n="host.modules.restart"></button>
      </div>
      <div class="scroll">
        <div class="pl-group-head" id="plJobsHead" hidden><h2 data-i18n="host.modules.jobs.title"></h2><span class="count" id="plJobsCount"></span></div>
        <div class="pl-jobs" id="plJobs"></div>
        <div class="spoitable-tabs pl-tabs" id="plTabs" role="tablist">
          <button class="spoitable-tab spoitable-tab-on" role="tab" aria-selected="true" aria-controls="plList" data-tab="modules" data-i18n="host.modules.tab.modules"></button>
          <!-- 字は描くたびに入れる（更新のある件数を付ける）。 -->
          <button class="spoitable-tab" role="tab" aria-selected="false" aria-controls="plUpdates" data-tab="updates" id="plUpdatesTab"></button>
        </div>
        <div class="pl-list" id="plList" role="tabpanel"></div>
        <div class="pl-updates" id="plUpdates" role="tabpanel" hidden>
          <div class="pl-check">
            <button class="spoitable-btn spoitable-btn-small" id="plCheckBtn" data-i18n="host.modules.update.check"></button>
            <span class="pl-checked" id="plCheckedAt"></span>
          </div>
          <div class="pl-check-msg" id="plCheckMsg" hidden role="status"></div>
          <div class="pl-list" id="plUpdateList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 適用の帯。窓全体の真ん中下。出ている間は通知の束をこの上へ持ち上げる（通知が適用を覆わないように）。 -->
<div class="cfg-apply" id="cfgApply" hidden role="region">
  <span class="count" id="cfgCount"></span>
  <button class="spoitable-btn spoitable-btn-ghost" id="cfgCancel" data-i18n="host.settings.cancel"></button>
  <button class="spoitable-btn spoitable-btn-primary" id="cfgCommit" data-i18n="common.ui.apply"></button>
</div>

<!-- 答えを待たない通知（右下）と、**答えを待つもの（束のいちばん下のカード）**。どちらも画面を塞がない
     （モーダルにしない）。 -->
<div class="toasts" id="toasts"><div class="asks" id="asks"></div></div>

<!-- 通知の履歴（タイトルバーのベル）。このセッションの分だけ。時間切れの確認は、ここから後で答えられる。 -->
<div class="history" id="history" hidden role="dialog" aria-labelledby="historyTitle">
  <div class="history-head"><h2 id="historyTitle" data-i18n="host.bell.title"></h2></div>
  <div class="history-list" id="historyList"><div class="spoitable-empty" data-i18n="host.bell.empty"></div></div>
</div>

<!-- 絞り込み。段（出どころ）ごとに 2 列のスイッチ。 -->
<div class="spoitable-modal" id="filterModal" hidden>
  <div class="spoitable-dialog" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <div class="spoitable-dialog-head">
      <div class="spoitable-dialog-title"><h2 id="filterTitle"></h2><p data-i18n="host.log.filter.note"></p></div>
      <label class="spoitable-search"><svg class="ic"><use href="#i-search"/></svg><input class="spoitable-search-input" id="filterSearch" type="search" data-i18n-placeholder="host.log.filter.search"></label>
    </div>
    <div class="spoitable-dialog-body" id="filters"></div>
    <div class="spoitable-dialog-foot">
      <button class="spoitable-btn spoitable-btn-ghost" id="filterReset" data-i18n="host.log.filter.reset"></button>
      <span class="spoitable-hint" id="filterShown"></span>
      <span class="spoitable-spacer"></span>
      <button class="spoitable-btn spoitable-btn-primary" id="filterClose" data-i18n="common.ui.close"></button>
    </div>
  </div>
</div>

<!-- 手首のショートカットを並べる。左 = 手首に並ぶ順、真ん中 = 右で選んだ出どころが名乗るもの、右 = 出どころ。
     左と真ん中は掴んで動かす・× で外す、右はタブ。 -->
<div class="spoitable-modal" id="shortcutModal" hidden>
  <div class="spoitable-dialog sc-dialog" role="dialog" aria-modal="true" aria-labelledby="scTitle">
    <div class="spoitable-dialog-head">
      <div class="spoitable-dialog-title"><h2 id="scTitle" data-i18n="host.settings.shortcuts.title"></h2><p data-i18n="host.settings.shortcuts.note"></p></div>
    </div>
    <div class="sc-body">
      <section class="sc-col" id="scPlacedCol">
        <h3><span data-i18n="host.settings.shortcuts.placed"></span> <span id="scCount"></span></h3>
        <div class="sc-list" id="scPlaced"></div>
      </section>
      <section class="sc-col" id="scOfferedCol">
        <h3 id="scSourceName"></h3>
        <div class="sc-list" id="scOffered"></div>
      </section>

// 窓のときだけ: 右上の ✕ で空間の窓を閉じる（最小化・最大化・掴んで動かすは出さない — 動かすのは VR の中で掴む）、
// モジュールの VR 専用のページを優先する、最初の画面を URL で受ける、自分で切り替えた画面を C# に知らせる。

function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'ic');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#' + name);
  svg.appendChild(use);
  return svg;
}

/**
 * パスのデータから線のアイコン（モジュールの通知の種類・サイドバーのアイコン）。
 * **属性に入れるだけ**で、マークアップとしては読まない。字の検めは C# が済ませてある。
 */
function pathIcon(d) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'ic');
  svg.setAttribute('viewBox', '0 0 24 24');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  svg.appendChild(path);
  return svg;
}

/** 通知の種類の角四角。色は data-tone からテーマが決める。 */
function kindSquare(kind) {
  const square = document.createElement('span');
  square.className = 'sq';
  square.dataset.tone = kind?.tone ?? 'gray';
  if (kind?.icon) square.appendChild(pathIcon(kind.icon));
  return square;
}

/** モジュールの名前。**辞書に `<id>.name` があればそれ**（作者が付けた英語の名前より、画面の言語で読める）。 */
function moduleName(id, fallback) {
  const key = id + '.name';
  return Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : (fallback ?? id);
}

const pad = n => String(n).padStart(2, '0');

/** 時刻だけ（HH:mm）。通知の履歴など、今日のことしか出ない所で使う。 */
function clock(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 1 画面 1 種類。VRChat のログとアプリのログを切り替え、
// VRChat 側では構造化イベントと生行が同じ一覧に混ざる。

function cell(className, text) {
  const span = document.createElement('span');
  span.className = className;
  span.textContent = text ?? '';
  return span;
}

/**
 * 日時。**どこでも同じ形で出す**。
 *
 * DB を遡ると何日も前の行が同じ一覧に並ぶので、
 * <b>8/30 の 16:17 と今日の 16:17 が見分けられない</b>と、「今回の分しか出ていない」のか
 * 「昔の行も出ている」のかが読めない。日付を常に出せばどちらも起きない。
 *
 * **C# 側は ISO のまま渡してくる。** 出す形を決めるのはここだけで、
 * アプリログの行も VRChat の行も同じ関数を通る。
 */
function stamp(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso ?? '';

  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} `
    + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

const hidden = new Set();            // VRChat 側の畳んだ種別。**ホストの設定に残る**
const hiddenLevels = new Set();      // アプリ側の畳んだレベル。こちらはセッション内だけ
const seen = new Map();              // 種別ごとの件数（チップに出す）

let source = 'vrc';                  // 'vrc' | 'app'
let search = '';

function activeRows() {
  return source === 'vrc' ? el.rowsVrc : el.rowsApp;
}

// 追従は上端判定（チェックボックスにしない）。読み返すために下へ動かした時点で
// 追従は切れていてほしいし、戻したら勝手に再開してほしい。
// 50px の遊びは、行が 1 つ増えた直後でも「上に居る」と判定するため。
//
// **新しいものが上**になったので、追従先は下端ではなく上端。

const stuck = { vrc: true, app: true };

/**
 * 面ごとの代。**作り直しで進む。** 待っている間に代が変わった返事（遡り・作り直し）は、何も触らずに捨てる —
 * 捨てないと、作り直した面の下に古い条件の行が足される・続きの位置が古い方で上書きされる。
 */
const generation = { vrc: 0, app: 0 };

// 「一番上へ」で滑っている最中か（面ごと）。滑っている間の巻きの知らせは scrollTop がまだ 50 より大きいので、
// そのまま読むと追従が切れ、ボタンがまた出てくる。さらに追従が切れたまま行が届くと `scrollTop +=` が滑りを止めて、
// 途中で置き去りになる。**滑り終わる（scrollend）か、利用者が触るまでは「上に居る」扱い**にする。
// 滑っている間に行が届いたら、上端へすぐ移る（どのみち行き先は上端）。
const headingTop = { vrc: false, app: false };

// シートの ↑↓ で滑らせている行（面ごと）。滑っている間に行が上へ届くと、読む位置を戻す `scrollTop +=` が滑りを止めて、
// 選んだ行が見える所まで届かない。**届いたら、その行へ向け直す。** 終わり方は「一番上へ」と同じ（landTop）。
const sheetGlide = { vrc: null, app: null };

/**
 * 利用者が押して飛ぶ巻き（一番上へ・設定の目次・シートの ↑↓）の動き方。**OS で動きを減らしているなら即時。**
 * ⚠ CSS の `scroll-behavior: smooth` は入れ物に付けない。行を上に挿したあとの「挿さった高さのぶん戻す」
 * （`scrollTop +=`）まで滑ってしまい、読んでいる位置が流れる。
 */
function scrollMotion() {
  return matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth';
}

function onRowsScroll(event) {
  const box = event.currentTarget;
  const name = box === el.rowsApp ? 'app' : 'vrc';
  stuck[name] = headingTop[name] || box.scrollTop < 50;

  if (name === source) el.toTopWrap.hidden = stuck[name];

  // 下端に近づいたら過去を継ぎ足す。**200px の余裕**は、辿り着く前に用意しておくため。
  // アプリの面も遡る（記録は起動をまたいで残っている）。
  if (box.scrollHeight - box.scrollTop - box.clientHeight < 200) {
    if (name === 'vrc') loadOlder();
    else loadOlderApp();
  }
}

function scrollToTop() {
  const box = activeRows();
  const behavior = scrollMotion();
  headingTop[source] = behavior === 'smooth' && box.scrollTop > 0;
  stuck[source] = true;
  el.toTopWrap.hidden = true;
  box.scrollTo({ top: 0, behavior });
}

/** 滑り終わった・利用者が触った。ここからは位置のとおりに追従を決める。 */
function landTop(event) {
  const box = event.currentTarget;
  const name = box === el.rowsApp ? 'app' : 'vrc';
  sheetGlide[name] = null;
  if (!headingTop[name]) return;
  headingTop[name] = false;
  if (event.type === 'scrollend') onRowsScroll(event);
}

/**
 * 行を足す。**入れる向きが 2 つある。**
 *
 * - 既定（流れてきた行）: **上へ挿す**。1 件ずつ順に挿すので、新しいものほど上になる
 * - `older`（追いつき・遡り）: 既に新しい順で来ているので、**下へそのまま繋ぐ**
 *
 * 上へ挿すときは、読んでいる位置が下へずれる。CSS で `overflow-anchor: none` にしてあるので
 * ブラウザは補正しない。**挿さった高さのぶんだけこちらで戻す。**
 */
function addRows(name, items, render, { older = false, paged = false } = {}) {
  if (items.length === 0) return;

  const container = name === 'app' ? el.rowsApp : el.rowsVrc;
  const empty = container.querySelector('.spoitable-empty');
  if (empty) empty.remove();

  // 上へ挿す側は**新しいものが先頭に来るように逆へ積む**。
  // 届く配列は古い順（C# 側が読んだ順）なので、そのまま前へ挿すと束の中だけ順が逆になる。
  const fragment = document.createDocumentFragment();
  for (const item of older ? items : [...items].reverse()) {
    const row = render(item);
    if (paged) row.dataset.paged = '1';
    fragment.appendChild(row);
  }

  if (older) {
    container.appendChild(fragment);
  } else {
    const before = container.scrollHeight;
    container.insertBefore(fragment, container.firstChild);
    if (stuck[name]) container.scrollTop = 0;
    else container.scrollTop += container.scrollHeight - before;

    const gliding = sheetGlide[name];
    if (gliding?.isConnected) gliding.scrollIntoView({ block: 'nearest', behavior: scrollMotion() });
  }

  trim(container, name);
  if (name === 'app') markRuns();

  applySearch();
  updateCount();
}

/**
 * 打ち切り。**手放す順番は「畳んである行 → 生行 → 古い行」。**
 *
 * 1 列にしたので、生行とイベントが同じ枠を取り合う。実ログの比は
 * **生行 15,000 に対してイベント 19** なので、古い順に捨てると
 * <b>枠が全部 raw で埋まって、見たいイベントが先に押し出される</b>。
 *
 * <b>生行を 2 番目に置いたのは、チップを戻された瞬間にこの守りが消えていたから。</b>
 * 「畳んである行から先に」だけだと、raw を<b>出している</b>間は raw が守り側に回り、
 * 古い順の方が働いてイベント行を食う。実際、Spoitable → VRChat の順で起動して
 * 新しいログを頭から読み直したときに、<b>起動時に読んだイベントが 6 件 → 0 件になった</b>
 *
 * 落としたイベントは DB から引き直せる。落とした生行は引き直せないが、
 * <b>見たいものを押し出してまで守る価値は無い</b>（比が 15,000 : 19）。
 *
 * **新しいものが上**なので、どの段も<b>末尾（＝古い方）から</b>手放す。
 */
function trim(container, name) {
  // **数えるのも捨てるのも行だけ**（アプリの面には「ここで起動」の印が挟まる。markRuns）。
  const rows = () => [...container.querySelectorAll(':scope > .row')];
  const off = name === 'app' ? hiddenLevels : hidden;

  // **下へ巻いて読んでいる間は切らない**（上限を 1 つずつ増やす）。
  // 溜まり続けないよう READING_CAP で止める。そのときは下（古い方）から切る（読んでいるのは上の方なので）。
  if (name === source && !stuck[name]) {
    let extra = rows().length - READING_CAP;
    if (extra <= 0) return;
    for (const row of rows().reverse()) {
      if (extra-- <= 0) break;
      row.remove();
    }
    realign(container, name);
    return;
  }

  // 上に居る（または見ていない面）。**枠が効くのは流れてきた行だけ**で、遡って取りに行った行（paged）は数えない
  // — 取りに行った出来事を、流れてくる生行が押し出さないように（生行は 1 セッションで 1.5 万行、出来事は 19 行の比）。
  let over = rows().filter(row => !row.dataset.paged).length - MAX_ROWS;
  if (over <= 0) return;

  let cut = false;
  const dropFrom = (predicate, oldest = false) => {
    for (const row of rows().reverse()) {
      if (over <= 0) return;
      if (row.dataset.paged || !predicate(row)) continue;
      row.remove();
      over--;
      if (oldest) cut = true;
    }
  };

  dropFrom(row => off.has(row.dataset.kind));
  if (name === 'vrc') dropFrom(row => row.dataset.kind === 'raw');

  dropFrom(() => true, true);

  // **流れてきた行の一番古い行を切ったら、その下の取りに行った塊も外す。** 切った行はちょうど 2 つの塊の境目なので、
  // 残すとそこで行が 1 本ずつ黙って消え、穴が空く。塊ごと外せば一覧は途切れず、
  // 外した分は下へ巻けばまた読める（続きの位置は realign で一番下に合わせる）。
  if (cut) for (const row of rows()) if (row.dataset.paged) row.remove();

  realign(container, name);
}

/**
 * 下を切ったあと、**続きを一番下の行から引き直せるようにする**。足元の「これより古い記録はありません」も戻す
 * （戻さないと、切った行を二度と読めない）。
 * アプリの面はもともと一番下の行の番号から引く（loadOlderApp）。VRChat の面は位置（page.oldestId / oldestTs）を持つので、
 * **一番下を出来事の行にそろえて**から、その行の番号と時刻に合わせる — 出来事の行より下に生行を残すと、続きの生行の窓
 * （その出来事の時刻より前）に入って二重に並ぶ。位置を持っていないとき（`page.oldestId` が null）は何もしない。
 */
function realign(container, name) {
  if (name === 'app') {
    appPage.exhausted = false;
    showMore('', 'app');
    return;
  }

  if (page.oldestId === null) return;

  const rows = [...container.querySelectorAll(':scope > .row')];
  let last = rows.length - 1;
  while (last >= 0 && !rows[last].dataset.id) rows[last--].remove();
  if (last < 0) return;

  page.oldestId = Number(rows[last].dataset.id);
  if (rows[last].dataset.ts) page.oldestTs = rows[last].dataset.ts;
  page.exhausted = false;
  showMore('');
}
// 行を押すと**右にシートが開く**（塞がない）。一覧は見えたまま流れるので、流れを追いながら 1 行覗ける。
// 選んだ行には印が付き、↑↓ で隣へ移れる。

/** 種別の表示名。**辞書に無ければクラス名のまま**（新しい種別が足されても空にはならない）。 */
function kindLabel(kind) {
  const key = 'host.log.kind.' + kind;
  return Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : kind;
}

function kindCell(label) {
  const span = document.createElement('span');
  span.className = 'kind';
  const square = document.createElement('i');
  square.className = 'sq';
  span.append(square, cell('lbl', label));
  return span;
}

/**
 * 行 1 つ。`details` は**開いたときに呼ぶ**（500 行ぶんの明細を先に作らない）。
 * 返すのは `{ title, detail, fields: [[ラベルのキー, 値]], trace }`。
 */
function makeRow(className, kind, ts, label, body, details) {
  const row = document.createElement('div');
  row.className = 'row ' + className;
  row.dataset.kind = kind;

  // 右クリックの名乗り。**属性は印だけ**で、中身は押されたときに取り出す
  // （500 行ぶんの本文を属性に持たせない）。
  row.dataset.context = 'log-row';
  row._details = details;
  row._label = label;

  const line = document.createElement('button');
  line.className = 'line';
  line.appendChild(cell('ts', ts));
  line.appendChild(kindCell(label));
  line.appendChild(body);
  line.onclick = () => (selectedRow === row ? closeSheet() : openSheet(row));

  row.appendChild(line);
  return row;
}

function renderEvent(e) {
  seen.set(e.kind, (seen.get(e.kind) ?? 0) + 1);

  const body = cell('body', e.title);
  if (e.detail) {
    body.appendChild(document.createTextNode(' '));
    body.appendChild(cell('detail-inline', e.detail));
  }

  const row = makeRow('ev', e.kind, stamp(e.ts), kindLabel(e.kind), body, () => ({
    title: e.title,
    detail: e.detail,
    fields: [
      ['host.log.field.time', stamp(e.ts)],

      // 種別のクラス名はここに出す（一覧は短い日本語の名前）。
      ['host.log.field.kind', e.kind],

      // 種別ごとの追加（ユーザー ID / ワールド ID など）。**並びまで C# が決めている**ので、
      // ここは種別を知らない。空のものは向こうで落としてある。
      ...(e.fields ?? []).map(field => [field.label, field.value, true]),
    ],
  }));

  // 記録の通し番号。遡りの継ぎ目と、追いつきの重複を弾く鍵に使う。
  if (e.id) row.dataset.id = e.id;

  // 打ち切りで下を切ったあと、続きをこの行から引き直す（trim の realign）。
  if (e.ts) row.dataset.ts = e.ts;
  return row;
}

/** 行 1 つ。**遡ると 1 本の配列にイベントと生行が混ざって届く**ので、印で振り分ける。 */
function renderRow(r) {
  return r.type === 'line' ? renderLine(r) : renderEvent(r);
}

function renderLine(l) {
  // **生行も同じ一覧に混ざる**ので、種別は 'raw' に揃える（絞り込みで畳めるように）。
  // タグやレベルはシートに出す。
  const row = makeRow('lvl-' + l.level, 'raw', stamp(l.ts), l.tag ?? kindLabel('raw'), cell('body', l.message), () => ({
    title: l.message,
    fields: [
      ['host.log.field.time', stamp(l.ts)],
      ['host.log.field.level', l.level],
      ['host.log.field.tag', l.tag],
    ],
  }));

  // 保存している生行だけ通し番号を持つ（log_events とは別の番号空間）。
  if (l.id) row.dataset.lineId = l.id;
  return row;
}

/** アプリログの出所。**モジュールの名前空間なら、その Id**（モジュールのディレクトリ名と同じ綴りを小文字で）。 */
// モジュールの行は SpoitableToolKit.Modules.<Id>（IModuleHost.Logger。Id は小文字で、点を含みうるので頭のあとは切らない）。
// 前の版が残した行は namespace の形（SpoitableToolKit.Modules.Hrs.HrsModule）で、大文字が入っている — 最初の段を Id として読む。
function sourceOf(fullCategory) {
  const match = /^SpoitableToolKit\.Modules\.(.+)$/.exec(fullCategory ?? '');
  if (!match) return 'host';
  return /[A-Z]/.test(match[1]) ? match[1].split('.')[0].toLowerCase() : match[1];
}

function renderAppLog(a) {
  const row = makeRow('app lvl-' + a.level, a.shortLevel, stamp(a.ts), a.shortLevel, cell('body', a.message), () => ({
    title: a.message,
    fields: [
      ['host.log.field.time', stamp(a.ts)],
      ['host.log.field.level', a.level],
      ['host.log.field.category', a.fullCategory, true],
      ['host.log.field.thread', a.thread, true],
    ],

    // スタックトレースは畳まない。畳むと読めない。
    trace: a.exception,
  }));

  // カテゴリは本文の前に小さく出す。**末尾だけ**（完全名はシートに出るし、ファイルにも残っている）。
  row.querySelector('.body').prepend(cell('cat', a.category));

  // 出所（本体 / モジュール）。絞り込みの「出所」の段で畳む。
  row.dataset.src = sourceOf(a.fullCategory);

  if (a.exception) row.classList.add('has-exception');

  // 台帳の通し番号。VRChat 側の id と同じ役目で、追いつきの重複を弾く鍵。
  // **出しておくと、二重になっていることが外から見える**。
  if (a.seq) row.dataset.seq = a.seq;

  // どの起動の行か（起動した時刻のエポックミリ秒）。隣と違う所に「ここで起動」を挟む。
  if (a.run) row.dataset.run = a.run;

  return row;
}

// 記録から前の起動の行も読み戻すので、**どこで起動し直したか**が見えないと、
// 起動の前と後の行が 1 本に繋がって読める（落ちる直前の行と、起動し直した最初の行の区別が付かない）。

/** 「ここで起動 yyyy/MM/dd HH:mm:ss」。起動の印がそのまま起動の時刻。 */
function runLabel(run) {
  return t('host.log.app.started', stamp(Number(run)));
}

/**
 * アプリの面で、起動の境目に印を挟み直す。**隣り合う行の起動の印（run）が違う所**が境目。
 *
 * 新しいものが上なので、印は**上の行（新しい方の起動の最初の行）の下**に置き、上の行の起動の時刻を出す。
 * 行の足し方が 3 つ（上へ挿す・下へ繋ぐ・止めていた分を流す）あるので、足したあとに全体をなめ直す
 * （多くて 遡った分 + 1,000 行）。合っている印は動かさない — 消して挿し直すと、上の方の印のぶん読んでいる位置がずれうる。
 *
 * 印は `.row` ではない。数える・選ぶ・探すはどれも `.row` を見ているので、印はそこに混ざらない（`trim` も行だけを数える）。
 */
function markRuns() {
  const box = el.rowsApp;
  const keep = new Set();

  let above = null;
  for (const row of box.querySelectorAll(':scope > .row')) {
    if (above && above.dataset.run && row.dataset.run && above.dataset.run !== row.dataset.run) {
      let mark = above.nextElementSibling;
      if (!mark?.classList.contains('run-mark') || mark.dataset.run !== above.dataset.run) {
        mark = document.createElement('div');
        mark.className = 'run-mark';
        mark.setAttribute('role', 'separator');
        mark.dataset.run = above.dataset.run;
        mark.textContent = runLabel(above.dataset.run);
        above.after(mark);
      }
      keep.add(mark);
    }
    above = row;
  }

  for (const mark of box.querySelectorAll(':scope > .run-mark')) if (!keep.has(mark)) mark.remove();
}

let selectedRow = null;

function openSheet(row) {
  selectedRow?.classList.remove('sel');
  selectedRow?.querySelector('.line')?.setAttribute('aria-pressed', 'false');

  selectedRow = row;
  row.classList.add('sel');
  row.querySelector('.line').setAttribute('aria-pressed', 'true');

  const info = row._details?.() ?? {};
  el.sheetTone.parentElement.dataset.kind = row.dataset.kind;
  el.sheetKind.textContent = row._label ?? row.dataset.kind;

  const body = [];
  const when = info.fields?.find(([key]) => key === 'host.log.field.time')?.[1];
  if (when) body.push(cell('when', when));

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = info.title ?? '';
  body.push(title);

  if (info.detail) {
    const detail = document.createElement('p');
    detail.className = 'detail';
    detail.textContent = info.detail;
    body.push(detail);
  }

  // 押せるもの。**本文と明細を 1 回でコピー**（貼った先で読める形）。
  const acts = document.createElement('div');
  acts.className = 'acts';
  const copy = document.createElement('button');
  copy.className = 'spoitable-btn';
  copy.id = 'sheetCopy';
  copy.append(icon('i-copy'), cell('', t('common.ui.copy')));
  copy.addEventListener('click', () => bridge.copyToClipboard(sheetText(row)));
  acts.appendChild(copy);
  if (info.trace) {
    const trace = document.createElement('button');
    trace.className = 'spoitable-btn';
    trace.append(icon('i-copy'), cell('', t('host.log.sheet.copyTrace')));
    trace.addEventListener('click', () => bridge.copyToClipboard(info.trace));
    acts.appendChild(trace);
  }
  body.push(acts);

  // 明細。`—` ではなく行ごと省くのは、空の項目が並ぶと読みにくいため。
  const list = document.createElement('dl');
  for (const [label, value, mono] of info.fields ?? []) {
    if (value === null || value === undefined || value === '' || label === 'host.log.field.time') continue;

    const item = document.createElement('div');
    item.className = 'dline';
    item.appendChild(cell('dkey', t(label)));
    const dd = cell('dval', String(value));
    if (mono) dd.classList.add('mono');
    item.appendChild(dd);
    list.appendChild(item);
  }
  body.push(list);

  if (info.trace) {
    body.push(cell('dkey trace-key', t('host.log.field.exception')));
    const pre = document.createElement('pre');
    pre.className = 'trace';
    pre.textContent = info.trace;
    body.push(pre);
  }

  el.sheetBody.replaceChildren(...body);
  el.logSheet.hidden = false;
}

function closeSheet() {
  selectedRow?.classList.remove('sel');
  selectedRow?.querySelector('.line')?.setAttribute('aria-pressed', 'false');
  selectedRow = null;
  el.logSheet.hidden = true;
}

/** シートの中身を 1 つの文字列に（コピー・右クリックの材料）。 */
function sheetText(row) {
  const info = row._details?.() ?? {};
  return [
    info.title,
    info.detail,
    ...(info.fields ?? []).filter(([, value]) => value !== null && value !== undefined && value !== '')
      .map(([label, value]) => `${t(label)}: ${value}`),
    info.trace,
  ].filter(Boolean).join('\n');
}

function visibleRows() {
  return [...activeRows().querySelectorAll('.row')].filter(row => row.offsetParent !== null);
}

/** シートで隣の行へ。**新しいものが上**なので、↑ はひとつ新しい行。 */
function stepSheet(delta) {
  const rows = visibleRows();
  if (rows.length === 0) return;

  const at = selectedRow ? rows.indexOf(selectedRow) : -1;
  const next = rows[Math.min(rows.length - 1, Math.max(0, at < 0 ? 0 : at + delta))];
  if (!next) return;

  openSheet(next);
  sheetGlide[source] = scrollMotion() === 'smooth' ? next : null;
  next.scrollIntoView({ block: 'nearest', behavior: scrollMotion() });
}

// **段（出どころ）ごと**に並べる。VRChat の出来事 / アプリのレベルと出所。
// モジュールがログに出来事を書く口ができたら、「モジュールの出来事」の段がここに増える。

const hiddenSources = new Set();     // アプリ側の畳んだ出所。セッション内だけ

/** いまの面の段。`[段の名前のキー, 項目, 畳んでいる集合]`。 */
function filterSections() {
  if (source === 'vrc') return [{ key: 'host.log.filter.section.vrc', names: KINDS, off: hidden }];

  const sources = new Set(['host']);
  for (const row of el.rowsApp.querySelectorAll('.row[data-src]')) sources.add(row.dataset.src);
  for (const name of hiddenSources) sources.add(name);

  return [
    { key: 'host.log.filter.section.level', names: LEVELS, off: hiddenLevels },
    { key: 'host.log.filter.section.source', names: [...sources], off: hiddenSources, source: true },
  ];
}

function filterLabel(section, name) {
  if (section.source) return name === 'host' ? t('host.log.source.host') : moduleName(name, name);
  return source === 'vrc' ? kindLabel(name) : t('host.log.level.' + name);
}

function filterDescription(section, name) {
  if (section.source) return name === 'host' ? t('host.log.source.host.desc') : name;
  const key = (source === 'vrc' ? 'host.log.kind.' : 'host.log.level.') + name + '.desc';
  return Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : '';
}

function countOf(section, name) {
  if (source === 'vrc') return seen.get(name) ?? 0;
  const attr = section.source ? 'src' : 'kind';
  return el.rowsApp.querySelectorAll(`.row[data-${attr}="${CSS.escape(name)}"]`).length;
}

/** 畳んだあとの後始末。**VRChat 側だけホストに残して引き直す**（畳む種別は DB 側でも除いているので）。 */
function filterChanged() {
  applyFilter();

  if (source === 'vrc') {
    // 配列をそのまま渡すと C# 側の string[] に束縛できず、黙って失敗する（戻り値を待たないため）。
    bridge.setHiddenKinds(JSON.stringify([...hidden]));
    fillFromStore('vrc', { replace: true });
  }
}

function renderFilters() {
  const needle = el.filterSearch.value.trim().toLowerCase();
  el.filterTitle.textContent = t('host.log.filter.title', t('host.log.source.' + source));

  const sections = [];
  for (const section of filterSections()) {
    const items = section.names.filter(name =>
      !needle || (filterLabel(section, name) + ' ' + filterDescription(section, name) + ' ' + name).toLowerCase().includes(needle));
    if (items.length === 0) continue;

    const box = document.createElement('section');
    box.className = 'fsec';

    const head = document.createElement('div');
    head.className = 'fsec-head';
    const allOn = document.createElement('button');
    allOn.className = 'spoitable-link';
    allOn.textContent = t('host.log.filter.showAll');
    allOn.addEventListener('click', () => { for (const name of section.names) section.off.delete(name); filterChanged(); renderFilters(); });
    const allOff = document.createElement('button');
    allOff.className = 'spoitable-link';
    allOff.textContent = t('host.log.filter.hideAll');
    allOff.addEventListener('click', () => { for (const name of section.names) section.off.add(name); filterChanged(); renderFilters(); });
    head.append(cell('h', t(section.key)), cell('rule', ''), allOn, allOff);

    const grid = document.createElement('div');
    grid.className = 'fgrid';
    for (const name of items) {
      const locked = lockedKind(section, name);
      const on = !locked && !section.off.has(name);
      const item = document.createElement('label');
      item.className = 'fitem' + (on ? '' : ' off') + (locked ? ' locked' : '');
      item.dataset.kind = name;
      if (section.source) item.dataset.src = name;

      const square = document.createElement('i');
      square.className = 'sq';

      const meta = document.createElement('span');
      meta.className = 'meta';
      const nameLine = cell('nm', filterLabel(section, name));
      // 0 件の札は**箱ごと出さない**（空の札にも flex の gap が付いて、最初の 1 件で並びが動く）。
      const count = countOf(section, name);
      const badge = cell('n', count ? count.toLocaleString() : '');
      badge.hidden = !count;
      nameLine.appendChild(badge);
      // 設定で閉じているものは、なぜ押せないかを説明の代わりに出す。
      meta.append(nameLine, cell('desc', locked ? t('host.log.kind.ApiRequest.locked') : filterDescription(section, name)));

      // 入/切は**ネイティブの checkbox のまま**塗り替える（キーボードも読み上げも自前で作り直さない）。
      const sw = document.createElement('input');
      sw.type = 'checkbox';
      sw.className = 'spoitable-switch';
      sw.setAttribute('role', 'switch');
      sw.checked = on;
      sw.disabled = locked;
      sw.addEventListener('change', () => {
        if (sw.checked) section.off.delete(name); else section.off.add(name);
        item.classList.toggle('off', !sw.checked);
        filterChanged();
        updateFilterSummary();
      });

      item.append(square, meta, sw);
      grid.appendChild(item);
    }

    box.append(head, grid);
    sections.push(box);
  }

  el.filters.replaceChildren(...(sections.length ? sections : [cell('spoitable-empty', t('host.log.filter.noMatch'))]));
  updateFilterSummary();
}

function openFilters() {
  el.filterSearch.value = '';
  renderFilters();
  el.filterModal.hidden = false;
  el.filterSearch.focus();
}

function closeFilters() {
  el.filterModal.hidden = true;
  el.logFilter.focus();
}

/**
 * ボタンの「出しているもの / 全部」。**空の画面の理由が分からない**を作らない。
 */
function updateFilterSummary() {
  let total = 0;
  const off = [];
  for (const section of filterSections()) {
    total += section.names.length;
    for (const name of section.names) if (section.off.has(name) || lockedKind(section, name)) off.push(filterLabel(section, name));
  }

  const shown = `${total - off.length}/${total}`;
  el.logFilterCount.textContent = shown;
  el.logFilter.classList.toggle('narrowed', off.length > 0);
  el.filterShown.textContent = t('host.log.filter.shown', shown);
}

/**
 * 行は消さずに畳む。絞り込みを戻したときに履歴がそのまま戻ってくる。
 * ここはイベントが届くたびに呼ばれる（件数が動くので）— 絞り込みの画面が開いていれば件数だけ追いつかせる。
 */
function applyFilter() {
  const rules = [];
  for (const kind of shownHidden()) rules.push(`#rowsVrc .row[data-kind="${CSS.escape(kind)}"]{display:none}`);
  for (const level of hiddenLevels) rules.push(`#rowsApp .row[data-kind="${CSS.escape(level)}"]{display:none}`);
  for (const src of hiddenSources) rules.push(`#rowsApp .row[data-src="${CSS.escape(src)}"]{display:none}`);
  el.kindFilter.textContent = rules.join('');

  // 畳んだ行をシートで開いたままにしない（見えない行の詳細が残る）。
  if (selectedRow && selectedRow.offsetParent === null) closeSheet();

  if (!el.filterModal.hidden) {
    for (const item of el.filters.querySelectorAll('.fitem')) {
      const section = filterSections().find(s => item.dataset.src ? s.source : !s.source);
      if (!section) continue;
      const count = countOf(section, item.dataset.kind);
      const badge = item.querySelector('.n');
      badge.textContent = count ? count.toLocaleString() : '';
      badge.hidden = !count;
    }
  }

  updateFilterSummary();
  updateCount();
}

/** 検索は CSS で書けないので行ごとに見る。MAX_ROWS で頭打ちなので毎回走らせても足りる。 */
function applySearch() {
  const needle = search.trim().toLowerCase();

  for (const row of activeRows().querySelectorAll('.row')) {
    row.classList.toggle('nomatch', needle !== '' && !row.textContent.toLowerCase().includes(needle));
  }

  updateCount();
}

/** 足元の件数。**どれだけ隠れているか**が分からないと、空の画面の理由が分からない。 */
let logStats = null;

function updateCount() {
  // **畳んでいるかは印で見る。** offsetParent で見ると、ログ画面が前面でないときに全部 0 になる。
  const off = source === 'vrc' ? hidden : hiddenLevels;
  const rows = [...activeRows().querySelectorAll('.row')];
  const shown = rows.filter(row => !row.classList.contains('nomatch') && !off.has(row.dataset.kind)
    && !(row.dataset.src && hiddenSources.has(row.dataset.src))).length;

  const parts = rows.length === 0 ? [] : [t('host.log.count', shown, rows.length)];
  if (source === 'vrc' && logStats) parts.push(t('host.log.stats', logStats.events.toLocaleString(), logStats.lines.toLocaleString()));
  el.logCount.textContent = parts.join(' · ');
}

function selectSource(next) {
  source = next;
  closeSheet();

  // 「一番上へ」で滑っている途中で面を替えたら、その面は上端まで即座に済ませる。
  // 隠すと滑りが止まり、scrollend が来ないことがある（来ないと「上に居る」扱いのまま残る）。
  for (const [name, box] of [['vrc', el.rowsVrc], ['app', el.rowsApp]]) {
    if (name === next || !headingTop[name]) continue;
    headingTop[name] = false;
    box.scrollTo({ top: 0, behavior: 'instant' });
  }

  el.rowsVrc.hidden = next !== 'vrc';
  el.rowsApp.hidden = next !== 'app';
  for (const tab of el.logTabs.querySelectorAll('.spoitable-tab')) {
    const on = tab.dataset.source === next;
    tab.classList.toggle('spoitable-tab-on', on);
    tab.setAttribute('aria-selected', String(on));
  }

  el.logHeadKind.textContent = t(next === 'vrc' ? 'host.log.col.kind' : 'host.log.col.level');
  el.viewLog.dataset.source = next;
  el.toTopWrap.hidden = stuck[next];
  showMore(moreText[next], next);

  applyFilter();
  applySearch();
  updateCrumb();
}

// 記録から読み戻すのと、流れてくるのを受けるのは**別の経路**なので、そのままだと
// 境目で同じ行が 2 回出る（読み戻している最中に届いた分は、読み戻した側にも入っている）。
//
// **どちらの面にも増える一方の通し番号がある。** VRChat 側は DB が採番した id
// （書き手は 1 本なので必ず増える）、アプリ側は台帳の連番。それを使って
// 「読み戻しが描き終わるまで push は溜め、描き終わったら見た番号以下を落とす」で塞ぐ。
//
// DOM と突き合わせる形にしないのは、打ち切りで消えた行を数え直せないため。
//
// ⚠ **アプリ側にも同じ穴がある**: `getStatus` を呼んでから描くまでの隙に届いた行が二重に出る。
//
// **溜めるのはページを読んだ時点から**（`catching: true` で始める）。push は `window.stk` ができた時点で届くので、
// boot の中（bind が済んでから）で溜め始めると、bind を待つ間に届いた行がそのまま描かれ、読み戻しからもう一度足される
// （CPU が混むと bind が遅れて、隙が広がる）。
// 溜めた分は boot の最初の読み戻し（`catchUp`）が流す。

const seam = {
  vrc: { seen: 0, seenLine: 0, catching: true, fills: 0, gated: [], render: r => renderRow(r) },
  app: { seen: 0, catching: true, fills: 0, gated: [], render: r => renderAppLog(r) },
};

/**
 * その行の通し番号と、それを覚えておく場所。
 *
 * **イベントと生行は別の番号空間**（log_events と log_lines）なので、鍵も別に持つ。
 * 1 つにまとめると、片方の番号がもう片方を追い越した瞬間に、追い越された側が
 * 「もう見た」と判定されて<b>出なくなる</b>。
 */
function keyOf(name, row) {
  if (name === 'app') return { field: 'seen', id: row.seq };
  return row.type === 'line' ? { field: 'seenLine', id: row.id } : { field: 'seen', id: row.id };
}

/** まだ見ていない行だけ返す。ついでに見た印を進める。 */
function fresh(name, rows) {
  const s = seam[name];

  // **番号を持たない行は素通し。** 保存していない生行（StoreAllLines が切）は
  // そのセッション限りで、遡っても出てこないので重なりようがない。
  const out = rows.filter(row => {
    const { field, id } = keyOf(name, row);
    return id === null || id === undefined || id > s[field];
  });

  markSeen(name, out);
  return out;
}

function markSeen(name, rows) {
  const s = seam[name];
  for (const row of rows) {
    const { field, id } = keyOf(name, row);
    if (id > s[field]) s[field] = id;
  }
}

/**
 * 読み戻しのあいだ push を止めて、終わってから溜まった分を流す。
 * boot も引き直しもここを通る（同じ穴が 2 箇所に空かないように）。
 */
async function catchUp(name, fill) {
  const s = seam[name];

  // **読み戻しが重なっても、最後の 1 本が終わるまで溜める**（API の入切の引き直しと、日時の範囲の引き直しなど）。
  // 1 本の真偽値だと、先に終わった方が溜めるのをやめ、後の方の作り直しの最中に届いた行が直に描かれて消えた。
  // ⚠ catching はページを読んだ時点から true（bind の前に届く push を溜める）。ここで初めて false になる。
  s.fills++;
  s.catching = true;
  try {
    await fill();
  } finally {
    if (--s.fills === 0) {
      s.catching = false;

      for (const batch of s.gated.splice(0)) {
        const rows = fresh(name, batch);
        if (rows.length) addRows(name, rows, s.render);
      }
    }
    applyFilter();
  }
}

/**
 * 見ている面を、**保存されているものから作り直す**。
 *
 * 打ち切り（`trim`）は畳んである行と生行から先に手放すので、チップを戻しても履歴が無い。
 * **正は DB にある**ので、引き直せば戻せる。
 *
 * ⚠ **生行（raw）は既定では保存していない**（`StoreAllLines` が false）ので戻らない。
 *    全件ログは 1 セッションで 15,000 行を超えるため、既定では捨てている。
 */
/**
 * 面を、**記録から作り直す**。起動直後の追いつきと、引き直しの両方がここを通る。
 *
 * `replace` は「今ある行を捨てるか」。
 * - 引き直し（`true`）: 捨てる。打ち切りで手放した履歴を取り戻すのが目的なので
 * - 起動直後（`false`）: 捨てない。**捨てる物が無いどころか、押し出しで先に届いた行を消す**
 *
 * <b>2 つの道に分けない。</b> 継ぎ目の重複を弾く仕掛けが 2 箇所に分かれると、
 * 片方だけ抜ける。
 */
async function fillFromStore(name, { replace }) {
  // 作り直すなら代を進める（待っている遡りと、前の作り直しの返事を捨てさせる）。
  const mine = replace ? ++generation[name] : generation[name];

  await catchUp(name, async () => {
    if (name === 'app') {
      const status = await bridge.getStatus();
      if (mine !== generation[name]) return;
      const logs = status.appLogs ?? [];

      // 取れてから消す。**先に消すと、失敗したときに空の画面だけが残る。**
      if (replace) {
        el.rowsApp.replaceChildren();
        stuck.app = true;
      }

      // 下へ辿ったときの続きは、作り直した面の一番下から。
      appPage.exhausted = false;
      showMore('', 'app');

      // **台帳は古い順で来る**ので、新しい順に直してから下へ繋ぐ（`older` はそのまま下へ足す）。
      // 前の起動の行まで読み戻すと 1,000 行がこの向きになるので、ここで揃える。
      markSeen('app', logs);
      addRows('app', [...logs].reverse(), renderAppLog, { older: true });
      return;
    }

    const result = await bridge.queryLog(pageRequest({}));
    if (mine !== generation[name]) return;

    if (replace) {
      el.rowsVrc.replaceChildren();
      seen.clear();
      stuck.vrc = true;
    }

    page.oldestId = result.oldestId;
    page.oldestTs = result.oldestTs;
    page.exhausted = !result.hasMore;

    markSeen('vrc', result.rows);
    addRows('vrc', result.rows, renderRow, { older: true, paged: true });
    showMore();
  });
}

// **下へスクロールすると過去へ継ぎ足す**（新しいものが上なので、下が過去）。
// 継ぎ目は log_events の id で送る。生行は log_lines の別の番号なので id では追えず、
// **そのページが覆う時間帯**で引く。

const page = {
  size: MAX_ROWS,
  from: null,
  to: null,
  oldestId: null,
  oldestTs: null,
  exhausted: false,
  loading: false,
};

/** いま画面が持っている「保存する / しない」。生行を遡れるかがこれで決まる。 */
let storeAllLines = false;

/**
 * API の呼び出しを残しているか（設定の StoreApiRequests、既定 切）。**切のあいだは新しいものが届かない**ので、
 * 溜まっている分も出さず、絞り込みの「API」は押せない形にする。
 * ⚠ 利用者が選んだ畳み（hidden）には混ぜない。混ぜて setHiddenKinds で残すと、入に戻したときに選んでいた状態が消える。
 */
let storeApiRequests = false;
let apiKnown = false;

function lockedKind(section, name) {
  return section.off === hidden && name === 'ApiRequest' && !storeApiRequests;
}

/** 実際に畳む種別 = 利用者が選んだもの + 設定で閉じているもの。 */
function shownHidden() {
  return storeApiRequests ? hidden : new Set([...hidden, 'ApiRequest']);
}

/** 設定で API の入 / 切が変わった。畳みを付け直し、記録から引き直す（除く種別が変わったので）。 */
function apiSwitched() {
  applyFilter();
  if (!el.filterModal.hidden) renderFilters();
  else updateFilterSummary();
  fillFromStore('vrc', { replace: true });
}

function pageRequest({ beforeId = null, beforeTs = null }) {
  return JSON.stringify({
    limit: page.size,
    beforeId,
    linesBefore: beforeTs,

    // **畳んでいる種別は DB 側で除く。** 除かないと、実データでは 92% が ApiRequest なので
    // 100 件取っても見える行が数件にしかならない。raw はイベントの種別ではないので外す。
    excludeKinds: [...shownHidden()].filter(kind => kind !== 'raw'),
    from: page.from,
    to: page.to,

    // 生行は保存していないと遡れない。**チップで出しているときだけ**混ぜる。
    includeLines: storeAllLines && !hidden.has('raw'),
  });
}

/**
 * 足元の「読み込み中…」「これより古い記録はありません」。**面ごとに持つ** —
 * 1 つだと、アプリの面で出した「ありません」が VRChat の面へ切り替えても残る。
 */
const moreText = { vrc: '', app: '' };

function showMore(text, name = 'vrc') {
  moreText[name] = text ?? '';
  if (name !== source) return;
  el.logMoreText.textContent = moreText[name];
  el.logMore.hidden = !moreText[name];
}

/**
 * 過去を 1 ページ継ぎ足す。**下端に近づいたら呼ばれる。**
 * 走っている間と、もう無いことを足元に出す — 出さないと、止まったのか終わったのかが分からない。
 */
async function loadOlder() {
  if (source !== 'vrc' || page.loading || page.exhausted || page.oldestId === null) return;

  const mine = generation.vrc;
  page.loading = true;
  showMore(t('common.ui.loading'));
  try {
    const result = await bridge.queryLog(pageRequest({ beforeId: page.oldestId, beforeTs: page.oldestTs }));
    if (mine !== generation.vrc) return;

    page.exhausted = !result.hasMore;
    if (result.oldestId !== null) {
      page.oldestId = result.oldestId;
      page.oldestTs = result.oldestTs;
    }

    markSeen('vrc', result.rows);
    addRows('vrc', result.rows, renderRow, { older: true, paged: true });
  } finally {
    page.loading = false;

    // 代が変わっていたら足元も触らない（足元は新しい代が決める）。
    if (mine === generation.vrc) showMore(page.exhausted ? t('host.log.noMore') : '');
  }
}

/** アプリの面の遡り。続きの位置は持たない — いつも**いま一番下に居る行**の番号から（下の loadOlderApp）。 */
const appPage = { loading: false, exhausted: false };

/**
 * アプリの面を 1 ページ過去へ継ぎ足す（記録 `applog.db` から。前の起動の行も出る）。
 *
 * **続きは一番下の行の番号から引く。** 台帳の追いつきは 1,000 行来るが画面に残るのは 500 行で、
 * 残りは打ち切り（`trim`）に落とされている。覚えておいた位置から引くと、その落とされた分が穴になる。
 */
async function loadOlderApp() {
  if (source !== 'app' || appPage.loading || appPage.exhausted) return;

  const rows = el.rowsApp.querySelectorAll(':scope > .row[data-seq]');
  const bottom = rows[rows.length - 1];
  if (!bottom) return;

  const mine = generation.app;
  appPage.loading = true;
  showMore(t('common.ui.loading'), 'app');
  try {
    const result = await bridge.queryAppLogs(JSON.stringify({ beforeSeq: Number(bottom.dataset.seq), limit: page.size }));
    if (mine !== generation.app) return;

    appPage.exhausted = !result.hasMore;

    // **遡った行は打ち切りに数えない**（paged）。押し出されると、下へ辿ったのに上へ戻ると無い、になる。
    addRows('app', result.rows, renderAppLog, { older: true, paged: true });
  } finally {
    appPage.loading = false;
    if (mine === generation.app) showMore(appPage.exhausted ? t('host.log.noMore') : '', 'app');
  }
}

async function reloadRows() {
  await fillFromStore(source, { replace: true });
}

const RELOAD_TURN_MS = 700;
let reloading = false;

/**
 * 「再読み込み」を押した。**読み直している間ずっと回し、速く終わっても 1 周は回す**（一瞬で終わると回ったのが見えない）。
 * 止めるのは周の切れ目（途中で止めると、向きが跳ねて戻って見える）。
 * **回っている間の押下は無視する**（読み直しを重ねない）。OS で動きを減らしているときは回さない（読み直している間の押下は同じく無視する）。
 */
async function pressReload() {
  if (reloading) return;
  reloading = true;
  el.logReload.setAttribute('aria-busy', 'true');

  const spin = matchMedia('(prefers-reduced-motion: reduce)').matches
    ? null
    : el.logReload.querySelector('.ic').animate(
      [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
      { duration: RELOAD_TURN_MS, iterations: Infinity });

  try {
    await reloadRows();
  } finally {
    if (spin) {
      // 回り始めてからの周を数え、その周の終わりで止める（少なくとも 1 周）。
      spin.effect.updateTiming({ iterations: Math.max(1, Math.ceil((spin.currentTime ?? 0) / RELOAD_TURN_MS)) });
      try { await spin.finished; } catch { /* 取り消された */ }
    }
    reloading = false;
    el.logReload.removeAttribute('aria-busy');
  }
}

/**
 * 日時の範囲を読み取って取り直す。
 *
 * `datetime-local` は<b>タイムゾーンを持たない</b>文字列（`YYYY-MM-DDTHH:mm`）を返すので、
 * ここでその機械の時刻として解釈し、オフセット付きにして渡す。
 * C# 側は `strftime('%s', …)` で両辺を秒に直して比べるので、オフセットが違っても正しい。
 */
function applyRange() {
  const asLocal = value => (value ? new Date(value).toISOString() : null);

  page.from = asLocal(el.logFrom.value);
  page.to = asLocal(el.logTo.value);
  fillFromStore('vrc', { replace: true });
}

// C# 側 (UiBroadcast) から呼ばれる唯一の入口。
window.stk = {
  receive(channel, payload) {
    if (channel === 'logEvents' || channel === 'logLines') {
      // **生行も同じ道を通す。** 保存が入のときは生行も通し番号を持つので、
      // 素通しにすると継ぎ目で二重に出る（番号を持たない行は fresh が素通しする）。
      // 読み戻している最中は溜める。終わってから、まだ見ていない分だけ流す。
      if (seam.vrc.catching) { seam.vrc.gated.push(payload); return; }

      const rows = fresh('vrc', payload);
      if (rows.length) {
        addRows('vrc', rows, renderRow);

        // 種別ごとの件数は絞り込みに出るので、イベントが来たときだけ数え直す。
        if (channel === 'logEvents') {
          applyFilter();
          if (activeView === 'dashboard') refreshRecent();
        }
      }
    } else if (channel === 'appLogs') {
      if (seam.app.catching) { seam.app.gated.push(payload); return; }

      const rows = fresh('app', payload);
      if (rows.length) addRows('app', rows, renderAppLog);
    } else if (channel === 'notify') {
      upsertAsk(payload);
    } else if (channel === 'notifyClosed') {
      // どこかの面で答えられた / 時間が切れた。こちらは黙って引っ込める。
      removeAsk(payload.id);
    } else if (channel === 'toast') {
      upsertToast(payload);
    } else if (channel === 'toastClosed') {
      removeToast(payload.id);
    } else if (channel === 'notifyHistory') {
      upsertHistory(payload);
    } else if (channel === 'statusItems') {
      applyStatusItems(payload);
    } else if (channel === 'logStats') {
      logStats = payload;
      updateCount();
    } else if (channel === 'showPanel') {
      // モジュールが「自分の画面を出して」と言ってきた。
      // **パネルを持っていなければ selectView が何もしない**ので、ここでは確かめない
      // （iframe は初めて開いたときに作るので、views を見ると「まだ開いていない」を弾いてしまう）。
      selectView(payload.module);
    } else if (channel === 'shortcutStatus') {
      // 手首のタイルの中身。設定のモーダルの左の行に出す。
      applyShortcutValues(payload);
    } else if (channel === 'vrLayout') {
      // 手首の 🔓 / 完了（Layout Mode は手首と空間の窓で共通）。**空間の窓のページにだけ**届く。
      vrLayoutPushes++;
      showVrLayout(payload.on);
    } else if (channel === 'banner') {
      upsertBanner(payload);
    } else if (channel === 'bannerClosed') {
      el.banners.querySelector(`.banner[data-id="${payload.id}"]`)?.remove();
    } else if (channel === 'appUpdate') {
      applyAppUpdate(payload);
    } else if (channel === 'modulesChanged') {
      // どちらかの面で ON/OFF・外すを変えた。**開いていなくても描いておく**（開いたときにも取り直す）。
      renderModuleCatalog(payload);
    } else if (channel === 'moduleJobs') {
      // インストールしている途中のもの（カード）。こちらも、開いていなくても描いておく。
      renderModuleJobs(payload);
    } else if (channel === 'configChanged') {
      // テーマが変わっているかもしれない。**シェルは自前で張り直す**（自分は読み込み直さない）。
      // href を変えないと、同じ URL のまま再取得が起きない。
      const theme = document.querySelector('link[href^="/_host/theme.css"]');
      if (theme) theme.href = '/_host/theme.css?v=' + themeLoad + '-' + (++themeVersion);

      // パネルにも伝える。**読み込み直しとは別の道**にしておく —
      // 読み込み直しは前の読み込み中だと無視されるので、続けて切り替えると取り残される。
      broadcastToPanels('configChanged', {});

      // **まだ読み込み中のパネルには届かない**（ready の前の postMessage は消える）。覚えておいて、ready で渡す。
      // 渡さないと、開いた直後にテーマを変えたパネルだけ前の配色で残る。
      for (const entry of panels.values()) if (!entry.ready) entry.missedConfig = true;

      // 別のサーフェスで適用された分に追いつく。
      // ただし触りかけの変更があるなら消さない（次の「適用」でこちらの値が勝つ）。
      // 設定のモーダル（手首のショートカット・スイッチの一覧）が開いている間は、閉じるまで待たせる — 「完了」は開いたときの行に溜めるので、
      // 下で作り直すと、溜めが外れた行に付いて「変更」の印が出ない。
      const refresh = () => {
        if (settingsModalOpen()) { settingsRefreshMissed = true; return; }
        if (activeView === 'settings' && pending.size === 0) loadSettings({ keepScroll: true });
      };

      // **パネルを読み込み直すのは言語が変わったときだけ。**
      // 保存のたびに読み込み直すと、続けて保存したときに前の読み込み中のものが取り残されて、
      // テーマの当たっていない真っ白なパネルが残る。
      if (payload && payload.language) {
        loadStrings().then(() => {
          // パネルは読み込み時に状態を取り直す作りなので、読み込み直せば新しい言語になる。
          // 読み込み直している間は**読み込み中に戻す**。ready のままだと、その間のテーマの変更を
          // 消える postMessage で送ってしまい、取りこぼしの印（missedConfig）も付かない。
          for (const frame of document.querySelectorAll('iframe.view')) {
            const entry = panels.get(frame.dataset.id);
            if (entry) entry.ready = false;
            frame.src = frame.src;
          }
          relabel();
          refresh();
        });
      } else {
        refresh();
      }
    } else if (channel === 'configAction') {
      // 設定画面の動きの行が変わった。**その行だけ**を描き直す（画面ごと読み直すと、溜めてある変更が消える）。
      applyActionPush(payload);
    } else if (channel === 'modulePush') {
      deliverPush(payload);
    } else if (channel === 'status') {
      applyStatus(payload);
    }
  },
};

/** 読み込みと、5 秒ごとの拾い直し。push を取りこぼしていても、ここで追いつく。 */
function applyStatus(status) {
  document.getElementById('version')?.replaceChildren(document.createTextNode('v' + status.version));

  // 生行を遡れるかは保存の設定しだい。設定を変えたら次の引き直しから効く。
  storeAllLines = status.storeAllLines === true;

  // API の入 / 切。**最初の 1 回は引き直さない** — 起動ではこのあとで初めて記録から読む。
  const api = status.storeApiRequests === true;
  if (api !== storeApiRequests) {
    storeApiRequests = api;
    if (apiKnown) apiSwitched();
  }
  apiKnown = true;

  applyStatusItems(status.status ?? []);

  // push は受け取れない間は捨てられるので、出ている途中のものはここで拾い直す。
  for (const toast of status.toasts ?? []) upsertToast(toast);

  // **バナーはここが本番。** モジュールの読み込みは画面より先に走るので、
  // そこで出た分は push では一度も届いていない。
  for (const banner of status.banners ?? []) upsertBanner(banner);

  // 答えを待っている確認と、通知の履歴。どちらも番号で重なりを弾く。
  for (const ask of status.asks ?? []) upsertAsk(ask);
  for (const entry of [...(status.history ?? [])].reverse()) upsertHistory(entry);
}

// **正は C# 側。** 並ぶ順も、何を出すかも、向こうが決めて渡してくる。
// モジュールの分はサイドバーのその行の右、本体（host）の分はタイトルバーの右、全部をダッシュボードの札にも。

let statusItems = [];

/** 状態 1 つを、点 + 薄い字（Ok / Off）か、色の札（Warn / Bad）にして入れる。 */
function paintStatus(node, item) {
  node.replaceChildren();
  node.hidden = !item;
  if (!item) return;

  node.dataset.state = item.state;
  node.title = item.note ?? '';
  if (item.state === 'ok' || item.state === 'off') node.appendChild(Object.assign(document.createElement('i'), { className: 'dot' }));
  node.appendChild(document.createTextNode(item.text));
}

function applyStatusItems(items) {
  statusItems = items ?? [];
  const byId = new Map(statusItems.map(item => [item.id, item]));

  for (const button of el.sidebar.querySelectorAll('.item[data-id]')) {
    const item = byId.get(button.dataset.id);
    paintStatus(button.querySelector('.st'), item);

    const pip = button.querySelector('.pip');
    pip.hidden = !item;
    if (item) pip.dataset.state = item.state;
  }

  // タイトルバーの右。**ログを読んでいるか**（ファイル名は指を乗せると出る）。
  const host = byId.get('host');
  el.hostStatus.hidden = !host;
  if (host) {
    el.hostStatus.dataset.state = host.state;
    el.hostStatus.querySelector('.txt').textContent = host.text;
    el.hostStatus.title = host.note ?? '';
  }

  if (activeView === 'dashboard') renderDashboard();
}

// 消すまで出続ける。**引っ込める口はホストにも無い** — 消すのは利用者だけ。

function upsertBanner(banner) {
  if (el.banners.querySelector(`.banner[data-id="${banner.id}"]`)) return;

  const node = document.createElement('div');
  node.className = 'banner';
  node.dataset.id = banner.id;
  node.setAttribute('role', 'alert');

  const text = document.createElement('div');
  text.className = 'text';
  text.append(cell('title', banner.title));
  const body = cell('body', banner.body ?? '');
  body.hidden = !banner.body;
  text.append(body);

  const acts = document.createElement('div');
  acts.className = 'acts';
  for (const action of banner.actions ?? []) {
    const button = document.createElement('button');
    button.className = 'spoitable-btn spoitable-btn-small';
    button.textContent = action.label;
    button.addEventListener('click', () => bridge.invokeBannerAction(banner.id, action.index));
    acts.appendChild(button);
  }

  // 帯に出るのは「読み込めなかった」など、**理由がアプリのログにあるもの**。その場所まで連れて行く。
  const toLog = document.createElement('button');
  toLog.className = 'spoitable-btn spoitable-btn-small';
  toLog.textContent = t('host.banner.openLog');
  toLog.addEventListener('click', () => { selectView('log'); selectSource('app'); });
  acts.appendChild(toLog);

  const close = document.createElement('button');
  close.className = 'spoitable-ib x';
  close.title = t('common.ui.close');
  close.setAttribute('aria-label', t('common.ui.close'));
  close.appendChild(icon('i-x'));
  close.addEventListener('click', () => bridge.closeBanner(banner.id));

  node.append(kindSquare(banner.kind), text, acts, close);
  el.banners.appendChild(node);
}

function applyHiddenKinds(kinds) {
  hidden.clear();
  for (const kind of kinds ?? []) hidden.add(kind);
  applyFilter();
}

// **トーストの束のいちばん下（角）に、縁の強い札で出す。画面は塞がない**（モーダルにしない）。
// 時間切れは**ホストが決める** — ここで「いいえ」と答えてしまうと、時間切れの確認を履歴から後で答えられなくなる。
// 残り時間は下端の線だけで示す。

function upsertAsk(ask) {
  if (el.asks.querySelector(`.ask[data-id="${ask.id}"]`)) return;

  const node = document.createElement('div');
  node.className = 'ask';
  node.dataset.id = ask.id;
  node.setAttribute('role', 'alertdialog');
  node.setAttribute('aria-label', ask.title);

  const top = document.createElement('div');
  top.className = 'top';
  const text = document.createElement('div');
  text.className = 'text';
  text.append(cell('title', ask.title));
  if (ask.body) text.append(cell('body', ask.body));
  top.append(kindSquare(ask.kind), text);

  const acts = document.createElement('div');
  acts.className = 'acts';
  if (ask.optOutLabel) {
    const optOut = document.createElement('button');
    optOut.className = 'spoitable-btn spoitable-btn-ghost optout';
    optOut.textContent = ask.optOutLabel;
    optOut.addEventListener('click', () => { removeAsk(ask.id); bridge.optOutNotification(ask.id); });
    acts.appendChild(optOut);
  }
  acts.appendChild(cell('spoitable-spacer', ''));

  const no = document.createElement('button');
  no.className = 'spoitable-btn no';
  no.textContent = t('common.ui.close');
  no.addEventListener('click', () => answerNotification(ask.id, false));

  const yes = document.createElement('button');
  yes.className = 'spoitable-btn spoitable-btn-primary yes';
  yes.textContent = ask.confirmLabel;
  yes.addEventListener('click', () => answerNotification(ask.id, true));
  acts.append(no, yes);

  // 残り時間の線。**残りから縮める**（読み込み直した画面は、もう過ぎた分を待たない）。
  const life = document.createElement('span');
  life.className = 'life';
  const total = ask.totalMs || ask.timeoutMs || 0;
  const left = ask.timeoutMs ?? total;
  if (total > 0) {
    life.style.transform = `scaleX(${Math.min(1, left / total)})`;

    // 置いてから縮める（置いた同じ描画の中で書き換えると、縮む動きにならない）。
    requestAnimationFrame(() => requestAnimationFrame(() => {
      life.style.transition = `transform ${left}ms linear`;
      life.style.transform = 'scaleX(0)';
    }));
  }

  node.append(top, acts, life);
  el.asks.appendChild(node);
}

function removeAsk(id) {
  el.asks.querySelector(`.ask[data-id="${id}"]`)?.remove();
}

function answerNotification(id, accepted) {
  removeAsk(id);
  bridge.answerNotification(id, accepted);
}

// **正は C# 側にある。** ここは写しているだけで、消す時計もホストが持っている
// （取っ手が後から書き換えられる以上、画面で消えたものが更新で生き返ってはいけない）。
// 種類の色の角四角 + 題 + 薄い本文。

function upsertToast(toast) {
  let node = el.toasts.querySelector(`.toast[data-id="${toast.id}"]`);

  if (!node) {
    node = document.createElement('div');
    node.className = 'toast';
    node.dataset.id = toast.id;
    node.setAttribute('role', 'status');

    const text = document.createElement('div');
    text.className = 'text';
    text.append(cell('title', ''), cell('body', ''));

    const progress = document.createElement('div');
    progress.className = 'prog';
    progress.hidden = true;
    progress.append(Object.assign(document.createElement('span'), { className: 'track' }), cell('pct', ''));
    progress.firstChild.appendChild(document.createElement('i'));

    const acts = document.createElement('div');
    acts.className = 'acts';
    acts.hidden = true;
    text.append(progress, acts);

    // 閉じるのはホストへ頼む。**ここで消さない** — 消えたかどうかの正はホストが持つ。
    const close = document.createElement('button');
    close.className = 'spoitable-ib x';
    close.title = t('common.ui.close');
    close.setAttribute('aria-label', t('common.ui.close'));
    close.appendChild(icon('i-x'));
    close.addEventListener('click', () => bridge.closeToast(toast.id));

    node.append(kindSquare(toast.kind), text, close, Object.assign(document.createElement('span'), { className: 'life' }));

    // 新しいものは**答えを待つものの上**に積む（答えを待つものは束のいちばん下に居続ける）。
    el.toasts.insertBefore(node, el.asks);
  }

  node.querySelector('.text > .title').textContent = toast.title;

  const body = node.querySelector('.text > .body');
  body.textContent = toast.body ?? '';
  body.hidden = !toast.body;

  // 押せるもの。**押したら閉じるのはホスト側**なので、ここでは頼むだけ。題の下に並べる。
  const acts = node.querySelector('.acts');
  const actions = toast.actions ?? [];
  acts.hidden = actions.length === 0;
  if (acts.childElementCount !== actions.length) {
    acts.replaceChildren(...actions.map(action => {
      const button = document.createElement('button');
      button.className = 'spoitable-btn spoitable-btn-small act';
      button.textContent = action.label;
      button.addEventListener('click', () => bridge.invokeToastAction(toast.id, action.index));
      return button;
    }));
  }

  // 進み具合。**時計が止まる**ので、残り時間の線は出さずに細い棒と百分率。
  const progress = node.querySelector('.prog');
  const hasProgress = typeof toast.progress === 'number';
  progress.hidden = !hasProgress;
  if (hasProgress) {
    const percent = Math.round(toast.progress * 100);
    progress.querySelector('i').style.width = `${percent}%`;
    progress.querySelector('.pct').textContent = `${percent}%`;
  }

  // **押せるもの・進み具合のあるものは、空間の窓でも出す**（手首の通知は字だけで、押せない・進みも出ない）。
  node.classList.toggle('actionable', actions.length > 0 || hasProgress);

  // 時間で消えるものは、下端の線がその長さで縮む。
  const life = node.querySelector('.life');
  if (!hasProgress && toast.lingerMs > 0) {
    if (life.dataset.ms !== String(toast.lingerMs)) {
      life.dataset.ms = String(toast.lingerMs);
      life.style.animation = 'none';
      void life.offsetWidth;
      life.style.animation = '';
      life.style.animationDuration = `${toast.lingerMs}ms`;
    }
    life.hidden = false;
  } else {
    life.hidden = true;
  }
}

function removeToast(id) {
  const node = el.toasts.querySelector(`.toast[data-id="${id}"]`);
  if (!node || node.classList.contains('going')) return;

  // 引っ込む動きが終わってから外す。**終わりを待たずに保険も置く** —
  // animationend は、動きが無効な環境やタブが裏に居る間は来ないことがある。
  node.classList.add('going');
  node.addEventListener('animationend', event => { if (event.target === node) node.remove(); });
  setTimeout(() => node.remove(), 400);
}

// このセッションの分だけ。**開いたら全部読んだことにする**（未読の数はベルの角）。

const notifyHistory = new Map();   // seq -> entry
let readUpTo = 0;

function upsertHistory(entry) {
  notifyHistory.set(entry.seq, entry);
  if (!el.history.hidden) renderHistory();
  updateBell();
}

function updateBell() {
  const unread = [...notifyHistory.keys()].filter(seq => seq > readUpTo).length;
  el.bellCount.hidden = unread === 0;
  el.bellCount.textContent = unread > 99 ? '99+' : String(unread);
}

function historyState(entry) {
  if (entry.type !== 'ask' || !entry.state || entry.state === 'pending') return '';
  return t('host.bell.state.' + entry.state);
}

function renderHistory() {
  const entries = [...notifyHistory.values()].sort((a, b) => b.seq - a.seq);
  if (entries.length === 0) {
    el.historyList.replaceChildren(cell('spoitable-empty', t('host.bell.empty')));
    return;
  }

  el.historyList.replaceChildren(...entries.map(entry => {
    const node = document.createElement('div');
    node.className = 'hitem';
    node.dataset.seq = entry.seq;
    node.dataset.type = entry.type;

    const text = document.createElement('div');
    text.className = 'text';
    text.append(cell('title', entry.title));
    if (entry.body) text.append(cell('body', entry.body));

    const state = historyState(entry);
    if (state) text.append(cell('state', state));

    // 時間切れの確認は、ここから後で答えられる（1 回だけ）。
    if (entry.later) {
      const later = document.createElement('button');
      later.className = 'spoitable-btn spoitable-btn-small spoitable-btn-primary later';
      later.textContent = entry.confirmLabel ?? t('host.bell.later');
      later.addEventListener('click', () => bridge.answerNotificationLate(entry.seq));
      text.append(later);
    }

    node.append(kindSquare(entry.kind), text, cell('at', clock(entry.at)));
    return node;
  }));
}

function toggleHistory(open = el.history.hidden) {
  el.history.hidden = !open;
  el.bell.setAttribute('aria-expanded', String(open));
  if (!open) return;

  renderHistory();
  readUpTo = Math.max(readUpTo, ...notifyHistory.keys(), 0);
  updateBell();
}

// モジュール 1 つ = iframe 1 枚 = origin 1 つ。同じ document に混ぜると CSS が衝突し、
// 1 つの JS エラーで全部巻き添えになる。origin が分かれていれば、呼び出し元も origin で特定できる。

const views = new Map([
  ['dashboard', el.viewDashboard], ['log', el.viewLog], ['settings', el.viewSettings], ['moduleManager', el.viewModuleManager],
]);
const panels = new Map();     // id -> { panel(URL), origin, name }
let activeView = null;

function moduleOrigin(id) {
  // URL.origin は独自スキームだと "null" になりうるので、自前で組む。
  return 'spoitable://' + id;
}

/** サイドバーを細い帯にしているか。**この窓だけの好み**なので、ブラウザに覚えさせる（無くても困らない）。 */
function railPreferred() {
  try { return localStorage.getItem('stk.rail') === '1'; } catch { return false; }
}

function setRail(on) {
  document.body.classList.toggle('rail', on);
  try { localStorage.setItem('stk.rail', on ? '1' : '0'); } catch { /* 覚えられなくても動く */ }
}

function navItem({ id, key, name, svg }) {
  const button = document.createElement('button');
  button.className = 'item';
  button.dataset.id = id;

  // キーを持つものは data-i18n を残す。**言語を変えたら作り直さずに差し替えられる**
  // （作り直すと選んでいる画面が戻ってしまう）。
  const label = cell('lbl', key ? t(key) : name);
  if (key) label.dataset.i18n = key;

  // **乗せたときの名前は出さない**。
  // 名前は読み上げのために `aria-label` へ残す — 細い帯では字が消えるので、無いと名前の無いボタンになる。
  // キーを持つものは言語を変えたら差し替わるよう `data-i18n-aria-label` で持つ。
  button.setAttribute('aria-label', key ? t(key) : name);
  if (key) button.dataset.i18nAriaLabel = key;

  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.appendChild(svg);

  const pip = document.createElement('i');
  pip.className = 'pip spoitable-state';
  pip.hidden = true;
  ico.appendChild(pip);

  const status = cell('st spoitable-state', '');
  status.hidden = true;

  button.append(ico, label, status);
  button.addEventListener('click', () => selectView(id));
  return button;
}

/**
 * 段の見出し。**短い線 + 名前**にして、畳んだら名前だけ消えて線が残る。
 * 言語を変えると `data-i18n` の要素は中身ごと差し替わるので、キーは名前の側に持たせる（見出しに付けると線が消える）。
 */
function navHeading(key) {
  const head = document.createElement('div');
  head.className = 'heading';

  const rule = document.createElement('i');
  rule.className = 'rule';

  const label = cell('label', t(key));
  label.dataset.i18n = key;

  head.append(rule, label);
  return head;
}

function buildSidebar(modules) {
  const brand = document.createElement('div');
  brand.className = 'brand';
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.appendChild(pathIcon('M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z'));
  const name = cell('name', 'SpoitableToolKit');
  brand.append(mark, name);

  // 版は**下の段**に置く。名前の横だと幅が足りず「v202…」で切れる。
  const version = cell('ver', '');
  version.id = 'version';

  const items = [
    navItem({ id: 'dashboard', key: 'host.nav.dashboard', svg: icon('i-dash') }),
    navItem({ id: 'log', key: 'host.nav.log', svg: icon('i-log') }),
  ];

  const moduleItems = [];
  for (const module of modules) {
    if (!module.panel) continue;   // パネルを持たないモジュールは出さない（ホスト側で実体も確認済み）

    // 空間の窓では、**VR 専用のページがあればそちら**。同じ origin なので、呼び出し元の決め方は変わらない。
    const panel = IN_VR_WINDOW && module.vrPanel ? module.vrPanel : module.panel;
    panels.set(module.id, { panel, origin: moduleOrigin(module.id), ready: false, name: module.name });

    // 線のアイコン（パス）があればそれ。無ければ作者が決めた字（絵文字）か頭文字。
    let svg;
    if (module.iconPath) svg = pathIcon(module.iconPath);
    else {
      svg = document.createElement('span');
      svg.className = 'glyph';
      svg.textContent = module.icon || module.name.slice(0, 1);
    }
    moduleItems.push(navItem({ id: module.id, name: moduleName(module.id, module.name), svg }));
  }

  const toggle = document.createElement('button');
  toggle.className = 'railbtn';
  toggle.dataset.i18nTitle = 'host.nav.rail';
  toggle.title = t('host.nav.rail');
  toggle.appendChild(icon('i-rail'));
  toggle.addEventListener('click', () => setRail(!document.body.classList.contains('rail')));

  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.append(toggle, version);

  el.sidebar.replaceChildren(
    brand,
    ...items,
    ...(moduleItems.length ? [navHeading('host.nav.modules'), ...moduleItems] : []),
    navHeading('host.nav.host'),
    navItem({ id: 'moduleManager', key: 'host.nav.moduleManager', svg: icon('i-plug') }),
    navItem({ id: 'settings', key: 'host.nav.settings', svg: icon('i-gear') }),
    cell('fill', ''),
    foot);

  setRail(!IN_VR_WINDOW && railPreferred());
  applyStatusItems(statusItems);

  // 空間の窓は**開いた画面から始める**（手首のショートカット）。作った直後のページには push が届かないので URL で受ける。
  const first = IN_VR_WINDOW ? SURFACE.get('view') : null;
  const firstId = first ? first.split('#')[0] : null;
  selectView(firstId && (views.has(firstId) || panels.has(firstId)) ? first : 'log');
}

/** 言語を変えたあと、組み直さずに名前を差し替える（選んでいる画面を保つ）。 */
function relabel() {
  for (const button of el.sidebar.querySelectorAll('.item[data-id]')) {
    const id = button.dataset.id;
    const label = button.querySelector('.lbl');
    if (panels.has(id)) label.textContent = moduleName(id, panels.get(id).name);
    button.setAttribute('aria-label', label.textContent);
  }

  // 起動の境目の印も言語を持っている。
  for (const mark of el.rowsApp.querySelectorAll(':scope > .run-mark')) mark.textContent = runLabel(mark.dataset.run);

  updateCrumb();
  selectSource(source);
}

// iframe は初めて開いたときに作る（開かれないモジュールのためにレンダラを増やさない）。
// 一度作ったら残す。閉じるたびに作り直すと、モジュール側の画面の状態が毎回飛ぶ。
function ensureView(id) {
  if (views.has(id)) return views.get(id);

  const panel = panels.get(id);
  if (!panel) return null;

  const frame = document.createElement('iframe');
  frame.className = 'view';

  // どのモジュールの窓かを DOM に残す。開いた窓は閉じずに溜まるので、
  // 2 つ目のパネルが出来た時点で「iframe.view」だけでは指せなくなる。
  frame.dataset.id = id;
  frame.hidden = true;
  frame.src = IN_VR_WINDOW ? inVrWindow(panel.panel) : panel.panel;
  el.views.append(frame);
  views.set(id, frame);
  return frame;
}

/**
 * 空間の窓で開くパネルの URL。<b>シェルと同じ印 <c>surface=window</c> を付ける</b> — パネルの bridge.js がこれを見て、
 * 巻き棒を窓の太いものにそろえる（シェルの <c>body.vr-window</c> と同じ見た目。パネルは別 origin なので、シェルの CSS は届かない）。
 * モジュールも同じ印で「VR の窓の中か」を知れる。
 */
function inVrWindow(url) {
  const marked = new URL(url, location.href);
  marked.searchParams.set('surface', 'window');
  return marked.href;
}

/**
 * 画面を出す。<b><c>id#場所</c></b> なら、そのパネルの URL の <c>#</c> の後ろへ場所を渡す（手首のショートカットがパネルの中の場所を指したとき。
 * パネルは <c>location.hash</c> / <c>hashchange</c> で受ける）。場所が無ければパネルはそのまま。
 */
function selectView(target) {
  const [id, place] = String(target).split('#', 2);
  const view = ensureView(id);
  if (!view) return;

  // 設定のモーダルは設定の画面の持ち物。ほかへ移るとき（VR の窓で手首のタイルを押したときなど）は、
  // 外を押したのと同じく何も残さずに閉じる。設定を開き直すときも閉じる — 下で読み直すと溜めが消え、行も作り直される。
  if (scState) closeShortcutModal();
  if (swState) closeSwitchModal();

  // **場所が来たら毎回送る**（比べない）。iframe の src は属性で、パネルが中で別の場所へ移っても変わらないので、
  // 比べると「同じ場所のタイルを押し直しても戻らない」になる。URL が # の後ろしか違わなければ、
  // 読み直しにはならず hashchange だけが起きる。
  if (place && view.tagName === 'IFRAME') {
    const url = new URL(view.src);
    url.hash = place;
    view.src = url.href;
  }

  // 開くたびに取り直す。もう一方のサーフェスで変えられていても追いつける。
  if (id === 'settings') loadSettings();
  if (id === 'dashboard') { renderDashboard(); refreshRecent(); }
  if (id === 'moduleManager') { loadModuleCatalog(); loadModuleJobs(); }
  // 「モジュールを追加」のモーダルは、モジュールの画面のもの。ほかの画面へ移ったら閉じる（件は止めない。手首のショートカットが VR の窓の画面を替える）。
  else if (!el.maModal.hidden) closeAddModule();

  for (const [, other] of views) other.hidden = other !== view;
  view.hidden = false;
  activeView = id;

  for (const button of el.sidebar.querySelectorAll('.item[data-id]')) {
    const on = button.dataset.id === id;
    button.classList.toggle('on', on);
    if (on) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
  }

  updateCrumb();

  // 空間の窓は**今どの画面かを C# に知らせる**。手首のショートカットをもう一度押したとき、
  // 出している画面なら閉じ、別の画面なら切り替える — その判断は C# がする。場所ごと返す（同じパネルの別の場所のタイルは「切り替える」）。
  if (IN_VR_WINDOW) bridge.vrWindowViewing(target);
}

function updateCrumb() {
  if (!activeView) return;

  const parts = [];
  if (panels.has(activeView)) parts.push(moduleName(activeView, panels.get(activeView).name));
  else parts.push(t('host.nav.' + activeView));
  if (activeView === 'log') parts.push(t('host.log.source.' + source));

  el.crumb.replaceChildren(...parts.flatMap((part, i) => [
    ...(i > 0 ? [icon('i-right')] : []),
    cell(i === parts.length - 1 ? 'here' : 'up', part),
  ]));
}

// 入っているもの（同梱・GitHub から入れたもの・ライブラリ）と状態。有効化・無効化・削除は**次の起動で効く**ので、変えたら上に「再起動」の帯が出る。
// 中身の正は C#（ModuleCatalog）。どの面で変えても modulesChanged で両方の面へ配られる。
// タブは「モジュール」（全部。行の右は「…」のメニュー 1 つ）と「更新」（「更新を確認」・最後に確かめた時刻・更新のある行）。
// **どのタブを開いているかは、この面だけが持つ**（覚えない）。

/** いま開いているタブ（modules / updates）。 */
let plTab = 'modules';

async function loadModuleCatalog() {
  renderModuleCatalog(await bridge.getModuleCatalog());
}

/**
 * 更新があって、まだ入れていない（次の起動で入る物も、削除の印も無い）。更新のタブに並ぶもの・タブとサイドバーの点で数えるもの。
 * 削除すると決めた物は数えない（「更新」を押す所が無い）。
 */
function moduleHasUpdate(entry) {
  return !!entry.update && !entry.pending && !entry.removing;
}

function renderModuleCatalog(catalog) {
  if (!catalog) return;
  el.plRestart.hidden = !catalog.restartNeeded;
  // 「再起動できませんでした」は、押したその時の知らせ。次に中身が変わったら、いつもの文に戻す。
  el.plRestartMsg.textContent = t('host.modules.restartNeeded');
