  const rows = catalog.entries.map(entry => moduleRow(entry, false));
  el.plList.replaceChildren(...(rows.length ? rows : [cell('spoitable-empty', t('host.modules.empty'))]));

  const updates = catalog.entries.filter(moduleHasUpdate);
  el.plUpdateList.replaceChildren(...(updates.length
    ? updates.map(entry => moduleRow(entry, true))
    : [cell('spoitable-empty', t('host.modules.update.none'))]));
  el.plUpdatesTab.textContent = updates.length ? t('host.modules.tab.updatesCount', updates.length) : t('host.modules.tab.updates');
  el.plCheckedAt.textContent = catalog.updatesCheckedAt
    ? t('host.modules.update.checkedAt', stamp(catalog.updatesCheckedAt))
    : t('host.modules.update.never');

  // 更新があるものが 1 つでもあれば、サイドバーの「モジュール」に点を出す（開いていなくても気付けるように）。
  el.sidebar.querySelector('.item[data-id="moduleManager"]')?.classList.toggle('has-update', updates.length > 0);
}

function selectModuleTab(tab) {
  plTab = tab;
  for (const button of el.plTabs.querySelectorAll('.spoitable-tab')) {
    const on = button.dataset.tab === tab;
    button.classList.toggle('spoitable-tab-on', on);
    button.setAttribute('aria-selected', String(on));
  }

  el.plList.hidden = tab !== 'modules';
  el.plUpdates.hidden = tab !== 'updates';
}

el.plTabs.addEventListener('click', event => {
  const tab = event.target.closest?.('.spoitable-tab[data-tab]');
  if (tab) selectModuleTab(tab.dataset.tab);
});

/** 更新のタブの、確かめている最中・確かめられなかったときの一言（確かめ終えたら消す。結果は一覧と時刻に出る）。 */
function showModuleCheckMessage(text, isError) {
  el.plCheckMsg.hidden = !text;
  el.plCheckMsg.classList.toggle('bad', !!isError);
  el.plCheckMsg.textContent = text ?? '';
}

el.plCheckBtn.addEventListener('click', async () => {
  el.plCheckBtn.disabled = true;
  showModuleCheckMessage(t('host.modules.update.checking'));
  try {
    const answer = await bridge.checkModuleUpdates();
    renderModuleCatalog(answer?.catalog);
    // 答えの返らなかった入れ元があるのに「更新はありません」とは言わない。
    showModuleCheckMessage(answer?.ok ? null : t('host.modules.update.failed'), !answer?.ok);
  } catch {
    showModuleCheckMessage(t('host.modules.update.failed'), true);
  } finally {
    el.plCheckBtn.disabled = false;
  }
});

// インストールしている途中のもの 1 つ = カード 1 枚（タブの上に積む）。何枚でも並んで進む。
// **状態の正は本体（ModuleInstallJobs）**。ここは配られたもの（moduleJobs）を描くだけなので、読み直しても・もう一方の面でも同じカードが出る。
// 本体へ返すのは「どの件の・どの質問（通し番号と種類）に・はい」だけ。何を Build するか・何をインストールするかは、本体がその件に持っている。
// 確かめ（Build するか・.NET SDK をダウンロードするか・インストールするか）は**モーダル**に出す。カードは「確認待ち」と「確認する」だけ。
// 更新も同じ道（行の「更新」が、その行の開発元の URL で件を作り、モーダルで追う）。

/** 描いた中でいちばん新しい通し番号。配られたものがこれより古ければ捨てる（配られる順は入れ替わることがある）。 */
let plJobsRevision = -1;

/** いま出ているカード（id → { node, key, job }）。**変わったカードだけ作り直す** — 量と時間は、その場で字とバーだけ直す。 */
const plJobCards = new Map();

/** モーダルを閉じて一覧のカードで追うことにした件。カードが出来たら、見える所まで巻く。 */
let plJobReveal = null;

/** 「.NET SDK {0} 以上」の数（本体から配られる）。 */
let plDotnetMajor = 10;

/** Build 中のカードの時間を進める timer（Build 中のカードがある間だけ回す）。 */
let plJobClock = 0;

/**
 * 「モジュールを追加」のモーダル（下の maModal の段）の、この面だけの状態。step: url / agree / job / refused（行の「更新」を始められなかった）。
 * jobId は ③ で追っている件、key は描いた中身の鍵（カードと同じ）。round は閉じるたびに進む回（閉じる前に頼んだものの答えを、開き直したあとで使わない）。
 */
const addModal = { step: null, url: '', jobId: null, key: null, busy: false, round: 0 };

const MEGABYTE = 1024 * 1024;

/** 量の単位と書き方: 10 MB 以上は整数の MB、1〜10 MB は小数 1 桁、1 MB 未満は KB（1 KB に満たないものは 1 KB）。 */
function moduleSizeFormat(scale) {
  if (scale >= 10 * MEGABYTE) return { unit: 'MB', show: bytes => String(Math.round(bytes / MEGABYTE)) };
  if (scale >= MEGABYTE) return { unit: 'MB', show: bytes => (bytes / MEGABYTE).toFixed(1) };
  return { unit: 'KB', show: bytes => String(bytes > 0 ? Math.max(1, Math.round(bytes / 1024)) : 0) };
}

/** 大きさ 1 つ（「290MB」「3.0MB」「120KB」）。 */
function moduleSize(bytes) {
  const format = moduleSizeFormat(bytes);
  return format.show(bytes) + format.unit;
}

/** 全部の量が分かっていて、ダウンロードした量がそれを超えていない（= 進んだ分のバーにできる）。 */
function moduleJobMeasured(job) {
  return job.total > 0 && job.bytes <= job.total;
}

/** ダウンロードした量（「12/48MB」）。全部の量が分からない・超えたときは、ダウンロードした量だけ。 */
function moduleJobAmount(job) {
  if (!moduleJobMeasured(job)) return job.bytes > 0 ? moduleSize(job.bytes) : '';
  const format = moduleSizeFormat(job.total);
  return format.show(job.bytes) + '/' + format.show(job.total) + format.unit;
}

/** 経った時間（「1:12」）。 */
function moduleJobElapsed(since) {
  const seconds = Math.max(0, Math.floor((Date.now() - since) / 1000));
  return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
}

/** 聞いている件か（Build するか・.NET SDK をダウンロードするか・インストールするか）。聞いていなければ null。 */
function moduleJobAsking(job) {
  return { askBuild: 'build', askSdk: 'sdk', askInstall: 'install' }[job.state] ?? null;
}

/**
 * 件が長い段に入ったか（Build・.NET SDK のダウンロードとインストール・Build の順番待ち）。入ったらモーダルを閉じて、一覧のカードで追う。
 * Build の頭の「.NET SDK を確かめる」は短く、このあとすぐ「ダウンロードしますか」が来ることがあるので、開いたまま。
 */
function moduleJobRunsLong(job) {
  if (job.state === 'building') return job.phase !== 'sdk';
  return job.state === 'sdkDownloading' || job.state === 'sdkInstalling' || job.state === 'queued';
}

/**
 * カード（とモーダル）を作り直すかを決める鍵。**ダウンロードした量は入れない** — 100 ms ごとに変わるので、その場で直す
 * （作り直すと、押している途中のボタンが差し替わって押下が落ちる）。
 */
function moduleJobKey(job) {
  return JSON.stringify([
    job.state, job.ask, job.askKind, job.title, job.commit, job.step, job.steps, job.phase, job.since, job.asset, job.sdkVersion,
    job.waitingFor, job.failedAt, job.error, job.note, job.staged, job.state === 'askSdk' ? job.total : 0, plDotnetMajor,
  ]);
}

function plBox(className, ...children) {
  const node = document.createElement('div');
  node.className = className;
  node.append(...children);
  return node;
}

function plButton(className, label, onClick) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = label;
  button.addEventListener('click', () => onClick(button));
  return button;
}

async function loadModuleJobs() {
  renderModuleJobs(await bridge.getModuleJobs());
}

/** 本体の答えが「通らなかった」・呼び出しが失敗した件を、いまの中身で描き直す（押せないボタンのまま残さない。カードもモーダルも）。 */
async function refreshModuleJob(id) {
  const card = plJobCards.get(id);
  if (card) card.key = null;
  if (addModal.jobId === id) addModal.key = null;
  try {
    await loadModuleJobs();
  } catch {
    // 本体に届かない。次に配られたときに描き直る。
  }
}

/** 件が聞いていることに「はい」と答える。答えるのは**その件が出したときの質問**（通し番号と種類）にだけ。 */
async function answerModuleJob(job, button) {
  button.disabled = true;
  try {
    if (await bridge.answerModuleJob(job.id, job.ask, job.askKind)) return;
  } catch {
    // 下で描き直す。
  }

  await refreshModuleJob(job.id);
}

/** キャンセル（進んでいるもの・聞いているもの）・閉じる（失敗して残っているもの）。カードは、本体から消えたと配られたときに消える。 */
async function cancelModuleJob(job, button) {
  button.disabled = true;
  try {
    if (await bridge.cancelModuleJob(job.id)) return;
  } catch {
    // 下で描き直す。
  }

  await refreshModuleJob(job.id);
}

async function retryModuleJob(job, button) {
  button.disabled = true;
  try {
    if (await bridge.retryModuleJob(job.id)) return;
  } catch {
    // 下で描き直す。
  }

  await refreshModuleJob(job.id);
}

function revealModuleJob() {
  const card = plJobReveal ? plJobCards.get(plJobReveal) : null;
  if (!card) return;

  plJobReveal = null;
  card.node.scrollIntoView({ block: 'nearest' });
}

/** ラベルを揃えた 2 列（確かめの中身）。rows = [ラベル, 値, 値の class]。 */
function moduleJobFacts(rows) {
  const facts = plBox('pl-job-facts');
  for (const [label, value, className] of rows) facts.append(cell('k', label), cell(className ? 'v ' + className : 'v', value));
  return facts;
}

/** 確かめの、文・2 列（parts）と「はい」のボタン（proceed。モーダルの足元に置く）。 */
function moduleJobQuestion(job, kind) {
  let question, rows, yes;
  if (kind === 'build') {
    question = t('host.modules.job.build.ask');
    rows = [
      [t('host.modules.job.label.reason'), t('host.modules.job.build.reason')],
      [t('host.modules.job.label.target'), t('host.modules.job.build.target', job.commit ?? ''), 'mono'],
      [t('host.modules.job.label.note'), t('host.modules.job.build.note'), 'note'],
    ];
    yes = t('host.modules.job.build.yes');
  } else if (kind === 'sdk') {
    question = job.total > 0
      ? t('host.modules.job.sdk.ask', plDotnetMajor, moduleSize(job.total))
      : t('host.modules.job.sdk.askNoSize', plDotnetMajor);
    rows = [
      [t('host.modules.job.label.from'), t('host.modules.job.sdk.from', job.sdkVersion ?? '')],
      [t('host.modules.job.label.extra'), t('host.modules.job.sdk.note'), 'note'],
    ];
    yes = t('host.modules.job.sdk.yes');
  } else {
    // この PC で Build したものは、開発元に「このPC上でBuild」と commit を出す（SHA-256 は、突き合わせる相手が無いので出さない）。
    const staged = job.staged ?? {};
    question = t('host.modules.job.install.ask', staged.name ?? '', staged.version ?? '');
    rows = [
      [t('host.modules.job.label.id'), (staged.id ?? '') + (staged.kind === 'library' ? ' · ' + t('host.modules.library') : ''), 'mono'],
      [t('host.modules.job.label.source'), staged.built
        ? t('host.modules.job.install.sourceBuilt', staged.repository ?? '')
        : t('host.modules.job.install.source', staged.repository ?? '', staged.tag ?? '', staged.asset ?? '')],
      staged.built
        ? [t('host.modules.job.label.commit'), staged.tag ?? '', 'mono']
        : [t('host.modules.job.label.sha'), staged.sha256 ?? '', 'mono'],
    ];
    if (staged.replacesBundled) rows.push([t('host.modules.job.label.replaces'), t('host.modules.add.replacesBundled', staged.replacesVersion ?? staged.id)]);
    else if (staged.replaces) rows.push([t('host.modules.job.label.replaces'), t('host.modules.add.replaces', staged.replacesVersion ?? staged.id)]);
    rows.push([t('host.modules.job.label.note'), t('host.modules.job.install.note'), 'note']);
    yes = t('host.modules.job.install.yes');
  }

  const proceed = plButton('spoitable-btn spoitable-btn-primary pl-job-yes', yes, button => answerModuleJob(job, button));
  // 答えたあと、本体が次へ進むまでの間（ask は 0）。もう一度は押せない。
  proceed.disabled = !job.ask;
  const parts = [cell('q', question), moduleJobFacts(rows)];
  // インストールの準備ができなかった。聞いたままにして、そう出す（もう一度押せる）。
  if (job.note === 'confirmFailed') parts.push(cell('pl-job-note', t('host.modules.add.confirmFailed')));
  return { parts, proceed };
}

/** 進んでいる件の、状態の行（手順・していること・中身・経った時間）とバー。 */
function moduleJobProgress(job) {
  let what;
  let detail = null;
  if (job.state === 'downloading') what = t('host.modules.job.downloading', job.asset ?? '');
  else if (job.state === 'sdkDownloading') what = t('host.modules.job.sdkDownloading', job.sdkVersion ?? '');
  else if (job.state === 'sdkInstalling') what = t('host.modules.job.sdkInstalling', job.sdkVersion ?? '');
  else if (job.state === 'building') {
    what = t('host.modules.job.building');
    detail = job.phase ? t('host.modules.job.phase.' + job.phase) : null;
  } else if (job.state === 'queued') what = t('host.modules.job.queued', job.waitingFor ?? '');
  else what = t('host.modules.job.looking');

  const status = plBox('pl-job-status');
  // 手順（1/2 → 2/2）は、.NET SDK が要るときだけ。待っている間は出さない。
  if (job.steps > 0 && job.state !== 'queued') status.append(cell('step mono', job.step + '/' + job.steps));
  status.append(cell('what', what));
  if (detail) status.append(cell('sep', '-'), cell('detail', detail));
  if (job.state === 'downloading' || job.state === 'sdkDownloading') status.append(cell('sep', '-'), cell('amount mono', ''));
  if (job.state === 'building' && job.since) status.append(cell('grow', ''), cell('time mono', moduleJobElapsed(job.since)));
  for (const sep of status.querySelectorAll('.sep')) sep.setAttribute('aria-hidden', 'true');

  // バー: 量が分かるものは進んだ分・分からないものは流れる・待っているものは空。
  const bar = plBox('pl-job-bar', document.createElement('i'));
  bar.setAttribute('aria-hidden', 'true');
  bar.dataset.kind = job.state === 'queued' ? 'idle' : 'flow';
  return [status, bar];
}

/** 失敗の見出し（赤いのはここだけ）と理由。 */
function moduleJobFailure(heading, reason) {
  return plBox('pl-job-fail', plBox('t', icon('i-alert'), cell('', heading)), cell('reason mono', reason ?? ''));
}

/** ダウンロードした量の字とバーを、その場で直す（カードもモーダルも作り直さない）。 */
function updateModuleJobAmount(node, job) {
  if (job.state !== 'downloading' && job.state !== 'sdkDownloading') return;

  const amount = node.querySelector('.pl-job-status .amount');
  if (amount) {
    const text = moduleJobAmount(job);
    amount.textContent = text;
    amount.hidden = !text;
    amount.previousElementSibling.hidden = !text;
  }

  const bar = node.querySelector('.pl-job-bar');
  if (!bar) return;
  const measured = moduleJobMeasured(job);
  bar.dataset.kind = measured ? 'part' : 'flow';
  bar.firstElementChild.style.width = measured ? (job.bytes / job.total * 100).toFixed(1) + '%' : '';
}

function moduleJobCard(job) {
  const card = document.createElement('section');
  card.className = 'pl-job';
  card.dataset.id = job.id;
  card.dataset.state = job.state;
  card.setAttribute('aria-label', job.title);

  const asking = moduleJobAsking(job);
  if (asking) card.dataset.asking = asking;

  // 頭: repo と commit（7 桁）。
  const who = plBox('who', cell('nm', job.title));
  if (job.commit) who.append(cell('commit mono', t('host.modules.job.commit', job.commit.slice(0, 7))));
  const head = plBox('pl-job-head', who);
  const body = plBox('pl-job-body', head);
  card.append(body);

  if (job.state === 'failed') {
    // 失敗は「閉じる」まで残す。赤いのは見出しの 1 行だけ。
    body.append(
      moduleJobFailure(t('host.modules.job.failed.' + (job.failedAt ?? 'install')), job.error),
      plBox('acts',
        plButton('spoitable-btn pl-job-retry', t('host.modules.job.retry'), button => retryModuleJob(job, button)),
        plButton('spoitable-btn spoitable-btn-ghost pl-job-close', t('common.ui.close'), button => cancelModuleJob(job, button))));
    return card;
  }

  if (asking) {
    // 確かめの中身はモーダルに出す。カードは「確認待ち」（何を聞いているか）と、その件のモーダルを開く「確認する」。
    head.append(
      plButton('spoitable-btn spoitable-btn-primary pl-job-review', t('host.modules.job.review'), () => trackModuleJob(job.id)),
      plButton('spoitable-btn spoitable-btn-ghost pl-job-cancel', t('host.modules.job.cancel'), button => cancelModuleJob(job, button)));
    const status = plBox('pl-job-status', cell('what', t('host.modules.job.waiting')), cell('sep', '-'),
      cell('detail', t('host.modules.job.waitingFor.' + asking)));
    status.querySelector('.sep').setAttribute('aria-hidden', 'true');
    body.append(status);
    return card;
  }

  head.append(plButton('spoitable-btn spoitable-btn-ghost pl-job-cancel', t('host.modules.job.cancel'), button => cancelModuleJob(job, button)));
  const [status, bar] = moduleJobProgress(job);
  body.append(status);
  card.append(bar);
  return card;
}

function renderModuleJobs(snapshot) {
  if (!snapshot || snapshot.revision < plJobsRevision) return;
  plJobsRevision = snapshot.revision;
  if (snapshot.dotnetMajor) plDotnetMajor = snapshot.dotnetMajor;

  const jobs = snapshot.jobs ?? [];
  const live = new Set(jobs.map(job => job.id));
  for (const [id, card] of plJobCards) {
    if (live.has(id)) continue;
    card.node.remove();
    plJobCards.delete(id);
  }

  // **変わっていないカードには触らない**（同じものでも入れ直すと、流れるバーの動きが頭に戻る）。足すのは、前のカードのすぐ後ろ。
  let previous = null;
  for (const job of jobs) {
    const key = moduleJobKey(job);
    let card = plJobCards.get(job.id);
    if (card?.key !== key) {
      const node = moduleJobCard(job);
      if (card) card.node.replaceWith(node);
      else if (previous) previous.after(node);
      else el.plJobs.prepend(node);
      card = { node, key };
      plJobCards.set(job.id, card);
    }

    card.job = job;
    updateModuleJobAmount(card.node, job);
    previous = card.node;
  }

  el.plJobsHead.hidden = jobs.length === 0;
  el.plJobsCount.textContent = jobs.length ? t('host.modules.jobs.remaining', jobs.length) : '';
  renderAddModalJob();
  tickModuleJobs();
  revealModuleJob();
}

/** Build 中の件の、経った時間を進める（カードとモーダル）。Build 中の件が無くなったら timer を止める。 */
function tickModuleJobs() {
  const shown = [...plJobCards.values()].map(card => [card.node, card.job]);
  const tracked = addModal.jobId ? plJobCards.get(addModal.jobId)?.job : null;
  if (tracked && !el.maModal.hidden) shown.push([el.maModal, tracked]);

  let building = false;
  for (const [node, job] of shown) {
    const time = job.state === 'building' && job.since ? node.querySelector('.pl-job-status .time') : null;
    if (!time) continue;

    building = true;
    time.textContent = moduleJobElapsed(job.since);
  }

  if (building && !plJobClock) plJobClock = setInterval(tickModuleJobs, 1000);
  else if (!building && plJobClock) {
    clearInterval(plJobClock);
    plJobClock = 0;
  }
}

// ① URL（「次へ」か Enter。本体が URL を確かめ、NG ならこの段のまま理由を出す）→ ② 同意（本体の設定で切っていれば飛ばす）→ ③ 件を追う。
// ③ は moduleJobs が配る中身を描く（カードと同じ鍵で、変わったときだけ作り直す）。件が台帳から消えた（インストールして次の起動へ・キャンセル）か、
// 長い段に入ったら閉じる。Esc・外側・「閉じる」は追うのをやめるだけで、件は止めない（止めるのは「キャンセル」）。
// **自分から開き直さない**（Build が終わって「インストールしますか」になっても、カードの「確認する」から開く）。

function showAddStep(step) {
  addModal.step = step;
  if (step !== 'job') {
    addModal.jobId = null;
    addModal.key = null;
    for (const name of ['id', 'state', 'asking']) delete el.maModal.dataset[name];
  }

  el.maModal.dataset.step = step;
  el.maUrlStep.hidden = step !== 'url';
  el.maAgreeStep.hidden = step !== 'agree';
  el.maJobStep.hidden = step !== 'job' && step !== 'refused';
  if (step === 'url' || step === 'agree') {
    el.maTitle.textContent = t('host.modules.add.title');
    el.maSub.hidden = true;
  }
}

function openAddModule() {
  el.maUrl.value = '';
  showAddUrlMessage(null);
  // 前の回の確かめが、まだ答えを待っていることがある（閉じたあとに返る答えは捨てる）。いまの回は押せる形から始める。
  addModal.busy = false;
  el.maNext.disabled = false;
  showAddStep('url');
  el.maModal.hidden = false;
  el.maUrl.focus();
}

/** 閉じる（件は止めない）。待っている答えは、回を進めて捨てる。 */
function closeAddModule() {
  el.maModal.hidden = true;
  addModal.round++;
  addModal.step = null;
  addModal.jobId = null;
  addModal.key = null;
  for (const name of ['id', 'state', 'asking', 'step']) delete el.maModal.dataset[name];
  el.maJobBody.replaceChildren();
  el.maJobFoot.replaceChildren();
}

/** URL の段の、欄の下の理由（見出しと、本体の文）。 */
function showAddUrlMessage(text, detail) {
  el.maUrlMsg.hidden = !text;
  el.maUrlMsg.replaceChildren(...(text ? [cell('t', text), ...(detail ? [cell('d', detail)] : [])] : []));
}

/** ①「次へ」: 本体に URL を確かめてもらい、通ったら ② か ③ へ。 */
async function submitAddUrl() {
  // 空のままでも本体に聞く（「URL ではない」と理由が出る。黙って何も起きないよりよい）。
  const url = el.maUrl.value.trim();
  if (addModal.busy) return;

  // 前の理由は消してから確かめ直す（残すと、直した URL にも前の理由が付いて見える）。
  const round = addModal.round;
  showAddUrlMessage(null);
  addModal.busy = true;
  el.maNext.disabled = true;
  try {
    let check;
    try {
      check = await bridge.checkModuleUrl(url);
    } catch (error) {
      check = { ok: false, problem: 'busy', error: String(error?.message ?? error) };
    }

    // 待っている間に閉じた（開き直していても、それは別の回）・段を移った。
    if (round !== addModal.round || addModal.step !== 'url') return;
    if (!check?.ok) {
      showAddUrlMessage(t(check?.problem === 'url' ? 'host.modules.add.badUrl' : 'host.modules.add.refused'), check?.error);
      return;
    }

    showAddUrlMessage(null);
    addModal.url = url;
    if (check.showAgreement) showAgreement();
    else await beginModuleJob(url, round);
  } finally {
    // 別の回の「押せない」は解かない（開き直したときに解いてある。いまの回が確かめている最中かもしれない）。
    if (round === addModal.round) {
      addModal.busy = false;
      el.maNext.disabled = false;
    }
  }
}

function showAgreement() {
  for (const box of [el.maAgreeRisk, el.maAgreeLiability, el.maAgreeHide]) box.checked = false;
  updateAgreement();
  showAddStep('agree');
  el.maAgreeRisk.focus();
}

/** 1 つ目と 2 つ目が入るまで「続ける」は押せない（3 つ目は任意）。 */
function updateAgreement() {
  el.maContinue.disabled = addModal.busy || !(el.maAgreeRisk.checked && el.maAgreeLiability.checked);
}

/** ②「続ける」: 3 つ目が入っていれば、次から同意の段を出さないと本体に覚えさせてから、件を始める。 */
async function continueAfterAgreement() {
  if (el.maContinue.disabled) return;

  const round = addModal.round;
  addModal.busy = true;
  updateAgreement();
  try {
    if (el.maAgreeHide.checked) {
      try {
        await bridge.hideModuleAgreement();
      } catch {
        // 覚えられなかった。今回は進める（次も聞く）。
      }
    }

    if (round === addModal.round && addModal.step === 'agree') await beginModuleJob(addModal.url, round);
  } finally {
    if (round === addModal.round) {
      addModal.busy = false;
      updateAgreement();
    }
  }
}

/**
 * URL から件を始めて（同じ repo の件がもうあれば、本体はそれを返す）、③ で追う。始められなければ ① に戻して理由を出す（URL は残す）。
 * <b>round</b> は始めたときのモーダルの回。待っている間に閉じたら、件は一覧のカードに任せて、モーダルは開き直さない。
 */
async function beginModuleJob(url, round) {
  let answer;
  try {
    answer = await bridge.startModuleJob(url);
  } catch (error) {
    answer = { ok: false, error: String(error?.message ?? error) };
  }

  if (round !== addModal.round || el.maModal.hidden) return;
  if (!answer?.ok) {
    showAddStep('url');
    showAddUrlMessage(t('host.modules.add.refused'), answer?.error);
    el.maUrl.focus();
    return;
  }

  el.maUrl.value = '';
  await trackModuleJob(answer.id, round);
}

/**
 * ③: その件を追う（追加・行の「更新」・カードの「確認する」）。閉じていれば開く。
 * <b>round</b>（追加から来たときだけ）: 取り直しを待っている間にモーダルが閉じたら、開き直さない。
 */
async function trackModuleJob(id, round) {
  // 始めたばかりの件は、まだ配られていないことがある（橋の答えと push は別の道）。取り直してから描く。
  if (!plJobCards.has(id)) {
    try {
      await loadModuleJobs();
    } catch {
      // 次に配られたときに描く。
    }
  }

  if (round !== undefined && round !== addModal.round) return;
  showAddStep('job');
  addModal.jobId = id;
  addModal.key = null;
  el.maModal.hidden = false;
  renderAddModalJob();
}

/** 追っている件を描く（配られるたびに呼ぶ）。消えた・長い段に入ったら閉じる。 */
function renderAddModalJob() {
  if (addModal.step !== 'job' || !addModal.jobId || el.maModal.hidden) return;

  const job = plJobCards.get(addModal.jobId)?.job;
  if (!job) {
    closeAddModule();
    return;
  }

  if (moduleJobRunsLong(job)) {
    // 一覧のカードを見える所まで巻く（配られたときに描くのと別に、「確認する」・行の「更新」から直に来たときもここを通る）。
    plJobReveal = job.id;
    closeAddModule();
    revealModuleJob();
    return;
  }

  const key = moduleJobKey(job);
  if (addModal.key !== key) {
    addModal.key = key;
    drawAddModalJob(job);
  }

  updateModuleJobAmount(el.maModal, job);
}

function drawAddModalJob(job) {
  const asking = moduleJobAsking(job);
  const modal = el.maModal;
  modal.dataset.id = job.id;
  modal.dataset.state = job.state;
  if (asking) modal.dataset.asking = asking;
  else delete modal.dataset.asking;

  // 頭: repo と commit（7 桁）。Build するか・インストールするかを聞くときは、下に 40 桁を出すので頭には出さない。
  el.maTitle.textContent = job.title;
  const commit = job.commit && asking !== 'build' && asking !== 'install' ? t('host.modules.job.commit', job.commit.slice(0, 7)) : '';
  el.maSub.textContent = commit;
  el.maSub.hidden = !commit;

  const cancel = () => plButton('spoitable-btn spoitable-btn-ghost pl-job-cancel', t('host.modules.job.cancel'), button => cancelModuleJob(job, button));
  let body, foot;
  if (job.state === 'failed') {
    // 「閉じる」は、カードと同じく失敗した件を閉じる（一覧にもう一度出さない）。
    body = [moduleJobFailure(t('host.modules.job.failed.' + (job.failedAt ?? 'install')), job.error)];
    foot = [
      plButton('spoitable-btn spoitable-btn-ghost pl-job-close', t('common.ui.close'), button => cancelModuleJob(job, button)), cell('spoitable-spacer', ''),
      plButton('spoitable-btn spoitable-btn-primary pl-job-retry', t('host.modules.job.retry'), button => retryModuleJob(job, button)),
    ];
  } else if (asking) {
    const { parts, proceed } = moduleJobQuestion(job, asking);
    body = parts;
    foot = [cancel(), cell('spoitable-spacer', ''), proceed];
  } else {
    // 調べている・ダウンロードしている・.NET SDK を確かめている。「閉じる」は追うのをやめるだけ（件は一覧のカードで進む）。
    body = moduleJobProgress(job);
    foot = [cancel(), cell('spoitable-spacer', ''), plButton('spoitable-btn ma-close', t('common.ui.close'), () => closeAddModule())];
  }

  const focused = el.maModal.contains(document.activeElement);
  el.maJobBody.replaceChildren(...body);
  el.maJobFoot.replaceChildren(...foot);
  // 描き直すと押せるものが替わる。焦点が中にあったか、まだどこにも無ければ、足元のいちばん左（キャンセル・閉じる）へ。
  // **決めるボタンには置かない**（Enter を続けて押しただけで、Build やインストールに同意したことにならないように）。
  if (focused || document.activeElement === document.body) el.maJobFoot.querySelector('button:not(:disabled)')?.focus();
}

/** 行の「更新」を始められなかった（もう 12 件ある・閉じている途中）。モーダルに理由を出す。 */
function showAddRefusal(title, error) {
  showAddStep('refused');
  el.maTitle.textContent = title;
  el.maSub.hidden = true;
  el.maJobBody.replaceChildren(moduleJobFailure(t('host.modules.add.refused'), error));
  el.maJobFoot.replaceChildren(cell('spoitable-spacer', ''), plButton('spoitable-btn spoitable-btn-primary ma-close', t('common.ui.close'), () => closeAddModule()));
  el.maModal.hidden = false;
  el.maJobFoot.querySelector('button')?.focus();
}

el.plAddBtn.addEventListener('click', openAddModule);
el.maUrlStep.addEventListener('submit', event => {
  event.preventDefault();
  submitAddUrl();
});
el.maUrlCancel.addEventListener('click', closeAddModule);
el.maBack.addEventListener('click', () => {
  showAddStep('url');
  el.maUrl.focus();
});
for (const box of [el.maAgreeRisk, el.maAgreeLiability]) box.addEventListener('change', updateAgreement);
el.maContinue.addEventListener('click', continueAfterAgreement);
// 外側（暗い地）を押しても閉じる（件は止めない）。
el.maModal.addEventListener('mousedown', event => { if (event.target === el.maModal) closeAddModule(); });

/** その行の開発元（GitHub）の URL。「更新」は、これで件を作る。 */
function moduleSourceUrl(entry) {
  return 'https://github.com/' + entry.source;
}

/** 行の「更新」: その行の開発元の URL で件を始めて、③ から追う（同意は聞かない）。 */
async function startModuleUpdate(entry) {
  let answer;
  try {
    answer = await bridge.startModuleJob(moduleSourceUrl(entry));
  } catch (error) {
    answer = { ok: false, error: String(error?.message ?? error) };
  }

  if (!answer?.ok) {
    showAddRefusal(entry.source, answer?.error);
    return;
  }

  await trackModuleJob(answer.id);
}

/** 状態の名前（ライブラリは「動いています」ではなく「共有しています」）。 */
function moduleStateKey(entry) {
  return 'host.modules.state.' + (entry.kind === 'library' && entry.state === 'running' ? 'library' : entry.state);
}

/** 次の起動で変わること（無ければ null）。 */
function moduleNextKey(entry) {
  if (entry.removing) return 'host.modules.next.remove';
  if (entry.enabled === entry.enabledAtStart) return null;
  return entry.enabled ? 'host.modules.next.on' : 'host.modules.next.off';
}

/**
 * 行の「…」の中身（右クリックのメニューと同じ部品。ページの中に描くので VR の窓にも出る）。
 * **押せないもの（同梱の削除・印で止まっている物の有効化）は、出したまま灰色にする**（右クリックのメニューと同じ決まり）。
 * 次の起動で入る物は、まだ入っていない物も、入っている物の上に入る物も「インストールをキャンセル」（どこから始めたかで呼び分けない）。
 */
function moduleMenuItems(entry) {
  const install = [];
  if (entry.pending) install.push({ id: 'cancelPending', labelKey: 'host.modules.cancelPending', enabled: true });
  if (moduleHasUpdate(entry)) install.push({ id: 'update', labelKey: 'host.modules.update.install', enabled: true });

  // まだ入っていない行には、有効化・無効化も削除も無い（インストールをキャンセルするだけ）。
  if (entry.state === 'pending') return install;

  const state = [
    entry.enabled
      ? { id: 'disable', labelKey: 'host.modules.menu.disable', enabled: entry.canToggle }
      : { id: 'enable', labelKey: 'host.modules.menu.enable', enabled: entry.canToggle },
    entry.removing
      ? { id: 'keep', labelKey: 'host.modules.menu.keep', enabled: entry.canRemove }
      : { id: 'remove', labelKey: 'host.modules.menu.remove', enabled: entry.canRemove },
  ];
  return install.length ? [...install, { separator: true }, ...state] : state;
}

async function runModuleMenu(entry, item) {
  if (item.id === 'update') {
    await startModuleUpdate(entry);
    return;
  }

  let catalog = null;
  if (item.id === 'cancelPending') catalog = await bridge.cancelPendingModule(entry.id);
  else if (item.id === 'enable' || item.id === 'disable') catalog = await bridge.setModuleEnabled(entry.id, item.id === 'enable');
  else if (item.id === 'remove' || item.id === 'keep') catalog = await bridge.setModuleRemoval(entry.id, item.id === 'remove');
  renderModuleCatalog(catalog);
}

/** 「…」のメニューを開いたボタン（開いている間だけ）。 */
let plMenuOwner = null;

/** 直前の押し下げが、開いているメニューのボタンそのものだったか（その押し下げでメニューは閉じるので、続く click で開き直さない）。 */
let plMenuReclick = null;

// **メニューの「外を押したら閉じる」より先に**見る。あちらは開くたびに window へ足されるので、ここで先に足しておけば先に呼ばれる
// （あちらが先だと、閉じたあとの押し下げしか見えず、同じボタンでもう一度押しても閉じられない）。
window.addEventListener('mousedown', event => {
  plMenuReclick = closeMenu && plMenuOwner?.contains(event.target) ? plMenuOwner : null;
}, true);

/** 行の右の「…」。押すと、ボタンの下に右端を揃えてメニューを出す（下に入りきらなければ上に）。開いている間にもう一度押すと閉じる。 */
function moduleMenuButton(entry) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'spoitable-btn spoitable-btn-icon spoitable-btn-ghost pl-more';
  button.setAttribute('aria-haspopup', 'menu');
  button.setAttribute('aria-label', t('host.modules.menu.title'));
  button.title = t('host.modules.menu.title');
  button.append(icon('i-more'));
  button.addEventListener('click', () => {
    if (plMenuReclick === button) {
      plMenuReclick = null;
      return;
    }

    const box = button.getBoundingClientRect();
    openContextMenu(moduleMenuItems(entry), box.left, box.bottom + 4, item => {
      plMenuOwner = null;
      runModuleMenu(entry, item).catch(error => console.error('モジュールの操作で例外', error));
    }, () => { plMenuOwner = null; });
    plMenuOwner = button;

    const menu = el.ctxMenu.getBoundingClientRect();
    const margin = 4;
    el.ctxMenu.style.left = Math.max(margin, Math.min(box.right - menu.width, window.innerWidth - menu.width - margin)) + 'px';
    if (box.bottom + margin + menu.height > window.innerHeight - margin) el.ctxMenu.style.top = Math.max(margin, box.top - margin - menu.height) + 'px';
  });
  return button;
}

/** 1 行。<b>inUpdates</b>（更新のタブ）なら、右に「更新」も直に置く（「…」の中にもある）。 */
function moduleRow(entry, inUpdates) {
  const row = document.createElement('div');
  row.className = 'pl-row spoitable-state';
  row.dataset.id = entry.id;
  row.dataset.state = entry.state;
  row.classList.toggle('next-off', !entry.enabled || entry.removing);

  const shownName = entry.kind === 'library' ? entry.name : moduleName(entry.id, entry.name);
  const title = plBox('pl-title', cell('nm', shownName));
  if (entry.version) title.append(cell('ver', entry.version));
  // 札は同梱のものだけ（入れたものに「追加」と出すと、入っている物でも状態（追加したところ）に読める）。
  if (entry.bundled) title.append(cell('tag', t('host.modules.bundled')));
  if (entry.kind === 'library') title.append(cell('tag', t('host.modules.library')));
  if (entry.overrides) title.append(cell('tag', t('host.modules.overrides')));

  const state = cell('pl-state', t(moduleStateKey(entry)));
  state.dataset.state = entry.state;

  const main = plBox('pl-main', title);
  if (shownName !== entry.id) main.append(cell('pl-id', entry.id));   // 名前と同じなら Id は重ねて出さない
  main.append(state);
  if (entry.reason) main.append(cell('pl-reason', entry.reason));
  if (entry.shared.length) main.append(cell('pl-shared', t('host.modules.shares', entry.shared.join(', '))));
  if (entry.source) {
    // この PC で build したものは、タグの代わりに commit（頭の 7 桁）。次の起動で入る物があれば、その入れ元（本体がそう渡す）。
    main.append(cell('pl-source', entry.built
      ? t('host.modules.source.built', entry.source, (entry.sourceTag ?? '').slice(0, 7))
      : t('host.modules.source', entry.source, entry.sourceTag ?? '')));
  }
  // 削除すると決めたものには、次の起動で入る版・更新は出さない（削除すると、次の起動で入る物は取り消される）。
  const updating = entry.pending && entry.state !== 'pending' && !entry.removing;
  // ソースから Build した物の更新は、版が変わらないことが多いので commit も出す。
  if (updating) main.append(cell('pl-next', entry.pendingCommit
    ? t('host.modules.next.updateCommit', entry.pending, entry.pendingCommit.slice(0, 7))
    : t('host.modules.next.update', entry.pending)));
  if (moduleHasUpdate(entry)) main.append(cell('pl-update', entry.built
    ? t('host.modules.update.availableCommit', entry.update.slice(0, 7))
    : t('host.modules.update.available', entry.update)));
  const next = moduleNextKey(entry);
  if (next) main.append(cell('pl-next', t(next)));

  const actions = plBox('pl-actions');
  if (inUpdates) actions.append(plButton('spoitable-btn spoitable-btn-small spoitable-btn-primary pl-update-btn', t('host.modules.update.install'), () => startModuleUpdate(entry)));
  if (moduleMenuItems(entry).length) actions.append(moduleMenuButton(entry));

  row.append(main, actions);
  return row;
}

el.plRestartBtn.addEventListener('click', async () => {
  el.plRestartBtn.disabled = true;
  try {
    // 立てられれば、このアプリはすぐ閉じる。立てられなかったときだけ、帯の文を言い換える。
    if (!(await bridge.restartApp())) el.plRestartMsg.textContent = t('host.modules.restartFailed');
  } finally {
    el.plRestartBtn.disabled = false;
  }
});

// 札は**状態の口から作る**。本体の分（ワールド・人数・動画の再生）もモジュールの分も同じ形で並ぶ。

// 本体の札。**状態の口の名前がそのまま見出しの翻訳キー**（host.world → 「いまのワールド」）。
const HOST_TILES = ['host.world', 'host.people', 'host.video'];

function tile(label, item, onClick) {
  const node = document.createElement(onClick ? 'button' : 'div');
  node.className = 'spoitable-tile';
  if (onClick) node.addEventListener('click', onClick);
  if (item) node.dataset.state = item.state;

  node.append(cell('spoitable-tile-label', label), cell('spoitable-tile-value', item?.text || '—'));
  const note = cell('spoitable-tile-note', item?.note ?? '');
  if (item?.state === 'warn' || item?.state === 'bad') note.classList.add('spoitable-tile-loud');
  node.appendChild(note);
  return node;
}

function renderDashboard() {
  const byId = new Map(statusItems.map(item => [item.id, item]));

  el.dashTiles.replaceChildren(
    ...HOST_TILES.map(id => tile(t(id), byId.get(id))),
    ...[...panels.keys()].filter(id => byId.has(id))
      .map(id => tile(moduleName(id, panels.get(id).name), byId.get(id), () => selectView(id))));

  // モジュールと接続。**本体のログを読んでいるか**も同じ並びに出す。
  const rows = [];
  const host = byId.get('host');
  rows.push(dashRow(icon('i-log'), t('host.dash.vrcLog'), host, host?.note));
  for (const [id, panel] of panels) {
    const svg = el.sidebar.querySelector(`.item[data-id="${CSS.escape(id)}"] .ico > :first-child`)?.cloneNode(true) ?? icon('i-panel');
    rows.push(dashRow(svg, moduleName(id, panel.name), byId.get(id), null, () => selectView(id)));
  }
  el.dashModules.replaceChildren(...rows);
}

function dashRow(svg, name, item, sub, onClick) {
  const row = document.createElement(onClick ? 'button' : 'div');
  row.className = 'drow';
  if (onClick) row.addEventListener('click', onClick);

  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.appendChild(svg);

  const text = document.createElement('span');
  text.className = 'text';
  text.append(cell('nm', name));
  if (sub) text.append(cell('sub', sub));

  const status = cell('st spoitable-state', '');
  paintStatus(status, item ?? { state: 'off', text: t('host.dash.noStatus') });

  row.append(ico, text, status);
  return row;
}

/** 最近の出来事。**畳んでいる種別は除いて**新しいものから少しだけ（ログ画面へ行けば続きがある）。 */
let recentAsked = 0;

async function refreshRecent() {
  const ask = ++recentAsked;
  const result = await bridge.queryLog(JSON.stringify({
    limit: 8, beforeId: null, linesBefore: null,
    excludeKinds: [...new Set([...hidden, 'ApiRequest'])].filter(kind => kind !== 'raw'),
    from: null, to: null, includeLines: false,
  }));
  if (ask !== recentAsked) return;

  const rows = (result.rows ?? []).filter(r => r.type !== 'line');
  if (rows.length === 0) {
    el.dashRecent.replaceChildren(cell('spoitable-empty', t('host.log.events.empty')));
    return;
  }

  el.dashRecent.replaceChildren(...rows.map(e => {
    const row = document.createElement('div');
    row.className = 'erow';
    row.dataset.kind = e.kind;
    const square = document.createElement('i');
    square.className = 'sq';
    row.append(cell('ts', clock(e.ts)), square, cell('k', kindLabel(e.kind)), cell('body', e.title));
    return row;
  }));
}

// 項目の定義も値も C# 側が持っている。ここは受け取った定義からコントロールを選んで並べるだけで、
// 確定した値を覚えない（覚えると、2 つのサーフェスのどちらが正か分からなくなる）。
//
// 知らない型でも画面から消さない。JSON のテキスト欄として出す。
// 「保存はされているのに画面に無い」が一番不親切なので。
//
// **触っただけでは何も起きない。** 変更は pending に溜めておき、「適用」を押したときに
// まとめて送る。1 つずつ送ると、関係する設定を 2 つ変えただけでモジュール側の作り直しが
// 2 回走ってしまう（hrs のデバイス指定と間隔がまさにそれ）。

const pending = new Map();   // "module\nkey" -> 値。確定するまでのメモ

// **畳みは値ではない。** 中の設定は畳んでも効いていて、見えなくなるだけ。
// なので pending にも適用にも乗らない。覚えるのはホストの設定（hiddenKinds と同じ置き方）。
//
// 出す / 出さない（モジュールが書いた式）は C# が計算して shown で渡してくる。
// ここが足すのは「畳んである入れ物の中にいるか」だけで、**条件そのものは見ない**。

const collapsed = new Set();   // "モジュール:宛先"（例 "hrs:Parameters"）

function collapseId(module, key) { return module + ':' + key; }

function applyCollapsedCategories(ids) {
  collapsed.clear();
  for (const id of ids ?? []) collapsed.add(id);
}

// 畳んである入れ物の中にいるか。宛先は Server.Auth.Url のように繋がっているので
// 前方一致で足りる。**見出しそのものは残る**（自分自身は前方一致に入らない）ので、
// 畳んだあとに開き直す手が消えることはない。
function insideCollapsed(module, key) {
  const head = module + ':';
  for (const id of collapsed)
    if (id.startsWith(head) && key.startsWith(id.slice(head.length) + '.')) return true;

  return false;
}

// 見え方は「C# が出すと言ったか」と「畳んだ親がいないか」の掛け合わせ。
// **掛け合わせるのはここ 1 か所だけ。** 描くときと聞き直したときに別々に書くと、
// 片方を直したときにもう片方で畳みが解ける。
//
// shown を行に持たせておくのは、畳みを押したときに**往復せずに**引き直すため。
function showRow(row, module, key, shown) {
  if (shown !== undefined) row.dataset.shown = shown === false ? 'no' : 'yes';

  // **hidden（display: none）にはしない。** 包みの行の高さを 0fr ⇄ 1fr で動かして、開け閉めともぬるっと畳む
  // 閉じた行は Tab も読み上げも入らない。
  const shut = row.dataset.shown === 'no' || insideCollapsed(module, key);
  row.closest('.cfg-row')?.classList.toggle('shut', shut);
  row.classList.toggle('shut', shut);
  row.inert = shut;
}

// 今出ている行に、畳みだけを当て直す。C# には聞かない。
function refreshCollapsed() {
  for (const group of el.cfgList.querySelectorAll('.cfg-group'))
    for (const row of group.querySelectorAll('.cfg-item'))
      showRow(row, group.dataset.module, row.dataset.key);
}

// 見出しの開閉。**その場で効かせて、覚えるのは後から投げる**
// （押してから動き出すまでに往復を挟まない。入/切のときと同じ約束）。
//
// **当たり判定は見出しの行ぜんぶ。** 矢印は目印であって的ではない
// 矢印は左端、入/切のチェックは右端にあるので、小さい的だと横断させることになる。
//
// **矢印は自前の listener を持たない。** 行が拾うので、押しても二重には切り替わらない。
// button のままにしてあるのは、キーボードで辿り着けて Enter / Space が click になるため。
function attachFold(row, module, key) {
  const id = collapseId(module, key);

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'fold';
  button.appendChild(icon('i-down'));   // 畳むと横を向く
  button.title = t('host.settings.fold');

  const sync = () => button.setAttribute('aria-expanded', String(!collapsed.has(id)));
  sync();

  row.classList.add('foldable');
  row.addEventListener('click', event => {
    // **入/切のチェックは別の操作。** 押した拍子に畳むと、入れたのか畳んだのか分からない
    // （今の製品には入/切と畳みを両方持つ設定が無いので、ここは契約のための備え）。
    if (event.target.closest('input')) return;

    if (collapsed.has(id)) collapsed.delete(id);
    else collapsed.add(id);

    sync();
    refreshCollapsed();
    bridge.setCollapsedCategories(JSON.stringify([...collapsed]));
  });

  return button;
}

function pendingKey(module, key) { return module + '\n' + key; }

/** 溜めをモジュールごとにまとめる（ホストへ送る形: { module: { key: value } }）。 */
function changesOf(entries) {
  const changes = {};
  for (const { module, key, value } of entries) (changes[module] ??= {})[key] = value;
  return changes;
}

function markPending(module, key, value, row, original) {
  const id = pendingKey(module, key);

  // 元の値に戻したら「変更」から外す。押す前に取り消せたのに件数だけ残る、を避ける。
  if (JSON.stringify(value) === JSON.stringify(original)) pending.delete(id);
  else pending.set(id, { module, key, value });

  row.classList.toggle('dirty', pending.has(id));
  renderApplyBar();
  paintActions();
  refreshVisibility();
}

// 入れ子を持つ設定があるときだけ、**当てたつもりの姿**を聞き直して出し入れを合わせる。
// 持たない設定しか無ければ 1 回も往復しない（今までの設定は全部こちら）。
//
// **描き直さない。** hidden を付け替えるだけにしてあるので、打ちかけの入力も、
// 溜めてある変更も、どこを触っていたかも残る。
//
// **押した分は待たせない。** 最初の 1 回はその場で走らせ、走っている間に来た分だけを
// 1 回にまとめる。
// 頭から間引くと、チェックを押してから中身が出るまでが目に見えて遅い。
// 文字を打つ間は往復が続くが、走っている間は何回打っても予約は 1 つ。
let refreshing = null;
let refreshQueued = false;

async function refreshVisibility() {
  if (!(window.__stkConfigs ?? []).some(g => g.items.some(i => i.kind === 'section'))) return;

  if (refreshing) { refreshQueued = true; return; }

  const changes = changesOf(pending.values());

  try {
    refreshing = bridge.previewConfigs(JSON.stringify(changes));

    for (const group of await refreshing)
      for (const item of group.items) {
        const row = el.cfgList.querySelector(
          `.cfg-group[data-module="${CSS.escape(group.module)}"] .cfg-item[data-key="${CSS.escape(item.key)}"]`);

        if (row) showRow(row, group.module, item.key, item.shown);
      }
  } finally {
    refreshing = null;
  }

  // 待っている間に触られていたら、最後の姿でもう一度だけ合わせる。
  if (refreshQueued) { refreshQueued = false; await refreshVisibility(); }
}

function renderApplyBar() {
  el.cfgApply.hidden = pending.size === 0;

  // 出ている間は通知の束を帯の上へ持ち上げる（右下の通知が「適用」を覆わないように）。
  document.body.classList.toggle('applying', pending.size > 0);
  el.cfgCount.textContent = pending.size ? t('host.settings.changed', pending.size) : '';
  markCfgNav();
}

/**
 * 読み直す。<b>keep</b> を渡したら、その溜め（値ごとに断られた欄）を残す: 溜めを当てたつもりの姿で描き（打った値のまま）、
 * 「元の値」は保存済みの値にする（元に戻したら溜めから外れる）。
 */
async function loadSettings({ keepScroll = false, keep = [] } = {}) {
  // 触りかけの変更を、別サーフェスの更新で消さない。
  pending.clear();
  renderApplyBar();

  // **読み直しても読んでいた場所に居る**。
  const top = el.cfgScroll.scrollTop;

  const saved = await bridge.getConfigs();
  const groups = keep.length ? withOriginals(await bridge.previewConfigs(JSON.stringify(changesOf(keep))), saved) : saved;
  window.__stkConfigs = groups;

  // 読み直している間に設定のモーダルが開いた — 作り直すと「完了」の溜めが外れた行に付くので、閉じるまで待たせる。
  if (settingsModalOpen()) { settingsRefreshMissed = true; return; }

  if (!groups.length) {
    el.cfgList.replaceChildren(cell('cfg-empty', t('host.settings.noModules')));
    el.cfgNav.replaceChildren();
    el.cfgToc.replaceChildren();
    el.cfgToc.hidden = true;
    cfgPageOf.clear();
    return;
  }

  const pages = pagesOf(groups);

  // **開いていたページのまま**（適用・取り消し・言語の切り替え・別の画面から戻ったとき）。そのページが無くなったら先頭へ。
  if (!pages.some(page => page.id === cfgPage)) cfgPage = pages[0].id;

  cfgPageOf.clear();
  for (const page of pages)
    for (const item of page.items) {
      cfgPageOf.set(pendingKey(page.module, item.key), page.id);
      if (item.toggle) cfgPageOf.set(pendingKey(page.module, item.toggle.key), page.id);
    }

  el.cfgList.replaceChildren(...pages.map(renderConfigPage));
  renderCfgNav(pages);
  applyCfgSearch();

  for (const entry of keep) {
    pending.set(pendingKey(entry.module, entry.key), entry);
    const key = CSS.escape(entry.key);
    const scope = `.cfg-group[data-module="${CSS.escape(entry.module)}"]`;
    el.cfgList.querySelector(`${scope} .cfg-item[data-key="${key}"], ${scope} .cfg-item[data-toggle-key="${key}"]`)?.classList.add('dirty');
  }
  if (keep.length) {
    renderApplyBar();

    // 動きの行は、溜めが空のうちに描いている。残した溜めに前提の設定（打ち替えたポートなど）があれば、ボタンを「変更を適用すると使えます」に戻す。
    paintActions();
  }

  if (keepScroll) el.cfgScroll.scrollTop = top;
}

/** 当てたつもりの姿（shown）の各項目に、保存済みの値（saved）を「元の値」として付ける。 */
function withOriginals(shown, saved) {
  for (const group of shown) {
    const before = saved.find(g => g.module === group.module)?.items ?? [];
    for (const item of group.items) {
      const was = before.find(i => i.key === item.key);
      if (!was) continue;
      if (item.toggle && was.toggle) item.toggle.original = was.toggle.value;
      if (item.value !== undefined) item.original = was.value;
    }
  }
  return shown;
}

/** 段の名前（持ち主ごと）。 */
function groupTitle(group) {
  return group.module === 'host' ? group.name : moduleName(group.module, group.name);
}

// **ページは、本体は束ね（SpoitableSettingsGroup）ごと、モジュールは 1 つで 1 枚。** 本体の項目は種類が多く、1 枚に並べると長すぎる。
// モジュールは中の束ねを右の目次で行き来する（ページを細かく割ると、1 つのモジュールの設定が一覧の中で散らばる）。
// ページは全部 DOM に置いたまま、開いていないページを隠すだけ（溜めた変更・畳み・打ちかけが残る）。

/** 開いているページ。**画面を離れても覚えている**（このページの間だけ。保存はしない）。 */
let cfgPage = null;

/** 項目（pendingKey）→ 載っているページ。一覧の「変更あり」の印を付けるのに使う。 */
const cfgPageOf = new Map();

/** 本体のページの Id。束ねのキーの最後の綴り（`host.settings.group.display` → `host:display`）。モジュールの Id には `:` が入らないので重ならない。 */
function hostPageId(groupKey) {
  return 'host:' + (groupKey ? groupKey.slice(groupKey.lastIndexOf('.') + 1) : '');
}

/** C# の段（持ち主ごと）を画面のページに分ける。並びは C# の順のまま（本体は束ねが初めて出た順）。 */
function pagesOf(groups) {
  const pages = [];
  for (const group of groups) {
    if (group.module !== 'host') {
      pages.push({ id: group.module, module: group.module, title: groupTitle(group), items: group.items, host: false });
      continue;
    }

    const byId = new Map();
    let id = hostPageId(null);
    for (const item of group.items) {
      // 入れ子の中の項目は親と同じページ（束ねは段の一番上の並びの話）。
      if (!item.depth) id = hostPageId(item.groupKey);
      if (!byId.has(id)) {
        const page = { id, module: 'host', title: item.group ?? groupTitle(group), items: [], host: true };
        byId.set(id, page);
        pages.push(page);
      }
      byId.get(id).items.push(item);
    }
  }
  return pages;
}

function renderConfigPage(page) {
  const section = document.createElement('section');
  section.className = 'cfg-group';
  section.dataset.module = page.module;
  section.dataset.page = page.id;

  // モジュールの見出しは名前と Id（Id は「読み込まないモジュール」などに打つ綴り）。本体のページは束ねの名前だけ。
  const head = document.createElement('div');
  head.className = 'cfg-head';
  const title = document.createElement('h2');
  title.textContent = page.title;
  head.append(title);
  if (!page.host) head.append(cell('id', page.module));
  section.appendChild(head);

  if (!page.items.length) {
    section.appendChild(cell('cfg-empty', t('host.settings.noItems')));
    return section;
  }

  // **束ねごとに囲みを分けて、見出しを付ける**（心拍の「心拍計 / 記録 / …」）。本体のページは束ね 1 つなので、見出しはページの名前で足りる。
  // 入れ子の中の項目は親と同じ囲みに入る。
  let box = null;
  let current;
  for (const item of page.items) {
    const name = item.depth ? current : (item.group ?? null);
    if (!box || name !== current) {
      current = name;
      if (name && !page.host) section.appendChild(cell('cfg-sub', name));
      box = document.createElement('div');
      box.className = 'cfg-box';
      section.appendChild(box);
    }
    box.appendChild(renderConfigItem(page.module, item));
  }

  if (page.host) addUpdateRow(section);

  return section;
}

function renderConfigItem(module, item) {
  const row = document.createElement('div');
  row.className = item.kind === 'section' ? 'cfg-item cfg-section' : 'cfg-item';
  row.dataset.key = item.key;

  // 包み。**行の高さを 0fr ⇄ 1fr で動かす**ための 2 枚（外が高さ、中が切り抜き）。閉じた行も DOM に残す。
  const wrap = document.createElement('div');
  wrap.className = 'cfg-row';
  const clip = document.createElement('div');
  clip.className = 'cfg-clip';
  wrap.appendChild(clip);
  clip.appendChild(row);

  // **出す / 出さないは C# が計算済み。** 条件はモジュールが書いたふつうの式なので、
  // ここでは評価できない（できるようにすると、条件の書ける形を狭めることになる）。
  // 畳みだけは画面の持ち物なので、ここで掛け合わせる。
  showRow(row, module, item.key, item.shown);

  // 入れ子の深さぶん字下げする。**行ごと消さずに隠す**ので、
  // 溜めてある変更はその行に残ったまま。
  if (item.depth) row.dataset.depth = Math.min(item.depth, 4);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const name = cell('name', item.label);

  // 「次の起動から」の札（説明文の中に書くだけだと、適用したのに効いていないのが不具合に見える）。
  if (item.restart) name.appendChild(cell('badge', t('host.settings.restart')));

  // 溜めている変更の印。**行の左の線と並べて**、どれを触ったかが一目で分かるように。
  name.appendChild(cell('chg', t('host.settings.changedMark')));
  meta.appendChild(name);
  if (item.description) meta.appendChild(cell('desc', item.description));

  // 見出し。**入/切を持つ入れ物なら、ここにチェックを出す** — ただの入/切のために
  // 行を 1 つ増やさない。
  if (item.kind === 'section') {
    if (item.foldable) row.appendChild(attachFold(row, module, item.key));

    row.appendChild(meta);

    if (item.toggle) {
      const control = document.createElement('div');
      control.className = 'ctl';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.className = 'spoitable-switch';
      box.checked = !!item.toggle.value;
      row.dataset.toggleKey = item.toggle.key;
      const original = item.toggle.original ?? item.toggle.value;
      box.addEventListener('change',
        () => markPending(module, item.toggle.key, box.checked, row, original));

      control.appendChild(box);
      row.append(control);
    }

    return wrap;
  }

  if (item.kind === 'action') {
    renderActionItem(module, item, row, meta);
    return wrap;
  }

  // 値は JSON 文字列で来る（C# の型のまま JS へ渡せないため）。
  // 「元の値」は、断られた欄を打った値のまま描き直したときだけ別に来る（保存済みの値。元に戻したら溜めから外す、のため）。
  const value = JSON.parse(item.value);
  const original = item.original !== undefined ? JSON.parse(item.original) : value;

  const control = document.createElement('div');
  control.className = 'ctl';
  control.appendChild(buildControl(item, value,
    next => markPending(module, item.key, next, row, original),
    message => noteFor(row, message)));

  row.append(meta, control);

  // ネイティブの `<select>` は VR の面に乗らない（別レイヤーで飛んでくる）ので、
  // **並べた直後に被せる**。ここは設定を開くたびに組み直されるので、作った側で呼ぶ。
  window.spoitablePick?.upgradeAll(control);

  // 一覧（タグ）は横幅いっぱいに下へ出す（短い欄に詰めると 2 つ目から読めない）。
  // モーダルで編集するもの（手首のショートカット・スイッチの一覧）は、ほかの欄と同じく右に置く。
  if (item.kind === 'list' && !opensModal(item)) row.classList.add('wide');

  return wrap;
}

// 値ではない行（SpoitableSettingsAction）。札・説明・押すとその場で動くボタン・コピーできる 1 行。
// **「適用」にも溜めにも乗らない。** ボタンは押した瞬間に C# で走り、行の姿は configAction の push で全部の面へ届く
// （走っている間は、押した面だけでなく全部の面でボタンを押せない）。
// 姿は作った順の番号（seq）を持つ。設定の材料を取りに行っている間に届いた push を古い材料で描き戻さないよう、大きい方を残す。

const actionStates = new Map();   // pendingKey(module, key) → いちばん新しい姿

/** 新しい方を覚えて返す。古い姿（seq が小さい）は捨てる。 */
function keepNewerAction(module, key, state) {
  const id = pendingKey(module, key);
  const known = actionStates.get(id);
  if (state && !(known && known.seq >= state.seq)) actionStates.set(id, state);
}

function renderActionItem(module, item, row, meta) {
  row.classList.add('cfg-action');
  row._dependsOn = item.dependsOn ?? [];

  // 探すときはこの 2 つだけに当てる（searchableText）。
  row._label = item.label ?? '';
  row._description = item.description ?? '';

  // 札は右（ほかの行の入力と同じ場所）。説明・ボタン・コピーは下に横幅いっぱい（VR の窓の狭い幅でも折り返す）。
  const control = document.createElement('div');
  control.className = 'ctl';
  const badge = cell('cfg-action-state', '');
  control.appendChild(badge);

  const body = document.createElement('div');
  body.className = 'cfg-action-body';
  const detail = cell('cfg-action-detail', '');

  const acts = document.createElement('div');
  acts.className = 'cfg-action-acts';
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'spoitable-btn spoitable-btn-small cfg-action-run';
  button.addEventListener('click', async () => {
    button.disabled = true;

    // 走り始めと終わりは push で届く。断られた（もう走っている・結ばれていない）ときは、覚えている姿に戻す。
    if (!await bridge.runConfigAction(module, item.key)) paintAction(module, row);
  });

  // 前提の設定を変えて、まだ適用していない間はボタンの代わりにこれを出す（姿はまだ前の値の話をしている）。
  const wait = cell('cfg-action-wait', t('host.settings.action.applyFirst'));
  const note = cell('cfg-action-note', '');
  acts.append(button, wait, note);

  const copyLine = document.createElement('div');
  copyLine.className = 'cfg-action-copy';
  const code = document.createElement('code');
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'spoitable-btn spoitable-btn-small cfg-action-copy-btn';
  copy.textContent = t('common.ui.copy');
  copy.addEventListener('click', async () => {
    const state = actionStates.get(pendingKey(module, item.key));
    if (!state?.copy || !await bridge.copyToClipboard(state.copy)) return;
    copy.textContent = t('common.ui.copied');
    setTimeout(() => { copy.textContent = t('common.ui.copy'); }, 1500);
  });
  copyLine.append(code, copy);

  body.append(detail, acts, copyLine);
  row.append(meta, control, body);
  row._action = { badge, body, detail, acts, button, wait, note, copyLine, code };

  keepNewerAction(module, item.key, item.state ? JSON.parse(item.state) : null);
  paintAction(module, row);
}

/** 覚えている姿を行に当てる。溜めの有無で変わるので、溜めが変わるたびにも呼ぶ（paintActions）。 */
function paintAction(module, row) {
  const parts = row._action;
  if (!parts) return;

  const state = actionStates.get(pendingKey(module, row.dataset.key)) ?? null;
  const waiting = row._dependsOn.some(key => pending.has(pendingKey(module, key)));
  const hasButton = !!state?.button;

  parts.badge.hidden = !state;
  parts.badge.dataset.tone = state?.tone ?? 'neutral';
  parts.badge.textContent = state?.status ?? '';

  parts.detail.hidden = !state?.detail;
  parts.detail.textContent = state?.detail ?? '';

  parts.acts.hidden = !hasButton;
  parts.button.hidden = waiting;
  parts.button.textContent = state?.button ?? '';
  parts.button.disabled = !!state?.running;
  parts.wait.hidden = !waiting;
  parts.note.hidden = waiting || !state?.buttonNote;
  parts.note.textContent = state?.buttonNote ?? '';

  parts.copyLine.hidden = !state?.copy;
  parts.code.textContent = state?.copy ?? '';

  parts.body.hidden = !(state?.detail || hasButton || state?.copy);
}

function paintActions() {
  for (const group of el.cfgList.querySelectorAll('.cfg-group'))
    for (const row of group.querySelectorAll('.cfg-item.cfg-action')) paintAction(group.dataset.module, row);
}

function applyActionPush({ module, key, state }) {
  keepNewerAction(module, key, state);

  // 本体の設定はページごとに段が分かれているが、宛先はモジュールの中で 1 つなので最初に当たった行でよい。
  const row = el.cfgList.querySelector(
    `.cfg-group[data-module="${CSS.escape(module)}"] .cfg-item[data-key="${CSS.escape(key)}"]`);
  if (row) paintAction(module, row);
}

/// 入力中の一言（書きかけの JSON など）を、その項目の下に出して差し替える。
function noteFor(row, message) {
  const existing = row.nextElementSibling;
  if (existing?.classList.contains('cfg-note')) existing.remove();

  row.classList.toggle('bad', !!message);
  if (!message) return;

  const line = document.createElement('div');
  line.className = 'cfg-note bad';
  line.textContent = message;
  row.after(line);
}

// 設定の「手首のショートカット」は汎用の欄ではなく、**「並べ替える…」のボタンだけ**。押すとモーダルが開く。
// 並べられるものは C# の台帳（getShortcuts）。並べた結果は文字列の一覧で、「完了」で設定の溜めに入る
// （いつもの「適用」の帯が出る）。**台帳に無い名前（外したモジュールなど）は捨てずに残し**、「入っていない」と出す
// — 黙って消すと、モジュールを入れ直したときに並びが戻らない。
//
// **掴んで動かすのは自前**（押す・動かす・離す）。HTML5 の drag は、VR の窓（画面の外に描く CEF）では始まらない
// （VrSurface.StartDragging が false を返す）。デスクトップ・VR の窓・試験の Mouse の 3 つが同じ実装で通る。
// つまみは `cursor: grab` — **VR の窓のレーザーは、掴む手の上で引くと巻かずに押す・動かす・離すを送る**（VrLaserTarget.Grabbable）。
// ページで掴んで動かすものを足すときも、`cursor: grab` を付ければ VR の窓で掴める。

const SC_PAGE = 6;                   // 手首の 1 ページに並ぶ数（wrist.html の MAX_COLS と同じ）
let shortcutCatalogue = [];
const shortcutValues = new Map();    // 名前 → { text, state }（台帳を引いた時点 + push の shortcutStatus）
let scState = null;                  // 開いている間: { placed, original, source, done }
let scDrag = null;                   // 掴んでいる間: { key, from, ghost }
let swState = null;                  // スイッチの一覧のモーダルが開いている間: { item, off, original, done }
let settingsRefreshMissed = false;   // 設定のモーダルが開いている間に、設定の読み直しを待たせた（閉じたら追いつく）

const settingsModalOpen = () => !!(scState || swState);

/** いま開いているモーダル（ログの絞り込み・手首のショートカット・スイッチの一覧・モジュールを追加）。無ければ null。焦点を中に留めるのに使う。 */
const openModal = () => [el.filterModal, el.shortcutModal, el.switchModal, el.maModal, $('updateNotesModal'), el.licenseModal].find(modal => !modal.hidden) ?? null;

/** 箱の中で Tab の焦点を受けられるもの（見えていて、押せて、inert の中でないもの）を DOM の順に。 */
function focusablesIn(box) {
  return [...box.querySelectorAll('button, input, select, textarea, a[href], [tabindex]')]
    .filter(node => !node.disabled && node.tabIndex >= 0 && node.getClientRects().length > 0 && !node.closest('[inert]'));
}

/** 設定のモーダルを閉じたあと、開いている間に別の所で適用された分に追いつく（溜めが無ければ。あれば次の「適用」でこちらの値が勝つ）。 */
function catchUpSettings() {
  if (!settingsRefreshMissed || settingsModalOpen()) return;
  settingsRefreshMissed = false;
  if (activeView === 'settings' && pending.size === 0) loadSettings({ keepScroll: true });
}

async function loadShortcutCatalogue() {
  shortcutCatalogue = await bridge.getShortcuts();
  for (const s of shortcutCatalogue) if (!shortcutValues.has(s.key)) shortcutValues.set(s.key, { text: s.text, state: s.state });
}

const scEntry = key => shortcutCatalogue.find(s => s.key === key) ?? null;

/** 名前。辞書のキーなら引く。無ければ作者の付けた名前、それも無ければ字のまま（手首のタイルと同じ）。 */
function scName(s) {
  return Object.prototype.hasOwnProperty.call(STRINGS, s.name) ? STRINGS[s.name] : (s.fallback ?? s.name);
}

const scLabel = key => (scEntry(key) ? scName(scEntry(key)) : key);

function scIcon(s) {
  if (s.hostIcon) return icon(s.hostIcon);
  if (s.iconPath) return pathIcon(s.iconPath);
  return cell('glyph', s.icon || scName(s).slice(0, 1));
}

/** 出どころ（右のタブ）。台帳の順（本体が先、モジュールは読み込み順）。 */
function scSources() {
  return [...new Set(shortcutCatalogue.map(s => s.source))];
}

const scSourceLabel = source => (source === 'host' ? t('host.nav.host') : moduleName(source, source));

/**
 * 設定画面の欄: 「並べ替える…」のボタンだけ（並びはモーダルで見る）。
 */
function buildShortcutField(item, initial, edited) {
  const box = document.createElement('div');
  box.className = 'cfg-shortcuts';

  let current = Array.isArray(initial) ? [...initial] : [];

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'spoitable-btn';
  button.textContent = t('host.settings.shortcuts.edit');
  button.addEventListener('click', () => openShortcutModal(current, list => {
    current = list;
    edited([...list]);
  }));

  box.append(button);
  return box;
}

async function openShortcutModal(initial, done) {
  await loadShortcutCatalogue();
  scState = { placed: [...initial], original: [...initial], source: scSources()[0] ?? 'host', done };
  renderShortcutModal();
  el.shortcutModal.hidden = false;
  el.scDone.focus();
}

/**
 * 閉じる。**「完了」以外で閉じたら何も残さない**（溜めにも入れない）。
 * 開いている間に別の所で適用された分は、閉じてから追いつく（溜めが無ければ。あれば次の「適用」でこちらの値が勝つ）。
 */
function closeShortcutModal() {
  endScDrag();
  el.shortcutModal.hidden = true;
  scState = null;
  catchUpSettings();
}

function renderShortcutModal() {
  if (!scState) return;
  const { placed, source } = scState;

  el.scCount.textContent = `(${placed.length})`;

  // 左: 手首に並ぶ順。6 つごとに「n ページ目」の線（手首で横に送る境目）。
  const left = [];
  placed.forEach((key, index) => {
    if (index > 0 && index % SC_PAGE === 0) left.push(cell('sc-page', t('host.settings.shortcuts.page', index / SC_PAGE + 1)));
    left.push(scPlacedRow(key));
  });
  if (placed.length === 0) left.push(cell('sc-empty', t('host.settings.shortcuts.empty')));
  el.scPlaced.replaceChildren(...left);

  // 真ん中: 選んだ出どころが名乗るもの。置いてあるものは掴めない（同じものは二度並ばない）。
  el.scSourceName.textContent = scSourceLabel(source);
  el.scOffered.replaceChildren(...shortcutCatalogue.filter(s => s.source === source).map(scOfferedRow));

  el.scSources.replaceChildren(...scSources().map(name => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'sc-src';
    tab.dataset.source = name;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(name === source));
    tab.textContent = scSourceLabel(name);
    tab.addEventListener('click', () => { scState.source = name; renderShortcutModal(); });
    return tab;
  }));
}

function scGrip(key, from) {
  const grip = document.createElement('span');
  grip.className = 'sc-grip';
  grip.title = t('host.settings.shortcuts.grip');
  grip.appendChild(icon('i-grip'));
  grip.addEventListener('mousedown', event => startScDrag(event, key, from));
  return grip;
}

function scValue(key) {
  const value = document.createElement('span');
  value.className = 'val spoitable-state';
  const current = shortcutValues.get(key);
  value.textContent = current?.text ?? '';
  value.dataset.state = current?.state ?? 'off';
  return value;
}

function scPlacedRow(key) {
  const s = scEntry(key);
  const row = document.createElement('div');
  row.className = 'sc-row' + (s ? '' : ' missing');
  row.dataset.key = key;

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'sc-x';
  remove.setAttribute('aria-label', t('common.ui.remove'));
  remove.title = t('common.ui.remove');
  remove.appendChild(icon('i-x'));
  remove.addEventListener('click', () => { scState.placed = scState.placed.filter(k => k !== key); renderShortcutModal(); });

  row.append(scGrip(key, 'placed'), s ? scIcon(s) : cell('glyph', '?'), cell('nm', s ? scName(s) : key));
  if (!s) row.append(cell('note', t('host.settings.shortcuts.missing')));
  row.append(scValue(key), remove);
  return row;
}

function scOfferedRow(s) {
  const placed = scState.placed.includes(s.key);
  const row = document.createElement('div');
  row.className = 'sc-row' + (placed ? ' placed' : '');
  row.dataset.key = s.key;
  row.append(placed ? cell('sc-grip off', '') : scGrip(s.key, 'offered'), scIcon(s), cell('nm', scName(s)));
  if (s.runs) row.append(cell('note', t('host.settings.shortcuts.runs')));
  if (placed) row.append(cell('note', t('host.settings.shortcuts.placedAlready')));
  return row;
}

/** 押した（つまみ）。離すまで、動かすたびに落ちる所を出す。 */
function startScDrag(event, key, from) {
  if (event.button !== 0 || !scState) return;
  event.preventDefault();

  const ghost = cell('sc-ghost', scLabel(key));
  document.body.appendChild(ghost);
  scDrag = { key, from, ghost };

  for (const row of el.shortcutModal.querySelectorAll(`.sc-row[data-key="${CSS.escape(key)}"]`)) row.classList.add('dragging');

  window.addEventListener('mousemove', moveScDrag);
  window.addEventListener('mouseup', dropScDrag);
  moveScDrag(event);
}

const scInside = (box, x, y) => {
  const r = box.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
};

/** 左へ落とす位置（掴んでいる行を除いた並びでの番号）。 */
function scDropIndex(y) {
  const rows = [...el.scPlaced.querySelectorAll('.sc-row')].filter(row => row.dataset.key !== scDrag.key);
  const at = rows.findIndex(row => {
    const r = row.getBoundingClientRect();
    return y < r.top + r.height / 2;
  });
  return { rows, index: at < 0 ? rows.length : at };
}

function moveScDrag(event) {
  if (!scDrag) return;
  const { clientX: x, clientY: y } = event;
  scDrag.ghost.style.left = x + 12 + 'px';
  scDrag.ghost.style.top = y + 8 + 'px';

  el.shortcutModal.querySelector('.sc-drop')?.remove();
  el.scOfferedCol.classList.remove('sc-drop-out');

  if (scInside(el.scPlacedCol, x, y)) {
    const { rows, index } = scDropIndex(y);
    const line = document.createElement('div');
    line.className = 'sc-drop';
    if (index < rows.length) rows[index].before(line);
    else el.scPlaced.appendChild(line);
  } else if (scDrag.from === 'placed' && scInside(el.scOfferedCol, x, y)) {
    // 真ん中へ引き戻したら外す（DnD どうしの対）。
    el.scOfferedCol.classList.add('sc-drop-out');
  }
}

function dropScDrag(event) {
  if (!scDrag) return;
  const { key, from } = scDrag;
  const { clientX: x, clientY: y } = event;

  if (scInside(el.scPlacedCol, x, y)) {
    const { index } = scDropIndex(y);
    const rest = scState.placed.filter(k => k !== key);
    rest.splice(index, 0, key);
    scState.placed = rest;
  } else if (from === 'placed' && scInside(el.scOfferedCol, x, y)) {
    scState.placed = scState.placed.filter(k => k !== key);
  }

  endScDrag();
  renderShortcutModal();
}

function endScDrag() {
  window.removeEventListener('mousemove', moveScDrag);
  window.removeEventListener('mouseup', dropScDrag);
  if (!scDrag) return;
  scDrag.ghost.remove();
  el.shortcutModal.querySelector('.sc-drop')?.remove();
  el.scOfferedCol.classList.remove('sc-drop-out');
  for (const row of el.shortcutModal.querySelectorAll('.sc-row.dragging')) row.classList.remove('dragging');
  scDrag = null;
}

/** タイルの中身が変わった（push）。覚えておき、開いていれば左の行の中身だけ書き換える。 */
function applyShortcutValues(items) {
  for (const item of items ?? []) {
    shortcutValues.set(item.key, { text: item.text, state: item.state });
    for (const value of el.scPlaced.querySelectorAll(`.sc-row[data-key="${CSS.escape(item.key)}"] .val`)) {
      value.textContent = item.text;
      value.dataset.state = item.state;
    }
  }
}

function buildControl(item, value, edited, note) {
  // この項目だけの編集のしかた（C# の SettingsEditorAttribute）。保存の形は変わらない。
  if (item.editor === 'wristShortcuts') return buildShortcutField(item, value, edited);

  if (item.kind === 'bool') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.className = 'spoitable-switch';
    input.checked = !!value;
    input.addEventListener('change', () => edited(input.checked));
    return input;
  }

  if (item.kind === 'int' || item.kind === 'number') {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = value;
    if (item.min !== null && item.min !== undefined) input.min = item.min;
    if (item.max !== null && item.max !== undefined) input.max = item.max;
    if (item.kind === 'number') input.step = 'any';
    input.addEventListener('input', () => edited(Number(input.value)));
    return input;
  }

  if (item.kind === 'enum') {
    const select = document.createElement('select');
    for (const choice of item.choices ?? []) {
      const option = document.createElement('option');
      option.value = option.textContent = choice;
      select.appendChild(option);
    }
    select.value = value;
    select.addEventListener('change', () => edited(select.value));
    return select;
  }

  if (item.kind === 'string') {
    const input = document.createElement('input');
    // 伏せる欄も**同じ文字列の欄**。値の受け渡しも溜め方も変わらず、見え方だけが違う。
    input.type = item.secret ? 'password' : 'text';
    // 伏せる欄は入れ物の記憶にも残さない。CEF に覚えさせても消す手が画面に無い。
    if (item.secret) input.autocomplete = 'off';
    input.value = value ?? '';
    input.addEventListener('input', () => edited(input.value));

    // 候補が無いなら包まない。欄が 1 つ増えて見えるだけで得が無い。
    // **伏せる欄には C# が端から候補を渡してこない**ので、ここで分ける必要は無い。
    if (!item.suggestions?.length) return input;

    const box = document.createElement('div');
    box.className = 'cfg-suggest-box';
    box.appendChild(input);

    attachSuggestions(box, input, () => item.suggestions ?? [], name => {
      input.value = name;
      edited(name);
    });

    return box;
  }

  // 文字列の一覧はタグで持つ。候補が来ていれば、打っている途中で下に出す。
  // 選べるものが決まっている一覧は、**候補ごとのスイッチ**（打たせない）。一覧は「切ってあるもの」。スイッチはモーダルに並べる。
  if (isSwitchList(item)) {
    return buildSwitchList(item, Array.isArray(value) ? value : [], edited);
  }

  if (item.kind === 'list' && item.itemKind === 'string') {
    return buildTagInput(item, Array.isArray(value) ? value : [], edited);
  }

  // 残りの list と、ホストが形を知らない型。JSON をそのまま編集させる。
  // 専用のコントロールが無いだけで、触れないわけではない。
  const area = document.createElement('textarea');
  area.spellcheck = false;
  area.value = JSON.stringify(value ?? null);
  area.addEventListener('input', () => {
    try {
      edited(JSON.parse(area.value));
      note(null);
    } catch (err) {
      // 書きかけの JSON を溜めない。押せる状態のまま壊れた値を送らないため。
      note(t('host.settings.badJson'));
    }
  });
  return area;
}

/// 候補を**入り切る側へ**開く。下に入り切らなければ上へ返す（pick.js の place と同じ考え方）。
///
/// 下端は窓の下ではなく、**適用の帯が出ていればその上端**。帯は画面の上に重なっているので、
/// 窓の下端で測ると帯の裏に潜る。
function openTowardsRoom(box, list) {
  list.classList.remove('up');

  const floor = el.cfgApply.hidden ? window.innerHeight : el.cfgApply.getBoundingClientRect().top;
  const below = box.getBoundingClientRect().bottom + 2 + list.getBoundingClientRect().height;

  if (below > floor) list.classList.add('up');
}

/// 入力欄の下に候補を出す。**選択肢ではない**ので、候補に無いものも打てる。
/// 文字列 1 つの欄とタグ入力で同じものを使う。
function attachSuggestions(box, input, suggestionsOf, pick) {
  const list = document.createElement('div');
  list.className = 'cfg-suggest';
  list.hidden = true;
  box.appendChild(list);

  function render() {
    const typed = input.value.trim().toLowerCase();
    const matches = suggestionsOf().filter(name => name.toLowerCase().includes(typed));

    list.hidden = matches.length === 0 || document.activeElement !== input;
    list.replaceChildren(...matches.map(name => {
      const option = document.createElement('button');
      option.type = 'button';
      option.textContent = name;

      // blur が click より先に来るので、mousedown で拾う（click だと閉じたあとになる）。
      option.addEventListener('mousedown', event => {
        event.preventDefault();
        pick(name);
        render();
      });

      return option;
    }));

    if (!list.hidden) openTowardsRoom(box, list);
  }

  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => { list.hidden = true; });

  return render;
}

/// 文字列の一覧をタグで編集する。候補（item.suggestions）は**選択肢ではない**ので、
/// 無いものも打てる（Enter で確定）。候補はホストが設定画面を開くたびに作り直している。
const isSwitchList = item => item.kind === 'list' && item.itemKind === 'string' && !!item.switches && !!item.suggestions?.length;

const opensModal = item => !!item.editor || isSwitchList(item);

/** 候補のうち入っている（「切ってあるもの」に無い）数。 */
const switchesOn = (names, off) => names.filter(name => !off.includes(name)).length;

/**
 * 候補ごとのスイッチ（「手首の帯に出すもの」「手首の通知に出すもの」）。
 * **一覧は切ってあるもの**として持つ（設定の名前が「出さないもの」なので）。候補に無い値が入っていても消さない。
 * <p>
 * 欄は<b>「n / m」と「選ぶ…」だけ</b>で、スイッチはモーダルに並べる（2 列のスイッチが設定の画面を圧迫するため）。
 * 設定の検索で候補の名前（「退室」など）を引けるよう、名前は見えない文字で欄に残す。
 * </p>
 */
function buildSwitchList(item, initial, edited) {
  const box = document.createElement('div');
  box.className = 'cfg-switch-field';

  let off = [...initial];
  const saved = [...initial];   // 保存してある値（「変更」はこれと並び込みで比べられる）

  const terms = cell('terms', item.suggestions.map(switchLabel).join(' '));
  terms.hidden = true;
  const count = cell('cnt', '');

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'spoitable-btn';
  button.textContent = t('host.settings.switches.edit');
  button.addEventListener('click', () => openSwitchModal(item, off, saved, list => {
    off = list;
    paint();
    edited([...list]);
  }));

  const paint = () => {
    count.textContent = t('host.settings.switches.count', switchesOn(item.suggestions, off), item.suggestions.length);
  };

  box.append(terms, count, button);
  paint();
  return box;
}

function switchRow(name, on, changed) {
  const row = document.createElement('label');
  row.className = 'cfg-switch';
  row.dataset.name = name;

  const text = document.createElement('span');
  text.className = 'nm';
  text.textContent = switchLabel(name);

  const sw = document.createElement('input');
  sw.type = 'checkbox';
  sw.className = 'spoitable-switch';
  sw.setAttribute('role', 'switch');
  sw.checked = on;
  sw.addEventListener('change', () => {
    row.classList.toggle('off', !sw.checked);
    changed(sw.checked);
  });

  row.classList.toggle('off', !on);
  row.append(text, sw);
  return row;
}

function openSwitchModal(item, initial, saved, done) {
  swState = { item, off: [...initial], original: [...initial], saved: [...saved], done };
  el.swTitle.textContent = item.label;
  el.swNote.textContent = item.description ?? '';
  renderSwitchModal();
  el.switchModal.hidden = false;
  el.swDone.focus();
}

/** 閉じる。**「完了」以外で閉じたら何も残さない**（溜めにも入れない）。 */
function closeSwitchModal() {
  el.switchModal.hidden = true;
  swState = null;
  catchUpSettings();
}

/**
 * 出どころごとの段に分けて並べる（ログの絞り込みと同じ形）。段の順は候補に出てくる順。
 * <p>
 * 手首の通知は「VRChat の出来事」「お知らせ」「アプリの記録」に分かれる — 1 つの格子に混ぜると、お知らせの「エラー」とアプリの「エラー」が
 * 同じ名前で並んで見分けられない。
 * </p>
 */
function renderSwitchModal() {
  if (!swState) return;
  const groups = new Map();
  for (const name of swState.item.suggestions) {
    const group = switchGroup(name);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(name);
  }

  el.swList.replaceChildren(...[...groups].map(([group, names]) => {
    const box = document.createElement('section');
    box.className = 'fsec sw-sec';
    box.dataset.group = group;

    const allOn = document.createElement('button');
    allOn.type = 'button';
    allOn.className = 'spoitable-link sw-on';
    allOn.textContent = t('host.settings.switches.allOn');
    allOn.addEventListener('click', () => setAllSwitches(true, names));
    const allOff = document.createElement('button');
    allOff.type = 'button';
    allOff.className = 'spoitable-link sw-off';
    allOff.textContent = t('host.settings.switches.allOff');
    allOff.addEventListener('click', () => setAllSwitches(false, names));

    const head = document.createElement('div');
    head.className = 'fsec-head';
    head.append(cell('h', switchGroupLabel(group)), cell('rule', ''), allOn, allOff);

    const grid = document.createElement('div');
    grid.className = 'cfg-switches';
    grid.append(...names.map(name => switchRow(name, !swState.off.includes(name), on => {
      swState.off = on ? swState.off.filter(v => v !== name) : [...swState.off, name];
      renderSwitchCount();
    })));

    box.append(head, grid);
    return box;
  }));
  renderSwitchCount();
}

function renderSwitchCount() {
  const { item, off } = swState;
  el.swCount.textContent = t('host.settings.switches.count', switchesOn(item.suggestions, off), item.suggestions.length);
}

/** 段の「全部入れる / 全部切る」。**その段の名前だけ**を動かす（ほかの段・候補に無い値（外したモジュールの分など）は触らない）。 */
function setAllSwitches(on, names) {
  if (!swState) return;
  const rest = swState.off.filter(v => !names.includes(v));
  swState.off = on ? rest : [...rest, ...names];
  renderSwitchModal();
}

/**
 * 「完了」。中身が<b>保存してある値と同じなら、その並びのまま渡す</b> — 「変更」は一覧を順序込みで比べるので、
 * 並びが変わると、中身が同じでも残る。比べる相手は開いたときではなく保存してある値
 * （一度「完了」したあとに開き直して戻したときも、「変更」が消えるように）。
 */
function finishSwitchModal() {
  const { done, off, saved } = swState;
  const same = off.length === saved.length && off.every(v => saved.includes(v));
  done(same ? [...saved] : [...off]);
  closeSwitchModal();
}

/** スイッチの名前。状態の口・VRChat の出来事・アプリのレベル・通知の種類・モジュールを、それぞれの辞書から引く。 */
function switchLabel(name) {
  const has = key => Object.prototype.hasOwnProperty.call(STRINGS, key);
  if (name === 'host') return t('host.dash.vrcLog');
  for (const prefix of ['host.log.kind.', 'host.log.level.', 'host.notify.kind.']) {
    if (has(prefix + name)) return t(prefix + name);
  }
  if (has(name)) return t(name);
  return moduleName(name, name);
}

/**
 * どこから来るものか（モーダルの段）。状態の口は「本体」「モジュール」、手首の通知は「VRChat の出来事」「お知らせ」「アプリの記録」
 * （お知らせの「エラー」とアプリのログの「エラー」が同じ名前なので、段で見分ける）。
 */
function switchGroup(name) {
  const has = key => Object.prototype.hasOwnProperty.call(STRINGS, key);
  if (has('host.log.kind.' + name)) return 'vrc';
  if (has('host.log.level.' + name)) return 'app';
  if (has('host.notify.kind.' + name)) return 'notify';
  if (name === 'host' || name.startsWith('host.')) return 'host';
  if (has(name + '.name') || panels.has(name)) return 'module';
  return 'other';
}

function switchGroupLabel(group) {
  if (group === 'host') return t('host.nav.host');
  if (group === 'module') return t('host.nav.modules');
  return t('host.settings.switches.section.' + group);
}

function buildTagInput(item, initial, edited) {
  const box = document.createElement('div');
  box.className = 'cfg-tags';

  const input = document.createElement('input');
  input.type = 'text';
  input.spellcheck = false;

  let values = [...initial];

  // 既に入っているものは候補に出さない。押しても何も起きない候補を並べても仕方がない。
  const refresh = attachSuggestions(box, input,
    () => (item.suggestions ?? []).filter(name => !values.includes(name)),
    add);

  function commit() {
    edited([...values]);
    render();
  }

  function add(value) {
    const name = value.trim();
    if (!name || values.includes(name)) return;
    values.push(name);
    input.value = '';
    commit();
  }

  function render() {
    const list = box.querySelector('.cfg-suggest');

    box.replaceChildren(...values.map(value => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.appendChild(document.createTextNode(value));

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = '×';
      remove.title = t('host.settings.removeTag', value);
      remove.onclick = () => {
        values = values.filter(v => v !== value);
        commit();
      };

      tag.appendChild(remove);
      return tag;
    }), input, list);

    refresh();
  }

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      add(input.value);
      return;
    }

    // 空のまま Backspace なら、最後のタグを外す。よくある操作なので合わせておく。
    if (event.key === 'Backspace' && input.value === '' && values.length) {
      values.pop();
      commit();
    }
  });

  render();
  return box;
}

// ホストが返した一言を、対象の項目の下に出す。
// 値だけ変わって理由が出ないと、利用者には壊れて見える（600 と打ったのに 30 になる、など）。
function showNotes(notes) {
  clearNotes();

  for (const note of notes ?? []) {
    // 名前はモジュールが決める（設定の保存名）。引用符などが入っていてもセレクタが壊れないように CSS.escape を通す（ほかの引き方と同じ）。
    // 本体はページが束ねごとに分かれているので、持ち主のページを全部見る。
    const sections = [...el.cfgList.querySelectorAll(`.cfg-group[data-module="${CSS.escape(note.module ?? '')}"]`)];
    if (!sections.length) continue;

    const line = document.createElement('div');
    line.className = 'cfg-note bad';
    line.textContent = note.message;

    // key が無いものはモジュール全体に対する一言（モジュールが変更のまとまりを却下した場合）。開いているページがその持ち主なら、そこに出す。
    const row = note.key
      ? sections.map(section => section.querySelector(`.cfg-item[data-key="${CSS.escape(note.key)}"]`)).find(found => found)
      : null;
    if (row) {
      row.classList.add('bad');
      row.after(line);
    } else {
      (sections.find(section => section.dataset.page === cfgPage) ?? sections[0]).querySelector('.cfg-head').after(line);
    }
  }

  markCfgNav();

  // **弾かれた理由が見えるページへ移る**（開いているページに無く、別のページにだけあるとき）。
  // 移らないと、適用を押しても帯が残るだけで、何が悪いのかが見えない。探している間は全部出ているので移らない。
  if (el.cfgSearch.value.trim()) return;
  const bad = [...el.cfgNav.querySelectorAll('.cfg-nav-item.bad')];
  if (bad.length && !bad.some(item => item.dataset.page === cfgPage)) selectCfgPage(bad[0].dataset.page);
}

function clearNotes() {
  for (const line of el.cfgList.querySelectorAll('.cfg-note')) line.remove();
  for (const row of el.cfgList.querySelectorAll('.cfg-item')) row.classList.remove('bad');
  markCfgNav();
}

async function commitSettings() {
  // モジュールごとにまとめる。断るのはモジュールで、値ごと（断られた値だけ前の値に残り、ほかは入る）。
  const changes = changesOf(pending.values());

  el.cfgCommit.disabled = true;
  try {
    const reply = await bridge.applyConfigChanges(JSON.stringify(changes));

    // 成功したときは**読んでいた場所のまま**描き直す。
    // 値ごとに断られたときは、入った欄（保存済み）を溜めから外して描き直し、断られた欄だけ打った値のまま残す（直してもう一度押せる）。
    // 何も入らなかった（読めない値・全部を断られた）ときは描き直さない。溜めていた変更を残す。
    if (reply.ok) await loadSettings({ keepScroll: true });
    else if (reply.applied?.length) {
      const entered = new Set(reply.applied.map(a => pendingKey(a.module, a.key)));
      await loadSettings({ keepScroll: true, keep: [...pending.entries()].filter(([id]) => !entered.has(id)).map(([, entry]) => entry) });
    }

    showNotes(reply.notes);
  } finally {
    el.cfgCommit.disabled = false;
  }
}
/** 開いている間の中身（{ app, thirdParty }。読めなかったものは null）。取っている間は null。 */
let licenses = null;
let licTab = 'app';

const LICENSE_FILES = { app: 'LICENSE', thirdParty: 'THIRD-PARTY-NOTICES.md' };

async function openLicenses() {
  licTab = 'app';
  licenses = null;
  el.licChromiumHint.hidden = !(IN_VR_WINDOW || IN_VR_DASHBOARD);
  renderLicenses();
  el.licenseModal.hidden = false;
  el.licClose.focus();

  const read = await bridge.getLicenses();
  if (el.licenseModal.hidden) return;
  licenses = read;
  renderLicenses();
}

function renderLicenses() {
  for (const tab of el.licTabs.children) {
    const on = tab.dataset.tab === licTab;
    tab.classList.toggle('spoitable-tab-on', on);
    tab.setAttribute('aria-selected', String(on));
  }

  el.licText.textContent = licenses === null ? t('common.ui.loading') : (licenses[licTab] ?? t('host.licenses.missing', LICENSE_FILES[licTab]));
  el.licBody.scrollTop = 0;
}

function closeLicenses() {
  el.licenseModal.hidden = true;
  licenses = null;
}

// 左の一覧。見出し（本体・モジュール）の下にページを 1 つずつ。見出しの形はアプリのサイドバーと同じ。

function renderCfgNav(pages) {
  const item = page => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'cfg-nav-item';
    button.dataset.page = page.id;
